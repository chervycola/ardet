<meta name="theme-color" content="#ffffff">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --panel2:#f0f0ee; --hair:#0a0a0a; --muted:#6b6b68;
    --line:#dcdcd7; --red:#E30613; --top-bg:rgba(255,255,255,.94); --nav-bg:#ffffff;
    --mono: ui-monospace,"SF Mono","Cascadia Code","Courier New",monospace;
    --grotesk:"Arial Narrow","Helvetica Neue",Arial,sans-serif;
    --sat: env(safe-area-inset-top,0px); --sab: env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="dark"]{
    --bg:#0b0b0b; --panel:#141414; --panel2:#1b1b1b; --hair:#ededed; --muted:#8a8a8a;
    --line:#2a2a2a; --red:#E30613; --top-bg:rgba(11,11,11,.92); --nav-bg:#000000;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg); color:var(--hair); font-family:var(--mono); font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
  .wrap{max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; position:relative;}

  .top{position:sticky; top:0; z-index:30; background:var(--top-bg); backdrop-filter:blur(6px);
    border-bottom:2px solid var(--hair); padding:calc(10px + var(--sat)) 14px 10px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand b{font-family:var(--grotesk); font-weight:800; font-size:20px; letter-spacing:.5px; text-transform:uppercase;}
  .menu-btn{background:none; border:1.5px solid var(--hair); padding:6px; line-height:0; cursor:pointer; color:var(--hair);}
  .menu-btn:active{background:var(--panel2);}

  .menu{position:absolute; top:calc(100% + 6px); right:14px; width:250px; background:var(--panel);
    border:2px solid var(--hair); z-index:35;}
  .menu[hidden]{display:none;}
  .mi{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:0;
    border-bottom:1px solid var(--line); padding:14px 16px; cursor:pointer; color:var(--hair);
    font-family:var(--grotesk); font-weight:800; font-size:16px; text-transform:uppercase; letter-spacing:.5px;}
  .mi:last-child{border-bottom:0;}
  .mi:active{background:var(--panel2);}
  .mi-tag{margin-left:auto; font-family:var(--mono); font-size:9.5px; letter-spacing:1px; color:#fff;
    background:var(--red); padding:2px 6px; text-transform:uppercase; font-weight:400;}
  .mi-div{height:2px; background:var(--hair);}

  main{flex:1; padding:14px 16px 96px;}
  .view{display:none; animation:in .18s ease;}
  .view.on{display:block;}
  @keyframes in{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}
  .vhead{display:flex; align-items:baseline; gap:10px; margin:4px 0 16px;}
  .vhead h2{font-family:var(--grotesk); font-weight:800; text-transform:uppercase; font-size:26px; letter-spacing:.5px; margin:0;}
  .vhead .n{font-size:12px; color:var(--muted); letter-spacing:1px;}
  .vrule{flex:1; height:2px; background:var(--line);}

  .pcard{display:grid; grid-template-columns:104px 1fr; gap:12px; background:var(--panel);
    border:2px solid var(--hair); padding:10px; margin-bottom:12px; cursor:pointer; position:relative;}
  .pcard:active{border-color:var(--red);}
  .thumb{position:relative; aspect-ratio:1/1; background:var(--panel2); overflow:hidden; border:1px solid var(--hair);}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(.12) contrast(1.04);}
  .tick{position:absolute; width:12px; height:12px; border:2px solid var(--red);}
  .t1{top:-1px; left:-1px; border-right:0; border-bottom:0;}
  .t2{bottom:-1px; right:-1px; border-left:0; border-top:0;}
  .meta{min-width:0;}
  .mrow{display:flex; align-items:center; gap:8px; margin-bottom:3px;}
  .idx{font-family:var(--grotesk); font-weight:800; font-size:18px; color:var(--red); line-height:1;}
  .slot{font-size:10.5px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; margin-left:auto;}
  .name{font-family:var(--grotesk); font-weight:800; text-transform:uppercase; font-size:22px; letter-spacing:.4px; margin:1px 0 3px; line-height:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dev{font-size:12px; color:var(--muted); letter-spacing:.3px; line-height:1.4;}
  .dev small{color:var(--muted);}
  .dev .colink{color:var(--red); text-decoration:underline; text-underline-offset:2px; cursor:pointer;}
  .dev-co{font-size:11px; letter-spacing:1px; text-transform:uppercase; line-height:1.2; margin-bottom:1px;}
  .dev-co .colink{color:var(--red); cursor:pointer;}
  .dev-co span{color:var(--muted);}
  .dkick{font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin:6px 0 2px;}
  .dkick .colink{color:var(--red); cursor:pointer;}
  .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px;}
  .tag{font-size:9.5px; letter-spacing:1px; text-transform:uppercase; border:1px solid var(--line); color:var(--muted); padding:2px 6px;}
  .tag.tbd{border-color:var(--red); color:var(--red);}

  .draft{border:1.5px dashed var(--red); color:var(--red); font-size:11px; letter-spacing:2px; text-transform:uppercase; padding:8px 10px; margin-bottom:14px; text-align:center;}
  .srow{display:grid; grid-template-columns:64px 1fr auto; gap:10px; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
  .srow:active{background:var(--panel);}
  .stime{font-family:var(--grotesk); font-weight:800; font-size:20px; letter-spacing:.5px;}
  .sname b{font-family:var(--grotesk); font-weight:800; font-size:16px; text-transform:uppercase; letter-spacing:.4px; display:block;}
  .sname span{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:1px;}
  .sstage{font-size:10px; letter-spacing:1px; color:var(--bg); background:var(--hair); padding:3px 7px; text-transform:uppercase; align-self:center;}
  .sstage.main{background:var(--red); color:#fff;}

  .card{border:2px solid var(--hair); background:var(--panel); padding:16px; margin-bottom:14px;}
  .evt .date{font-family:var(--grotesk); font-weight:800; font-size:40px; letter-spacing:.5px; line-height:.95;}
  .evt .place{font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-top:4px;}
  .chron{margin-top:16px;}
  .chron .cl{display:flex; justify-content:space-between; font-size:11px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; margin-bottom:6px;}
  .track{position:relative; height:16px; border:2px solid var(--hair);}
  .fill{position:absolute; top:0; left:0; bottom:0; background:var(--hair);}
  .ptr{position:absolute; top:-9px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:8px solid var(--red); transform:translateX(-6px);}
  .ticks{display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:4px;}
  .blurb{color:var(--muted); font-size:13px; line-height:1.6;}
  .blurb b{color:var(--hair); font-weight:400; border-bottom:1px solid var(--red);}
  .blurb+.blurb{margin-top:12px;}
  .prose-h{font-family:var(--grotesk); font-weight:800; text-transform:uppercase; font-size:22px; letter-spacing:.5px; margin:0 0 14px; line-height:1;}
  .princ{list-style:none; padding:0; margin:10px 0 0; counter-reset:p;}
  .princ li{counter-increment:p; display:flex; gap:10px; padding:7px 0; border-top:1px solid var(--line); font-size:13px;}
  .princ li::before{content:counter(p,decimal-leading-zero); color:var(--red); font-family:var(--grotesk); font-weight:800; min-width:26px;}

  .tabs{position:fixed; left:0; right:0; bottom:0; z-index:30; max-width:520px; margin:0 auto;
    display:grid; grid-template-columns:repeat(4,1fr); background:var(--nav-bg); border-top:2px solid var(--hair); padding-bottom:var(--sab);}
  .tabs button{background:none; border:0; appearance:none; -webkit-appearance:none; color:var(--muted);
    font-family:var(--grotesk); font-weight:800; text-transform:uppercase; letter-spacing:.2px; font-size:12.5px; padding:14px 2px; cursor:pointer; position:relative; white-space:nowrap;}
  .tabs button.on{color:var(--hair);}
  .tabs button.on::after{content:""; position:absolute; left:50%; transform:translateX(-50%); bottom:6px; width:20px; height:3px; background:var(--red);}

  .srow2{display:grid; grid-template-columns:56px 1fr auto; gap:10px; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line);}
  .srow2.tap{cursor:pointer;}
  .srow2.tap:active{background:var(--panel);}
  .stime2{font-family:var(--grotesk); font-weight:800; font-size:17px; letter-spacing:.5px; line-height:1;}
  .stime2 span{display:block; font-family:var(--mono); font-weight:400; font-size:9.5px; color:var(--muted); margin-top:3px;}
  .sinfo b{font-size:13.5px; font-weight:400; color:var(--hair); display:block; line-height:1.28;}
  .sinfo span{font-size:11px; color:var(--muted);}
  .sinfo .lk{font-style:normal; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--red);}
  .sroom{font-size:9px; letter-spacing:.5px; text-transform:uppercase; border:1px solid var(--hair); color:var(--hair); padding:3px 6px; white-space:nowrap; align-self:center;}
  .sroom.red{background:var(--red); color:#fff; border-color:var(--red);}
  .schedbar{display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; margin-bottom:4px; scrollbar-width:none;}
  .schedbar::-webkit-scrollbar{display:none;}
  .chip-r{flex:0 0 auto; background:var(--panel); border:1.5px solid var(--hair); color:var(--hair); font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:6px 10px; cursor:pointer; white-space:nowrap;}
  .chip-r.on{background:var(--red); color:#fff; border-color:var(--red);}
  .sroom{cursor:pointer;}
  .dlink.co{border-color:var(--red); color:var(--red);}
  .dnav{position:fixed; top:50%; transform:translateY(-50%); z-index:46; background:var(--red); color:#fff; border:0; width:32px; height:64px; font-size:24px; line-height:1; cursor:pointer; display:none; opacity:.93;}
  .dnav.on{display:block;}
  .dprev{left:0;} .dnext{right:0;}
  .detail{position:fixed; inset:0; z-index:40; background:var(--bg); max-width:520px; margin:0 auto; overflow-y:auto; display:none; flex-direction:column;}
  .detail.on{display:flex;}
  .dbar{position:sticky; top:0; background:var(--top-bg); backdrop-filter:blur(6px); border-bottom:2px solid var(--hair);
    padding:calc(10px + var(--sat)) 14px 10px; display:flex; align-items:center; gap:10px;}
  .back{background:none; border:1.5px solid var(--hair); color:var(--hair); font-family:var(--mono); font-size:12px; letter-spacing:1px; padding:6px 12px; cursor:pointer; text-transform:uppercase;}
  .dbar .dc{font-size:11px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-left:auto;}
  .dbody{padding:16px 16px calc(30px + var(--sab));}
  .dphoto{position:relative; border:2px solid var(--hair); background:#000; aspect-ratio:4/3; overflow:hidden; margin-bottom:2px;}
  .dphoto img{width:100%; height:100%; object-fit:cover; filter:grayscale(.1) contrast(1.05);}
  .dbrk{position:absolute; width:22px; height:22px; border:3px solid var(--red);}
  .b1{top:6px; left:6px; border-right:0; border-bottom:0;} .b2{top:6px; right:6px; border-left:0; border-bottom:0;}
  .b3{bottom:6px; left:6px; border-right:0; border-top:0;} .b4{bottom:6px; right:6px; border-left:0; border-top:0;}
  .dlabel{background:var(--hair); color:var(--bg); font-size:12px; letter-spacing:1px; padding:5px 10px; display:inline-block; margin-bottom:14px;}
  .didx{font-family:var(--grotesk); font-weight:800; font-size:20px; color:var(--red);}
  .dname{font-family:var(--grotesk); font-weight:800; text-transform:uppercase; font-size:40px; line-height:.95; letter-spacing:.5px; margin:8px 0 2px;}
  .drole{font-size:14px; color:var(--hair); letter-spacing:.5px;}
  .dwave{width:100%; height:34px; margin:14px 0; color:var(--hair);}
  .dgrid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); margin:6px 0 16px;}
  .dcell{background:var(--panel); padding:10px 12px;}
  .dcell .k{font-size:10px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase;}
  .dcell .v{font-family:var(--grotesk); font-weight:800; font-size:18px; text-transform:uppercase; margin-top:2px;}
  .dcell .v.red{color:var(--red);}
  .dblurb{color:var(--muted); font-size:14px; line-height:1.65;}

  .carousel{position:relative; margin-bottom:2px;}
  .cslides{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; border:2px solid var(--hair); background:#000; scrollbar-width:none;}
  .cslides::-webkit-scrollbar{display:none;}
  .cslide{flex:0 0 100%; scroll-snap-align:center; aspect-ratio:4/3;}
  .cslide img{width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(.1) contrast(1.05);}
  .cslide.empty{display:flex; align-items:center; justify-content:center; background:var(--panel2); color:var(--muted); font-size:12px; letter-spacing:2px; text-transform:uppercase;}
  .postmedia .cslide{aspect-ratio:4/5;}
  .postmedia .cslide img{object-fit:contain; background:#000;}
  .natcards .cslides{background:var(--panel);}
  .natcards .cslide{aspect-ratio:4/5;}
  .ncard{display:flex; flex-direction:column; height:100%; min-height:430px; padding:22px 20px 18px; background:var(--panel);}
  .ncard .nk{position:relative; z-index:1; font-family:var(--mono); font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--red);}
  .ncard h4{position:relative; z-index:1; font-family:var(--grotesk); font-weight:800; text-transform:uppercase; font-size:clamp(26px,9vw,40px); line-height:.95; letter-spacing:.5px; margin:10px 0 0; color:var(--hair);}
  .ncard h4 .r{color:var(--red);}
  .ncard .nwave{width:100%; height:auto; display:block; margin:-88px 0 4px; position:relative; z-index:0; color:var(--hair);}
  .ncard .nb{font-family:var(--mono); font-size:13.5px; line-height:1.62; color:var(--hair); margin-top:10px;}
  .ncard .nfoot{margin-top:auto; padding-top:18px; display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted);}
  .cdots{position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:6px; pointer-events:none;}
  .cdot{width:7px; height:7px; background:rgba(255,255,255,.55); border:1px solid #000;}
  .cdot.on{background:var(--red);}
  .cnav{position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.55); color:#fff; border:0; width:38px; height:54px; font-size:22px; cursor:pointer;}
  .cprev{left:0;} .cnext{right:0;}
  .tempty{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:10px; letter-spacing:1px; text-transform:uppercase;}
  .dframe{border:2px solid var(--hair); padding:16px 14px 14px; margin:16px 0 6px; position:relative;}
  .dframe .k{position:absolute; top:-10px; left:12px; background:var(--bg); padding:0 8px; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--red);}
  .dframe p{color:var(--hair); font-size:14px; line-height:1.62; margin:0;}
  .dframe p.ph{color:var(--muted);}
  .dframe p.pre{white-space:pre-line;}
  .prods{border:2px solid var(--hair); margin:16px 0 6px;}
  .prods-h{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--red); padding:9px 12px 2px;}
  .prod{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; background:none; border:0; border-top:1px solid var(--line); padding:12px; cursor:pointer; color:var(--hair); text-align:left;}
  .prods .prod:first-of-type{border-top:1px solid var(--line);}
  .prod:active{background:var(--panel2);}
  .prod-n{font-family:var(--grotesk); font-weight:800; font-size:20px; text-transform:uppercase; letter-spacing:.5px;}
  .prod-m{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:1px; white-space:nowrap;}
  .dlinks{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .dlink{display:inline-flex; align-items:center; gap:6px; border:2px solid var(--hair); color:var(--hair); background:var(--panel); font-family:var(--grotesk); font-weight:800; text-transform:uppercase; letter-spacing:.5px; font-size:13px; padding:8px 12px; cursor:pointer;}
  .dlink:active{border-color:var(--red);}
  .modal{position:fixed; inset:0; z-index:50; display:none; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.5);}
  .modal.on{display:flex; animation:in .16s ease;}

let LANG = store("ds_lang") || "ru";
const LANGS = ["ru","bratva","zoomer","soviet"];
const LANGNAME = { ru:"Русский", bratva:"Пацанский", zoomer:"Зумерский", soviet:"Надёжный" };
function t(k){ const o=L[LANG]; if(o && o[k]!=null) return o[k]; return (L.ru[k]!=null) ? L.ru[k] : k; }
let curModalKind=null, lastDetail=null;
function paintThemeName(){ const dark=document.documentElement.getAttribute("data-theme")==="dark"; const el=$("#themeName"); if(el) el.textContent = dark ? t("theme.dark") : t("theme.light"); }
function paintChrome(){
  document.querySelectorAll("[data-t]").forEach(el=>{ const k=el.getAttribute("data-t"), v=t(k); if(k==="forum.prose") el.innerHTML=v; else el.textContent=v; });
  const ln=$("#langName"); if(ln) ln.textContent = LANGNAME[LANG];
  paintThemeName();
  renderDevices(); renderSchedule(); renderForum(); renderPosts();
  if($("#modal").classList.contains("on") && curModalKind) openModal(curModalKind);
  if($("#detail").classList.contains("on") && lastDetail) lastDetail();
}
function setLang(l){ LANG=l; store("ds_lang",l); paintChrome(); haptic("light"); }
function cycleLang(){ setLang(LANGS[(LANGS.indexOf(LANG)+1)%LANGS.length]); }

function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  paintThemeName();
  const bg = t==="dark" ? "#0b0b0b" : "#ffffff";
  try{ tg && tg.setHeaderColor && tg.setHeaderColor(bg); tg && tg.setBackgroundColor && tg.setBackgroundColor(bg); }catch(e){}
  store("ds_theme", t);
}
function toggleTheme(){ applyTheme(document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark"); }

const menu = $("#menu");
function closeMenu(){ menu.hidden = true; }
$("#menuBtn").addEventListener("click", e=>{ e.stopPropagation(); menu.hidden=!menu.hidden; haptic("light"); });
document.addEventListener("click", e=>{ if(!menu.hidden && !menu.contains(e.target) && e.target.closest("#menuBtn")===null) closeMenu(); });
menu.querySelectorAll(".mi[data-m]").forEach(b=> b.addEventListener("click", ()=>{ closeMenu(); openModal(b.dataset.m); }));
$("#themeToggle").addEventListener("click", e=>{ e.stopPropagation(); toggleTheme(); haptic("light"); });
$("#langToggle").addEventListener("click", e=>{ e.stopPropagation(); cycleLang(); });
$("#scanBtn").addEventListener("click", e=>{ e.stopPropagation(); closeMenu(); scanQR(); });

function renderDevices(){
  $("#pcount").textContent = t("dev.count") + ": " + P.length;
  $("#plist").innerHTML = P.map(p => `
    <article class="pcard" onclick="openDetail('${p.id}')">
      <div class="thumb"><span class="tick t1"></span><span class="tick t2"></span>${(p.photos&&p.photos.length)?`<img loading="lazy" decoding="async" src="${photo(p.photos[0])}" alt="">`:`<div class="tempty">${t("empty.photo")}</div>`}</div>
      <div class="meta">
        <div class="mrow"><span class="idx">№${p.idx}</span><span class="slot">${EVENT.date.slice(0,5)} · ${p.time} · ${p.stage}</span></div>
        <div class="dev-co">${p.company?`<a class="colink" onclick="event.stopPropagation();openCompany('${p.company}')">${esc(cname(p.company))}</a>`:`<span>${esc(p.name||"Независимый автор")}</span>`}</div>
        <h3 class="name">${esc(p.device)}</h3>
        <div class="dev"><small>${[(p.company&&p.name)?esc(p.name):"", esc(p.sub), p.city?esc(p.city):""].filter(Boolean).join(" · ")}</small></div>
        <div class="tags">${p.tags.map(tg=>`<span class="tag">${esc(tg)}</span>`).join("")}${p.tbd?`<span class="tag tbd">${t("tag.tbd")}</span>`:''}</div>
      </div>
    </article>`).join("");
}
let schedRoom = null;
function filterRoom(r){ schedRoom = (r==="*") ? null : r; haptic("light"); renderSchedule(); window.scrollTo(0,0); }
function renderSchedule(){
  const used = Object.keys(ROOMS).filter(r=>r!=="all" && SCHED.some(s=>s.room===r));
  const chips = [["*","ВСЕ ЗАЛЫ"], ...used.map(r=>[r,ROOMS[r]])];
  $("#schedbar").innerHTML = chips.map(([r,l])=>`<button class="chip-r ${((schedRoom==null&&r==='*')||schedRoom===r)?'on':''}" onclick="filterRoom('${r}')">${l}</button>`).join("");
  const _onc=document.querySelector("#schedbar .chip-r.on"); if(_onc) _onc.scrollIntoView({inline:"center",block:"nearest"});
  const list = SCHED.filter(s => schedRoom==null || s.room===schedRoom || s.room==='all');
  const tap = s => s.author ? `class="srow2 tap" onclick="openAuthor('${s.author}')"` : s.go ? `class="srow2 tap" onclick="haptic('light');setView('${s.go}')"` : (s.link ? `class="srow2 tap" onclick="openDetail('${s.link}')"` : `class="srow2"`);
  $("#slist").innerHTML = list.map(s => `
    <div ${tap(s)}>
      <div class="stime2">${s.t}${s.e?`<span>${s.e}</span>`:""}</div>
      <div class="sinfo"><b>${esc(s.title)}</b>${s.who?`<span>${esc(s.who)}</span>`:""}${(s.author||s.go||s.link)?` <em class="lk">${t("sched.open")}</em>`:""}</div>
      <div class="sroom ${(s.room==='sb')?'red':''}" onclick="event.stopPropagation();filterRoom('${s.room}')">${ROOMS[s.room]}</div>
    </div>`).join("");
}
function renderForum(){
  $("#edate").textContent = EVENT.date; $("#eplace").textContent = EVENT.place;
  const n = POSTS.length, prog = Math.min(1, n / EVENT.total);
  $("#cposts").textContent = t("forum.post") + " " + String(n).padStart(2,"0") + " / " + EVENT.total;
  $("#cfill").style.width = (prog*100)+"%"; $("#cptr").style.left = (prog*100)+"%";
  $("#cticks").innerHTML = [0,.25,.5,.75,1].map(f=>`<span>${Math.round(EVENT.total*f)}</span>`).join("");
  const bt=$("#btickets");
  if(bt) bt.innerHTML = `${t("forum.tickets")}<span class="a">flat.audio ↗</span>`;
  const fa=$("#forumAbout");
  if(fa) fa.innerHTML =
    `<p class="blurb">${t("about.lead")}</p>`+
    `<ol class="princ"><li>${t("about.p1")}</li><li>${t("about.p2")}</li><li>${t("about.p3")}</li><li>${t("about.p4")}</li></ol>`+
    `<div class="btnrow"><button class="btn" onclick="openLink('${CONTACT.siteUrl}')">${t("about.site")}<span class="a">${esc(CONTACT.site)}</span></button></div>`;
}

function renderPosts(){
  const box = $("#postlist"); if(!box) return;
  if(!POSTS.length){ box.innerHTML = `<div class="pempty">${t("posts.empty")}</div>`; return; }

function initCarousel(n){
  const box=$("#cslides"); if(!box) return;
  const dots=[...document.querySelectorAll("#cdots .cdot")];
  const cur=()=>Math.round(box.scrollLeft/box.clientWidth);
  const go=i=>{ i=Math.max(0,Math.min(n-1,i)); box.scrollTo({left:i*box.clientWidth, behavior:"smooth"}); haptic("light"); };
  const pv=$("#cprev"), nx=$("#cnext");
  if(pv) pv.addEventListener("click",()=>go(cur()-1));
  if(nx) nx.addEventListener("click",()=>go(cur()+1));
  box.addEventListener("scroll",()=>{ const c=cur(); dots.forEach((d,i)=>d.classList.toggle("on",i===c)); },{passive:true});
}

    <div class="dframe"><span class="k">${t("frame.members")}</span>${(c.members && c.members.length) ? `<p>${c.members.map(m=>{const nm=(typeof m==="string")?m:m.name; const aid=(m&&m.a)?m.a:null; return (aid && A.find(x=>x.id===aid)) ? `<a class="colink" onclick="openAuthor('${aid}')">${esc(nm)}</a>` : esc(nm);}).join(", ")}</p>` : `<p class="ph">${t("ph.members")}</p>`}</div>
    ${devs.length ? `<div class="prods"><div class="prods-h">${t("frame.devices")} · ${devs.length}</div>${devs.map(p=>`<button class="prod" onclick="openDetail('${p.id}')"><span class="prod-n">${esc(p.device)}</span><span class="prod-m">${esc(p.sub||"")} ›</span></button>`).join("")}</div>` : ""}
    ${prods.length ? `<div class="prods"><div class="prods-h">${t("frame.products")} · ${prods.length}</div>${prods.map(pr=>`<button class="prod" onclick="openProduct('${c.id}','${pr.id}')"><span class="prod-n">${esc(pr.name)}</span><span class="prod-m">${pr.hp?esc(pr.hp)+" ":""}${pr.price?"· "+esc(pr.price)+" ":""}›</span></button>`).join("")}</div>` : ""}
    ${(c.links && c.links.length) ? `<div class="dlinks">${c.links.map(l=>`<button class="dlink" onclick="openAny('${l.u}')">${esc(l.t)} ↗</button>`).join("")}</div>` : ""}`;
  if(multi) initCarousel(slides.length);
  $("#detail").classList.add("on"); document.body.style.overflow="hidden"; syncBack();
}
function openProduct(cid, pid){
  const c = C.find(x=>x.id===cid); if(!c) return; const pr=(c.products||[]).find(x=>x.id===pid); if(!pr) return; haptic("light");
  lastDetail = ()=>openProduct(cid,pid);
  $("#ddc").textContent = t("badge.product"); showDevNav(false);
  const slides = (pr.photos && pr.photos.length) ? pr.photos : [];
  const slidesHTML = slides.length ? slides.map(k=>`<div class="cslide"><img loading="lazy" decoding="async" src="${photo(k)}" alt="" onclick="openLightbox('${k}')"></div>`).join("") : `<div class="cslide empty">${t("empty.photo")}</div>`;
  $("#dbody").innerHTML = `
    <div class="carousel"><div class="cslides">${slidesHTML}</div><span class="dbrk b1"></span><span class="dbrk b2"></span><span class="dbrk b3"></span><span class="dbrk b4"></span></div>
    <span class="dlabel">${esc(c.name)}${pr.hp?" · "+esc(pr.hp):""}</span>${WAVE}
    <h1 class="dname" style="margin-top:0">${esc(pr.name)}</h1>
    ${pr.price?`<div class="drole">${esc(pr.price)}</div>`:""}
    <div class="dframe"><span class="k">${t("frame.desc")}</span><p class="pre">${esc(pr.desc||"")}</p></div>
    <div class="dlinks"><button class="dlink co" onclick="openCompany('${c.id}')">${t("btn.companyOf")}${esc(c.name)} ↗</button></div>`;
  $("#detail").classList.add("on"); document.body.style.overflow="hidden"; syncBack();
}
// ===== QR: сканер стойки + диплинки (d_<id> / a_<id> / c_<id>) =====
function routeToken(txt){
  if(!txt) return false;
  const t=(""+txt).trim();
  const mt = t.match(/\bt[_:\/-](forum|posts|devices)\b/i);
  if(mt){ setView(mt[1].toLowerCase()); return true; }
  const m = t.match(/(?:startapp=|[#\/])?\b([dac])[_:\/-]([a-zA-Z0-9_-]+)/);
  if(m){ const k=m[1].toLowerCase(), id=m[2];
    if(k==="d" && P.find(p=>p.id===id)){ openDetail(id); return true; }
    if(k==="a" && A.find(a=>a.id===id)){ openAuthor(id); return true; }
    if(k==="c" && C.find(c=>c.id===id)){ openCompany(id); return true; }
  }
  if(P.find(p=>p.id===t)){ openDetail(t); return true; }
  return false;
}
function manualScan(){ const t=prompt("Код прибора со стойки (напр. archeon или d_archeon):"); if(t && !routeToken(t)){ try{ tg && tg.showAlert ? tg.showAlert("Код не найден: "+t) : alert("Код не найден: "+t); }catch(e){} } }
function scanQR(){
  if(tg && tg.showScanQrPopup){
    try{ tg.showScanQrPopup({text:"Наведите на QR у стойки прибора"}, (txt)=>{ if(routeToken(txt)){ try{tg.closeScanQrPopup();}catch(e){} return true; } return false; }); }
    catch(e){ manualScan(); }
  } else manualScan();
}
function lbOpen(){ return $("#lightbox").classList.contains("on"); }
function openLightbox(key){ const src=photo(key); if(!src) return; haptic("light"); $("#lbimg").src=src; $("#lightbox").classList.add("on"); document.body.style.overflow="hidden"; syncBack(); }
function closeLightbox(){ $("#lightbox").classList.remove("on"); $("#lbimg").src=""; document.body.style.overflow = ($("#detail").classList.contains("on")||$("#modal").classList.contains("on")) ? "hidden" : ""; syncBack(); }
$("#lightbox").addEventListener("click", e=>{ if(e.target.id==="lightbox"||e.target.id==="lbimg") closeLightbox(); });
$("#lbclose").addEventListener("click", e=>{ e.stopPropagation(); closeLightbox(); });
function anyOpen(){ return lbOpen() || $("#modal").classList.contains("on") || $("#detail").classList.contains("on"); }
function closeTop(){ if(lbOpen()) closeLightbox(); else if($("#modal").classList.contains("on")) closeModal(); else if($("#detail").classList.contains("on")) closeDetail(); }
function syncBack(){ if(!tg || !tg.BackButton) return; anyOpen() ? tg.BackButton.show() : tg.BackButton.hide(); }
if(tg && tg.BackButton){ tg.BackButton.onClick(closeTop); }

function setView(v){
  document.querySelectorAll(".view").forEach(el=>el.classList.remove("on"));
  $("#v-"+v).classList.add("on");
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  window.scrollTo(0,0);
}
document.querySelectorAll(".tabs button").forEach(b=> b.addEventListener("click", ()=>{ haptic("light"); setView(b.dataset.v); }));

if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }
applyTheme(store("ds_theme") || (tg && tg.colorScheme==="dark" ? "dark" : "light"));
paintChrome();
try{
  const qp = new URLSearchParams(location.search);
  const sp = (tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)
           || qp.get("k") || qp.get("startapp")
           || decodeURIComponent((location.hash||"").replace(/^#/,""));
  if(sp) routeToken(sp);
}catch(e){}
</script>
