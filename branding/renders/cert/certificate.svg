<polyline points="96,570 241,570 241,562 323,562 323,578 390,578 390,570 501,570 501,554 573,554 573,586 636,586 636,562 718,562 718,594 814,594 814,578 887,578 887,570 1012,570 1012,554 1089,554 1089,578 1157,578 1157,562 1248,562 1248,586 1321,586 1321,570 1427,570 1427,562 1513,562 1513,570 1658,570" fill="none" stroke="#000" stroke-width="3"/>

