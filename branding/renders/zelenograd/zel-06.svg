<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif">
<defs>
  <g id="logoD" shape-rendering="crispEdges" transform="scale(0.66667)">
    <rect x="10" y="0" width="2" height="12"/><rect x="2" y="0" width="8" height="2"/><rect x="4" y="2" width="2" height="4"/>
    <rect x="2" y="6" width="2" height="2"/><rect x="0" y="8" width="12" height="2"/><rect x="0" y="10" width="2" height="2"/>
  </g>
  <pattern id="th" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="12" height="12" fill="#f4f4f4"/>
    <line x1="0" y1="0" x2="0" y2="12" stroke="#e3e3e3" stroke-width="4"/>
  </pattern>
</defs>
<rect width="1080" height="1350" fill="#FFFFFF"/>
<rect x="20" y="20" width="1040" height="1310" fill="none" stroke="#000" stroke-width="2"/>

<use href="#logoD" fill="#000" transform="translate(410,34) scale(4.0)"/>
<text x="456" y="72" font-weight="800" font-size="46" letter-spacing="1" fill="#000">ДИСКРЕТ</text>
<text x="1020" y="66" text-anchor="end" font-family="'Courier New',monospace" font-size="19" letter-spacing="2" fill="#000">ПОЧЕМУ ЗЕЛЕНОГРАД</text>
<line x1="60" y1="96" x2="1020" y2="96" stroke="#000" stroke-width="2"/>
<text x="1020" y="134" text-anchor="end" font-family="'Courier New',monospace" font-size="20" letter-spacing="3" fill="#E30613">06 / 06</text>

<!-- дискретные модули (равная высота, стоят на линии) -->
<rect x="682" y="152" width="88" height="18" fill="#ececec" stroke="#c9c9c9" stroke-width="2"/><rect x="694" y="170" width="64" height="406" fill="url(#th)" stroke="#c9c9c9" stroke-width="2"/>
<rect x="788" y="152" width="88" height="18" fill="#ececec" stroke="#c9c9c9" stroke-width="2"/><rect x="800" y="170" width="64" height="406" fill="url(#th)" stroke="#c9c9c9" stroke-width="2"/>
<rect x="894" y="152" width="88" height="18" fill="#ececec" stroke="#c9c9c9" stroke-width="2"/><rect x="906" y="170" width="64" height="406" fill="url(#th)" stroke="#c9c9c9" stroke-width="2"/>

<text x="60" y="206" font-family="'Courier New',monospace" font-size="27" letter-spacing="5" fill="#E30613">· ЭТО ДИСКРЕТ</text>
<text x="56" y="350" font-weight="800" font-size="140" letter-spacing="1" fill="#000">СХЕМА</text>
<text x="56" y="492" font-weight="800" font-size="140" letter-spacing="1" fill="#E30613">И СВЯЗИ</text>

<!-- непрерывная линия + локальное событие + красный акцент -->
<circle cx="60" cy="576" r="5" fill="#E30613"/><line x1="66" y1="576" x2="1020" y2="576" stroke="#000" stroke-width="3"/><line x1="758" y1="300" x2="800" y2="300" stroke="#000" stroke-width="3"/><line x1="864" y1="430" x2="906" y2="430" stroke="#000" stroke-width="3"/><circle cx="758" cy="300" r="5" fill="#E30613"/><circle cx="800" cy="300" r="5" fill="#E30613"/><circle cx="864" cy="430" r="5" fill="#E30613"/><circle cx="906" cy="430" r="5" fill="#E30613"/>

<text x="60" y="664" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">Название говорит само за себя. Устройство</text>
<text x="60" y="720" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">— это отдельные элементы и связи между</text>
<text x="60" y="776" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">ними. Форум собран так же: авторы,</text>
<text x="60" y="832" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">приборы, лекции, мастерские и посетители</text>
<text x="60" y="888" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">образуют общий рабочий контур. Схема</text>
<text x="60" y="944" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">выходит из мастерской и становится общим</text>
<text x="60" y="1000" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">разговором.</text>

<line x1="60" y1="1214" x2="1020" y2="1214" stroke="#000" stroke-width="2"/>
<text x="60" y="1258" font-family="'Courier New',monospace" font-size="18" letter-spacing="2" fill="#000">НАУЧНО-ТЕХНИЧЕСКИЙ ФОРУМ ТВОРЧЕСКОГО ПРИБОРОСТРОЕНИЯ</text>
<text x="60" y="1286" font-family="'Courier New',monospace" font-size="18" letter-spacing="2" fill="#000">ДИСКРЕТ.РФ</text>
<text x="1020" y="1252" text-anchor="end" font-weight="800" font-size="32" fill="#000">19.09.2026</text>
<text x="1020" y="1284" text-anchor="end" font-family="'Courier New',monospace" font-size="17" letter-spacing="2" fill="#E30613">ЗЕЛЕНОГРАД · МИЭТ</text>
</svg>