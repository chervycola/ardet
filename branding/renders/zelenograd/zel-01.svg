<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif">
<defs>
  <g id="logoD" shape-rendering="crispEdges" transform="scale(0.66667)">
    <rect x="10" y="0" width="2" height="12"/><rect x="2" y="0" width="8" height="2"/><rect x="4" y="2" width="2" height="4"/>
    <rect x="2" y="6" width="2" height="2"/><rect x="0" y="8" width="12" height="2"/><rect x="0" y="10" width="2" height="2"/>
  </g>
  <g id="cross"><line x1="-16" y1="0" x2="16" y2="0" stroke="#000" stroke-width="2"/><line x1="0" y1="-16" x2="0" y2="16" stroke="#000" stroke-width="2"/></g>
</defs>
<rect width="1080" height="1350" fill="#FFFFFF"/>
<rect x="20" y="20" width="1040" height="1310" fill="none" stroke="#000" stroke-width="2"/>
<use href="#cross" x="20" y="20"/><use href="#cross" x="1060" y="20"/><use href="#cross" x="20" y="1330"/><use href="#cross" x="1060" y="1330"/>

<use href="#logoD" fill="#000" transform="translate(60,30) scale(4.2)"/>
<text x="108" y="70" font-weight="800" font-size="44" letter-spacing="1" fill="#000">ДИСКРЕТ</text>
<text x="1020" y="48" text-anchor="end" font-family="'Courier New',monospace" font-size="17" letter-spacing="2" fill="#000">ПОЧЕМУ ЗЕЛЕНОГРАД</text>
<text x="1020" y="76" text-anchor="end" font-family="'Courier New',monospace" font-size="17" letter-spacing="2" fill="#E30613">01 / 06</text>
<line x1="60" y1="104" x2="1020" y2="104" stroke="#000" stroke-width="2"/>

<text x="60" y="196" font-family="'Courier New',monospace" font-size="24" letter-spacing="5" fill="#E30613">ПОЧЕМУ ЗЕЛЕНОГРАД</text>
<text x="56" y="322" font-weight="800" font-size="128" letter-spacing="1" fill="#000">ГОРОД</text>
<text x="56" y="442" font-weight="800" font-size="128" letter-spacing="1" fill="#E30613">ЭЛЕКТРОНИКИ</text>

<polyline points="60,502 250,502 275,478 300,502 430,502 455,462 480,540 505,502 700,502 720,482 760,482 780,502 1020,502" fill="none" stroke="#000" stroke-width="2.5"/>
<circle cx="60" cy="502" r="5" fill="#E30613"/>

<text x="60" y="588" font-family="'Courier New',monospace" font-size="37" letter-spacing="0.2" fill="#000">Зеленоград строился как город</text>
<text x="60" y="641" font-family="'Courier New',monospace" font-size="37" letter-spacing="0.2" fill="#000">электроники. В 1958-м заложили</text>
<text x="60" y="694" font-family="'Courier New',monospace" font-size="37" letter-spacing="0.2" fill="#000">город-спутник Москвы, а в 1962-м</text>
<text x="60" y="747" font-family="'Courier New',monospace" font-size="37" letter-spacing="0.2" fill="#000">решили разместить здесь центр</text>
<text x="60" y="800" font-family="'Courier New',monospace" font-size="37" letter-spacing="0.2" fill="#000">микроэлектроники. Это решение задало</text>
<text x="60" y="853" font-family="'Courier New',monospace" font-size="37" letter-spacing="0.2" fill="#000">всё: промышленность, образование,</text>
<text x="60" y="906" font-family="'Courier New',monospace" font-size="37" letter-spacing="0.2" fill="#000">состав жителей и саму архитектуру.</text>
<text x="60" y="959" font-family="'Courier New',monospace" font-size="37" letter-spacing="0.2" fill="#000">Город с самого начала собирали вокруг</text>
<text x="60" y="1012" font-family="'Courier New',monospace" font-size="37" letter-spacing="0.2" fill="#000">одной задачи — делать электронику.</text>

<line x1="60" y1="1214" x2="1020" y2="1214" stroke="#000" stroke-width="2"/>
<text x="60" y="1258" font-family="'Courier New',monospace" font-size="18" letter-spacing="2" fill="#000">НАУЧНО-ТЕХНИЧЕСКИЙ ФОРУМ ТВОРЧЕСКОГО ПРИБОРОСТРОЕНИЯ</text>
<text x="60" y="1286" font-family="'Courier New',monospace" font-size="18" letter-spacing="2" fill="#000">ДИСКРЕТ.РФ</text>
<text x="1020" y="1252" text-anchor="end" font-weight="800" font-size="32" fill="#000">19.09.2026</text>
<text x="1020" y="1284" text-anchor="end" font-family="'Courier New',monospace" font-size="17" letter-spacing="2" fill="#E30613">ЗЕЛЕНОГРАД · МИЭТ</text>
</svg>