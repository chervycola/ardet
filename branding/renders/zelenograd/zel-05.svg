<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif">
<defs>
  <g id="logoD" shape-rendering="crispEdges" transform="scale(0.66667)">
    <rect x="10" y="0" width="2" height="12"/><rect x="2" y="0" width="8" height="2"/><rect x="4" y="2" width="2" height="4"/>
    <rect x="2" y="6" width="2" height="2"/><rect x="0" y="8" width="12" height="2"/><rect x="0" y="10" width="2" height="2"/>
  </g>
</defs>
<rect width="1080" height="1350" fill="#FFFFFF"/>
<rect x="20" y="20" width="1040" height="1310" fill="none" stroke="#000" stroke-width="2"/>

<!-- шапка: лого-блок по центру, тема справа -->
<use href="#logoD" fill="#000" transform="translate(410,34) scale(4.0)"/>
<text x="456" y="72" font-weight="800" font-size="46" letter-spacing="1" fill="#000">ДИСКРЕТ</text>
<text x="1020" y="66" text-anchor="end" font-family="'Courier New',monospace" font-size="19" letter-spacing="2" fill="#000">ПОЧЕМУ ЗЕЛЕНОГРАД</text>
<line x1="60" y1="96" x2="1020" y2="96" stroke="#000" stroke-width="2"/>
<text x="1020" y="134" text-anchor="end" font-family="'Courier New',monospace" font-size="20" letter-spacing="3" fill="#E30613">05 / 06</text>

<!-- кикер -->
<text x="60" y="196" font-family="'Courier New',monospace" font-size="27" letter-spacing="5" fill="#E30613">· МОДЕРНИЗМ</text>

<!-- ИЛЛЮСТРАЦИЯ: две башни + солнце (мотив лого) -->
<g fill="#000">
  <rect x="700" y="150" width="64" height="20"/><rect x="712" y="170" width="40" height="150"/>
  <rect x="782" y="204" width="60" height="18"/><rect x="792" y="222" width="40" height="98"/>
</g>
<line x1="686" y1="320" x2="856" y2="320" stroke="#000" stroke-width="4"/>
<g stroke="#E30613" stroke-width="6" stroke-linecap="round">
  <line x1="950" y1="178" x2="950" y2="150"/><line x1="950" y1="294" x2="950" y2="322"/>
  <line x1="892" y1="236" x2="864" y2="236"/><line x1="1008" y1="236" x2="1020" y2="236"/>
  <line x1="909" y1="195" x2="889" y2="175"/><line x1="991" y1="195" x2="1011" y2="175"/>
  <line x1="909" y1="277" x2="889" y2="297"/><line x1="991" y1="277" x2="1011" y2="297"/>
  <line x1="922" y1="212" x2="906" y2="202"/><line x1="978" y1="212" x2="994" y2="202"/>
  <line x1="922" y1="260" x2="906" y2="270"/><line x1="978" y1="260" x2="994" y2="270"/>
</g>
<circle cx="950" cy="236" r="17" fill="#E30613"/>

<!-- заголовок -->
<text x="56" y="330" font-weight="800" font-size="140" letter-spacing="1" fill="#000">ФУНКЦИЯ</text>
<text x="56" y="470" font-weight="800" font-size="140" letter-spacing="1" fill="#E30613">В ФОРМЕ</text>

<!-- осциллограмма -->
<polyline points="60,524 250,524 275,496 300,524 430,524 452,482 474,549 496,524 690,524 712,502 756,502 778,524 1020,524" fill="none" stroke="#000" stroke-width="2.5"/>
<circle cx="60" cy="524" r="6" fill="#E30613"/>

<text x="60" y="600" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">Комплекс МИЭТ построен в эпоху советского</text>
<text x="60" y="656" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">модернизма и сегодня — объект культурного</text>
<text x="60" y="712" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">наследия. Здесь функция получает</text>
<text x="60" y="768" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">материальную форму: конструкция ведёт</text>
<text x="60" y="824" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">человека, масштаб задаёт разговор. В</text>
<text x="60" y="880" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">приборе так же — ручка меняет жест,</text>
<text x="60" y="936" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">корпус ставит границы.</text>

<line x1="60" y1="1214" x2="1020" y2="1214" stroke="#000" stroke-width="2"/>
<text x="60" y="1258" font-family="'Courier New',monospace" font-size="18" letter-spacing="2" fill="#000">НАУЧНО-ТЕХНИЧЕСКИЙ ФОРУМ ТВОРЧЕСКОГО ПРИБОРОСТРОЕНИЯ</text>
<text x="60" y="1286" font-family="'Courier New',monospace" font-size="18" letter-spacing="2" fill="#000">ДИСКРЕТ.РФ</text>
<text x="1020" y="1252" text-anchor="end" font-weight="800" font-size="32" fill="#000">19.09.2026</text>
<text x="1020" y="1284" text-anchor="end" font-family="'Courier New',monospace" font-size="17" letter-spacing="2" fill="#E30613">ЗЕЛЕНОГРАД · МИЭТ</text>
</svg>