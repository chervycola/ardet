<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif">
<defs>
  <g id="logoD" shape-rendering="crispEdges" transform="scale(0.66667)">
    <rect x="10" y="0" width="2" height="12"/><rect x="2" y="0" width="8" height="2"/><rect x="4" y="2" width="2" height="4"/>
    <rect x="2" y="6" width="2" height="2"/><rect x="0" y="8" width="12" height="2"/><rect x="0" y="10" width="2" height="2"/>
  </g>
  <pattern id="th" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="12" height="12" fill="#f4f4f4"/>
    <line x1="0" y1="0" x2="0" y2="12" stroke="#e3e3e3" stroke-width="4"/>
  </pattern>
</defs>
<rect width="1080" height="1350" fill="#FFFFFF"/>
<rect x="20" y="20" width="1040" height="1310" fill="none" stroke="#000" stroke-width="2"/>

<use href="#logoD" fill="#000" transform="translate(410,34) scale(4.0)"/>
<text x="456" y="72" font-weight="800" font-size="46" letter-spacing="1" fill="#000">ДИСКРЕТ</text>
<text x="1020" y="66" text-anchor="end" font-family="'Courier New',monospace" font-size="19" letter-spacing="2" fill="#000">ПОЧЕМУ ЗЕЛЕНОГРАД</text>
<line x1="60" y1="96" x2="1020" y2="96" stroke="#000" stroke-width="2"/>
<text x="1020" y="134" text-anchor="end" font-family="'Courier New',monospace" font-size="20" letter-spacing="3" fill="#E30613">05 / 06</text>

<!-- дискретные модули (равная высота, стоят на линии) -->
<rect x="750" y="152" width="96" height="18" fill="#ececec" stroke="#c9c9c9" stroke-width="2"/><rect x="760" y="170" width="50" height="406" fill="url(#th)" stroke="#c9c9c9" stroke-width="2"/><rect x="822" y="170" width="14" height="406" fill="url(#th)" stroke="#c9c9c9" stroke-width="2"/>
<rect x="880" y="152" width="96" height="18" fill="#ececec" stroke="#c9c9c9" stroke-width="2"/><rect x="890" y="170" width="50" height="406" fill="url(#th)" stroke="#c9c9c9" stroke-width="2"/><rect x="952" y="170" width="14" height="406" fill="url(#th)" stroke="#c9c9c9" stroke-width="2"/>

<text x="60" y="206" font-family="'Courier New',monospace" font-size="27" letter-spacing="5" fill="#E30613">· МОДЕРНИЗМ</text>
<text x="56" y="350" font-weight="800" font-size="140" letter-spacing="1" fill="#000">ФУНКЦИЯ</text>
<text x="56" y="492" font-weight="800" font-size="140" letter-spacing="1" fill="#E30613">В ФОРМЕ</text>

<!-- непрерывная линия + локальное событие + красный акцент -->
<circle cx="60" cy="576" r="5" fill="#E30613"/><line x1="66" y1="576" x2="393" y2="576" stroke="#000" stroke-width="3"/><line x1="407" y1="576" x2="1020" y2="576" stroke="#000" stroke-width="3"/><circle cx="400" cy="576" r="9" fill="none" stroke="#000" stroke-width="3"/><circle cx="400" cy="576" r="4" fill="#E30613"/><line x1="760" y1="280" x2="810" y2="280" stroke="#bdbdbd" stroke-width="2.5"/><line x1="890" y1="280" x2="940" y2="280" stroke="#bdbdbd" stroke-width="2.5"/><line x1="760" y1="370" x2="810" y2="370" stroke="#bdbdbd" stroke-width="2.5"/><line x1="890" y1="370" x2="940" y2="370" stroke="#bdbdbd" stroke-width="2.5"/><line x1="760" y1="460" x2="810" y2="460" stroke="#bdbdbd" stroke-width="2.5"/><line x1="890" y1="460" x2="940" y2="460" stroke="#bdbdbd" stroke-width="2.5"/>

<text x="60" y="664" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">Комплекс МИЭТ построен в эпоху советского</text>
<text x="60" y="720" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">модернизма и сегодня — объект культурного</text>
<text x="60" y="776" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">наследия. Здесь функция получает</text>
<text x="60" y="832" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">материальную форму: конструкция ведёт</text>
<text x="60" y="888" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">человека, масштаб задаёт разговор. В</text>
<text x="60" y="944" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">приборе так же — ручка меняет жест,</text>
<text x="60" y="1000" font-family="'Courier New',monospace" font-size="38" letter-spacing="0.2" fill="#000">корпус ставит границы.</text>

<line x1="60" y1="1214" x2="1020" y2="1214" stroke="#000" stroke-width="2"/>
<text x="60" y="1258" font-family="'Courier New',monospace" font-size="18" letter-spacing="2" fill="#000">НАУЧНО-ТЕХНИЧЕСКИЙ ФОРУМ ТВОРЧЕСКОГО ПРИБОРОСТРОЕНИЯ</text>
<text x="60" y="1286" font-family="'Courier New',monospace" font-size="18" letter-spacing="2" fill="#000">ДИСКРЕТ.РФ</text>
<text x="1020" y="1252" text-anchor="end" font-weight="800" font-size="32" fill="#000">19.09.2026</text>
<text x="1020" y="1284" text-anchor="end" font-family="'Courier New',monospace" font-size="17" letter-spacing="2" fill="#E30613">ЗЕЛЕНОГРАД · МИЭТ</text>
</svg>