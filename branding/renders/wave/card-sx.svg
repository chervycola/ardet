<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif">
<defs>
  <clipPath id="scr"><rect x="60" y="140" width="960" height="690"/></clipPath>
  <filter id="gray"><feColorMatrix type="saturate" values="0.08"/><feComponentTransfer><feFuncR type="linear" slope="1.06" intercept="-0.02"/><feFuncG type="linear" slope="1.06" intercept="-0.02"/><feFuncB type="linear" slope="1.06" intercept="-0.02"/></feComponentTransfer></filter>
  <g id="logoD" shape-rendering="crispEdges" transform="scale(0.66667)">
    <rect x="10" y="0" width="2" height="12"/><rect x="2" y="0" width="8" height="2"/><rect x="4" y="2" width="2" height="4"/>
    <rect x="2" y="6" width="2" height="2"/><rect x="0" y="8" width="12" height="2"/><rect x="0" y="10" width="2" height="2"/>
  </g>
  <g id="cross"><line x1="-16" y1="0" x2="16" y2="0" stroke="#000" stroke-width="2"/><line x1="0" y1="-16" x2="0" y2="16" stroke="#000" stroke-width="2"/></g>
</defs>

<rect width="1080" height="1350" fill="#FFFFFF"/>
<rect x="20" y="20" width="1040" height="1310" fill="none" stroke="#000" stroke-width="2"/>
<use href="#cross" x="20" y="20"/><use href="#cross" x="1060" y="20"/><use href="#cross" x="20" y="1330"/><use href="#cross" x="1060" y="1330"/>

<use href="#logoD" fill="#000" transform="translate(60,30) scale(4.2)"/>
<text x="108" y="70" font-weight="800" font-size="44" letter-spacing="1" fill="#000">ДИСКРЕТ</text>
