<text x="72" y="821" font-family="'Courier New',monospace" font-size="16" letter-spacing="1" fill="#FFF">Портативный · модульный · lo-fi</text>

<!-- подписи -->
<text x="60" y="905" font-family="'Courier New',monospace" font-size="22" letter-spacing="4" fill="#E30613">ПОРТАТИВНЫЙ LO-FI МОДУЛЬНЫЙ СИНТ</text>
