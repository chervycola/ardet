<text x="1020" y="76" text-anchor="end" font-family="'Courier New',monospace" font-size="17" letter-spacing="2" fill="#000">ЭКСПО · 01</text>
<line x1="60" y1="104" x2="1020" y2="104" stroke="#000" stroke-width="2"/>

