<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
<!-- ============================================================
     ДИСКРЕТ · ПОСТ-МАКЕТ (зафиксированный формат для ленты)
     База — рамка A «Прибор». Формат 1080×1350.

     SCALE_BAR = индикатор хроники: докуда заполнен — столько прогресса
     (сколько постов уже выложено / насколько близко к дате форума).
     Прогресс задаётся ОДНИМ числом — см. блок PROGRESS ниже.

     Тексты с пометкой EDIT меняются свободно.
     ============================================================ -->
<defs>
  <clipPath id="screenClip"><rect x="60" y="196" width="960" height="720"/></clipPath>
  <pattern id="hatchP" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="12" height="12" fill="#0d0d0d"/><line x1="0" y1="0" x2="0" y2="12" stroke="#222" stroke-width="3"/>
  </pattern>
  <g id="crossP"><line x1="-17" y1="0" x2="17" y2="0" stroke="#000" stroke-width="2"/><line x1="0" y1="-17" x2="0" y2="17" stroke="#000" stroke-width="2"/></g>
  <g id="logoD" shape-rendering="crispEdges">
    <rect x="2" y="0" width="6" height="2"/><rect x="2" y="2" width="1" height="1"/>
    <rect x="5" y="2" width="3" height="4"/><rect x="1" y="3" width="2" height="1"/>
    <rect x="0" y="4" width="2" height="2"/><rect x="0" y="6" width="8" height="1"/>
    <rect x="0" y="7" width="2" height="1"/><rect x="6" y="7" width="2" height="1"/>
  </g>
</defs>

<rect width="1080" height="1350" fill="#FFFFFF"/>
<rect x="20" y="20" width="1040" height="1310" fill="none" stroke="#000" stroke-width="2"/>
<use xlink:href="#crossP" x="20" y="20"/><use xlink:href="#crossP" x="1060" y="20"/>
<use xlink:href="#crossP" x="20" y="1330"/><use xlink:href="#crossP" x="1060" y="1330"/>

<!-- ШАПКА -->
<use xlink:href="#logoD" x="0" y="0" fill="#000" transform="translate(60,26) scale(4.6)"/>
<text x="115" y="70" font-family="'Arial Narrow',Arial,sans-serif" font-weight="800" font-size="48" letter-spacing="1" fill="#000">ДИСКРЕТ</text>
<text x="60" y="90" font-family="'Courier New',monospace" font-size="14" letter-spacing="2" fill="#000">НАУЧНО-ТЕХНИЧЕСКИЙ ФОРУМ ТВОРЧЕСКОГО ПРИБОРОСТРОЕНИЯ</text>
<text x="1020" y="40" text-anchor="end" font-family="'Courier New',monospace" font-size="17" letter-spacing="2" fill="#000">УЧАСТНИК</text>
<!-- EDIT: номер поста/участника -->
<text x="1020" y="84" text-anchor="end" font-family="'Arial Narrow',Arial,sans-serif" font-weight="800" font-size="40" fill="#E30613">№ 01</text>
<line x1="60" y1="104" x2="1020" y2="104" stroke="#000" stroke-width="2"/>

<!-- ЭКРАН / ФОТО -->
<rect x="60" y="196" width="960" height="720" fill="url(#hatchP)"/>
<text x="540" y="556" text-anchor="middle" font-family="'Courier New',monospace" font-size="22" letter-spacing="3" fill="#666">ФОТО УЧАСТНИКА · 960×720</text>
<!-- EDIT: подставьте фото -->
<image id="photo" xlink:href="PHOTO.jpg" x="60" y="196" width="960" height="720" clip-path="url(#screenClip)" preserveAspectRatio="xMidYMid slice"/>
<rect x="60" y="196" width="960" height="720" fill="none" stroke="#000" stroke-width="3"/>
<rect x="68" y="204" width="944" height="704" fill="none" stroke="#000" stroke-width="1"/>
<path d="M60 236 V196 H100 M980 196 H1020 V236 M1020 876 V916 H980 M100 916 H60 V876" fill="none" stroke="#E30613" stroke-width="4"/>
<!-- EDIT: тех-подпись прибора -->
<rect x="60" y="916" width="430" height="30" fill="#000"/>
<text x="72" y="937" font-family="'Courier New',monospace" font-size="16" letter-spacing="1" fill="#FFF">Standalone Unit; 1A, 12В+</text>

<!-- ЛИНИЯ-ЗНАК: здания + волна + солнце (мотив лого LaserNoto) -->
<g stroke="#000" stroke-width="3" fill="none">
  <line x1="60" y1="1000" x2="88" y2="1000"/>
  <line x1="150" y1="1000" x2="360" y2="1000"/>
  <polyline points="360,1000 405,1000 432,952 460,1040 486,982 512,1012 560,1000"/>
  <line x1="560" y1="1000" x2="912" y2="1000"/>
</g>
<!-- два «здания» -->
<g fill="#000">
  <rect x="92" y="956" width="16" height="44"/><rect x="86" y="948" width="28" height="9"/>
  <rect x="126" y="970" width="16" height="30"/><rect x="120" y="963" width="28" height="8"/>
</g>
<!-- солнце / лазер -->
<g stroke="#E30613" stroke-width="3" stroke-linecap="round">
  <line x1="961" y1="1000" x2="978" y2="1000"/><line x1="939" y1="1000" x2="926" y2="1000"/>
  <line x1="950" y1="989" x2="950" y2="974"/><line x1="950" y1="1011" x2="950" y2="1026"/>
  <line x1="957.8" y1="992.2" x2="968" y2="982"/><line x1="942.2" y1="1007.8" x2="932" y2="1018"/>
  <line x1="957.8" y1="1007.8" x2="968" y2="1018"/><line x1="942.2" y1="992.2" x2="932" y2="982"/>
</g>
<circle cx="950" cy="1000" r="7" fill="#E30613"/>
<circle cx="60" cy="1000" r="5" fill="#E30613"/>

<!-- ИМЯ / РОЛЬ -->
<!-- EDIT -->
<text x="60" y="1130" font-family="'Arial Narrow',Arial,sans-serif" font-weight="800" font-size="92" letter-spacing="1" fill="#000">ВАДИМ МИНКИН</text>
<!-- EDIT -->
<text x="62" y="1176" font-family="'Courier New',monospace" font-size="24" letter-spacing="3" fill="#000">GENERATIVE GROOVEBOX · Kaleidoscope</text>

<!-- ============ SCALE_BAR = ХРОНИКА ============
     PROGRESS: докуда заполнена шкала. Меняете ТОЛЬКО одно:
     ширину заливки (fill) = 770 × доля.  Пример ниже = 15% (0.15 → 115.5).
     Красный указатель стоит на конце заливки.
     0% = старт анонсов, 100% = день форума / все посты вышли. -->
<text x="60" y="1232" font-family="'Courier New',monospace" font-size="14" letter-spacing="1" fill="#000">SCALE_BAR</text>
<rect x="60" y="1244" width="770" height="14" fill="none" stroke="#000" stroke-width="2"/>
<!-- EDIT: прогресс — ширина заливки = 770 × доля -->
<rect x="60" y="1244" width="115.5" height="14" fill="#000"/>
<!-- красный указатель на конце заливки (x = 60 + ширина заливки) -->
<path d="M175.5 1244 L168 1231 L183 1231 Z" fill="#E30613"/>
<!-- деления -->
<line x1="252" y1="1244" x2="252" y2="1258" stroke="#000" stroke-width="1.5"/>
<line x1="445" y1="1244" x2="445" y2="1258" stroke="#000" stroke-width="1.5"/>
<text x="60" y="1280" font-family="'Courier New',monospace" font-size="13" fill="#000">0</text>
<text x="252" y="1280" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#000">25</text>
<text x="445" y="1280" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#000">50</text>
<text x="830" y="1280" text-anchor="end" font-family="'Courier New',monospace" font-size="13" fill="#000">100</text>

<!-- МЕСТО / ДАТА -->
<text x="1020" y="1244" text-anchor="end" font-family="'Courier New',monospace" font-size="15" letter-spacing="2" fill="#000">ЗЕЛЕНОГРАД.МИЭТ</text>
<!-- EDIT: дата -->
<text x="1020" y="1268" text-anchor="end" font-family="'Courier New',monospace" font-size="15" letter-spacing="2" fill="#E30613">29.09.2026</text>
</svg>
