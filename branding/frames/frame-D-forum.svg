<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
<!-- ============================================================
     ДИСКРЕТ · РАМКА D «КАРТОЧКА ФОРУМА» (чистый стиль плакатов)
     Ближе всего к применённому бренду: белый фон, жирный
     гротеск-заголовок, воздух, красный — точечно.
     Фото участника занимает место иллюстрации.
     ============================================================ -->
<defs>
  <clipPath id="photoClipD"><rect x="72" y="560" width="936" height="590"/></clipPath>
  <pattern id="hatchD" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="12" height="12" fill="#eeeeee"/><line x1="0" y1="0" x2="0" y2="12" stroke="#d3d3d3" stroke-width="3"/>
  </pattern>
  <g id="logoD" shape-rendering="crispEdges">
    <rect x="2" y="0" width="6" height="2"/><rect x="2" y="2" width="1" height="1"/>
    <rect x="5" y="2" width="3" height="4"/><rect x="1" y="3" width="2" height="1"/>
    <rect x="0" y="4" width="2" height="2"/><rect x="0" y="6" width="8" height="1"/>
    <rect x="0" y="7" width="2" height="1"/><rect x="6" y="7" width="2" height="1"/>
  </g>
</defs>

<rect width="1080" height="1350" fill="#FFFFFF"/>

<!-- ШАПКА: знак слева, тег форума справа -->
<use xlink:href="#logoD" fill="#000" transform="translate(72,60) scale(5)"/>
<text x="1008" y="76" text-anchor="end" font-family="'Courier New',monospace" font-size="16"
      letter-spacing="1" fill="#000">НАУЧНО-ТЕХНИЧЕСКИЙ ФОРУМ</text>
<text x="1008" y="98" text-anchor="end" font-family="'Courier New',monospace" font-size="16"
      letter-spacing="1" fill="#000">ТВОРЧЕСКОГО ПРИБОРОСТРОЕНИЯ</text>

<!-- красный кикер: индекс участника -->
<!-- EDIT: номер участника -->
<text x="72" y="178" font-family="'Courier New',monospace" font-size="22" letter-spacing="3"
      fill="#E30613">УЧАСТНИК № 04</text>

<!-- ИМЯ (жирный гротеск, не узкий) -->
<!-- EDIT: имя. При длинном имени вынесите фамилию на вторую строку (второй tspan). -->
<text x="70" y="290" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800"
      font-size="104" letter-spacing="-1" fill="#000">ВАДИМ<tspan x="70" dy="104">МИНКИН</tspan></text>

<!-- РОЛЬ / ОПИСАНИЕ -->
<!-- EDIT: короткое описание, 2–3 строки -->
<text font-family="'Helvetica Neue',Arial,sans-serif" font-size="27" fill="#333">
  <tspan x="72" y="472">Генеративный грувбокс собственной разработки.</tspan>
  <tspan x="72" y="508">Живой сет: звук собирается на глазах — из зерна,</tspan>
  <tspan x="72" y="544">порога и обратной связи. Не запись, а прибор.</tspan>
</text>

<!-- ФОТО в простой рамке -->
<rect x="72" y="560" width="936" height="590" fill="url(#hatchD)"/>
<text x="540" y="848" text-anchor="middle" font-family="'Courier New',monospace" font-size="22"
      letter-spacing="3" fill="#9a9a9a">ФОТО УЧАСТНИКА · 936×590</text>
<!-- EDIT: подставьте своё фото -->
<image id="photo" xlink:href="PHOTO.jpg" x="72" y="560" width="936" height="590"
       clip-path="url(#photoClipD)" preserveAspectRatio="xMidYMid slice"/>
<rect x="72" y="560" width="936" height="590" fill="none" stroke="#000" stroke-width="3"/>
<!-- угловые засечки -->
<path d="M72 588 V560 H100 M980 560 H1008 V588 M1008 1122 V1150 H980 M100 1150 H72 V1122"
      fill="none" stroke="#000" stroke-width="2"/>

<!-- ПОДВАЛ -->
<line x1="72" y1="1230" x2="1008" y2="1230" stroke="#000" stroke-width="2"/>
<use xlink:href="#logoD" fill="#000" transform="translate(72,1258) scale(2.6)"/>
<text x="110" y="1282" font-family="'Arial Narrow',Arial,sans-serif" font-weight="800"
      font-size="26" letter-spacing="1" fill="#000">ДИСКРЕТ</text>
<!-- EDIT: дата и место -->
<text x="1008" y="1282" text-anchor="end" font-family="'Courier New',monospace" font-size="18"
      letter-spacing="2" fill="#000">10 СЕНТЯБРЯ · ЗЕЛЕНОГРАД</text>
</svg>
