<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
<!-- ============================================================
     ДИСКРЕТ · РАМКА A «ПРИБОР» (осциллограф / измерение)
     Формат: 1080×1350 (4:5, портрет для соцсетей)
     Как пользоваться:
       1. Замените href у <image id="photo"> на путь к фото участника.
       2. Отредактируйте текст в блоках, помеченных пометкой EDIT.
       3. Индекс участника — красный «№ 04» справа сверху.
     Палитра: #000 / #FFF / сигнальный красный #E30613
     ============================================================ -->
<defs>
  <clipPath id="screenClip"><rect x="60" y="196" width="960" height="720"/></clipPath>
  <pattern id="hatchA" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="12" height="12" fill="#0d0d0d"/>
    <line x1="0" y1="0" x2="0" y2="12" stroke="#222" stroke-width="3"/>
  </pattern>
  <g id="crossA">
    <line x1="-17" y1="0" x2="17" y2="0" stroke="#000" stroke-width="2"/>
    <line x1="0" y1="-17" x2="0" y2="17" stroke="#000" stroke-width="2"/>
  </g>
  <!-- пиксельный знак «Д» (fill задаётся на <use>) -->
  <g id="logoD" shape-rendering="crispEdges" transform="scale(0.66667)">
    <rect x="10" y="0" width="2" height="12"/><rect x="2" y="0" width="8" height="2"/><rect x="4" y="2" width="2" height="4"/>
    <rect x="2" y="6" width="2" height="2"/><rect x="0" y="8" width="12" height="2"/><rect x="0" y="10" width="2" height="2"/>
  </g>
</defs>

<!-- бумага -->
<rect width="1080" height="1350" fill="#FFFFFF"/>
<rect x="20" y="20" width="1040" height="1310" fill="none" stroke="#000" stroke-width="2"/>

<!-- реперные кресты по углам -->
<use xlink:href="#crossA" x="20"   y="20"/>
<use xlink:href="#crossA" x="1060" y="20"/>
<use xlink:href="#crossA" x="20"   y="1330"/>
<use xlink:href="#crossA" x="1060" y="1330"/>

<!-- ШАПКА: пиксельный знак + вордмарк -->
<use xlink:href="#logoD" x="0" y="0" fill="#000" transform="translate(60,26) scale(4.6)"/>
<text x="115" y="70" font-family="'Arial Narrow',Arial,sans-serif" font-weight="800" font-size="48"
      letter-spacing="1" fill="#000">ДИСКРЕТ</text>
<g transform="translate(1020,0)" text-anchor="end">
  <text y="34" font-family="'Courier New',monospace" font-size="17" letter-spacing="2"
        fill="#000">УЧАСТНИК / PARTICIPANT</text>
  <!-- EDIT: индекс участника -->
  <text y="80" font-family="'Arial Narrow',Arial,sans-serif" font-weight="800" font-size="38"
        fill="#E30613">№ 04</text>
</g>
<text x="60" y="90" font-family="'Courier New',monospace" font-size="14" letter-spacing="2"
      fill="#000">НАУЧНО-ТЕХНИЧЕСКИЙ ФОРУМ ТВОРЧЕСКОГО ПРИБОРОСТРОЕНИЯ</text>
<line x1="60" y1="104" x2="1020" y2="104" stroke="#000" stroke-width="2"/>

<!-- ЭКРАН / ФОТО -->
<g>
  <!-- плейсхолдер «поле наблюдения» (виден, пока нет фото) -->
  <rect x="60" y="196" width="960" height="720" fill="url(#hatchA)"/>
  <text x="540" y="556" text-anchor="middle" font-family="'Courier New',monospace"
        font-size="22" letter-spacing="3" fill="#666">ФОТО УЧАСТНИКА · 960×720</text>
  <!-- EDIT: подставьте своё фото -->
  <image id="photo" xlink:href="PHOTO.jpg" x="60" y="196" width="960" height="720"
         clip-path="url(#screenClip)" preserveAspectRatio="xMidYMid slice"/>
  <!-- двойная техническая рамка экрана -->
  <rect x="60" y="196" width="960" height="720" fill="none" stroke="#000" stroke-width="3"/>
  <rect x="68" y="204" width="944" height="704" fill="none" stroke="#000" stroke-width="1"/>
  <!-- угловые скобки -->
  <path d="M60 236 V196 H100 M980 196 H1020 V236 M1020 876 V916 H980 M100 916 H60 V876"
        fill="none" stroke="#E30613" stroke-width="4"/>
  <!-- подпись прибора -->
  <rect x="60" y="916" width="440" height="30" fill="#000"/>
  <text x="72" y="937" font-family="'Courier New',monospace" font-size="16" letter-spacing="2"
        fill="#FFF">CH1  2V/DIV   5ms/DIV   TRIG:A</text>
</g>

<!-- ОСЦИЛЛОГРАММА (связь: сигнал → участник) -->
<polyline points="60,1000 150,1000 175,975 200,1000 260,1000 285,955 310,1035 335,1000 470,1000
                   495,982 520,1018 545,1000 700,1000 720,970 760,970 780,1000 1020,1000"
          fill="none" stroke="#000" stroke-width="3"/>
<circle cx="60" cy="1000" r="5" fill="#E30613"/>

<!-- ИМЯ / РОЛЬ -->
<!-- EDIT -->
<text x="60" y="1130" font-family="'Arial Narrow',Arial,sans-serif" font-weight="800"
      font-size="92" letter-spacing="1" fill="#000">ВАДИМ МИНКИН</text>
<!-- EDIT -->
<text x="62" y="1176" font-family="'Courier New',monospace" font-size="24" letter-spacing="3"
      fill="#000">GENERATIVE GROOVEBOX · ЖИВОЙ СЕТ</text>

<!-- ПОДВАЛ: шкала + маркеры -->
<g transform="translate(60,1250)">
  <text font-family="'Courier New',monospace" font-size="14" letter-spacing="1" fill="#000"
        transform="translate(0,-14)">SCALE_BAR</text>
  <rect x="0" y="0" width="30" height="10" fill="#000"/>
  <rect x="30" y="0" width="30" height="10" fill="none" stroke="#000" stroke-width="1.5"/>
  <rect x="60" y="0" width="30" height="10" fill="#000"/>
  <rect x="90" y="0" width="30" height="10" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="0" y="34" font-family="'Courier New',monospace" font-size="13" fill="#000">0    25    50</text>
</g>
<text x="1020" y="1246" text-anchor="end" font-family="'Courier New',monospace" font-size="15"
      letter-spacing="2" fill="#000">STYLE_FIRST</text>
<text x="1020" y="1268" text-anchor="end" font-family="'Courier New',monospace" font-size="15"
      letter-spacing="2" fill="#E30613">SIGNAL_ALWAYS</text>
</svg>
