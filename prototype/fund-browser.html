<title>Опись скрытого</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap">
<style>
  :root{
    --night:#26221C; --paper:#E8DCC3; --ink:#3A3026; --faded:rgba(58,48,38,.62);
    --rule:rgba(58,48,38,.28); --rule2:rgba(58,48,38,.14); --cinnabar:#C23B2B;
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:'Montserrat','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--night);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.42}
  .sheet{max-width:1280px;margin:26px auto;background:var(--paper);min-height:calc(100vh - 52px);
    box-shadow:0 0 70px rgba(0,0,0,.65);position:relative}
  .sheet::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(58,48,38,.022) 3px 4px)}
  header{padding:34px 40px 20px;border-bottom:1.5px solid var(--ink);position:relative}
  h1{font:500 34px/1.1 var(--serif);letter-spacing:.06em;margin:0;text-transform:uppercase}
  .sub{font:300 11.5px/1.6 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--faded);margin-top:6px}
  .stamp{position:absolute;top:26px;right:40px;transform:rotate(-3.4deg);border:2.5px solid var(--cinnabar);
    color:var(--cinnabar);padding:6px 14px;font:400 12px/1.5 var(--sans);letter-spacing:.22em;
    text-transform:uppercase;opacity:.85;text-align:center;pointer-events:none}
  .bar{display:flex;gap:18px;align-items:baseline;padding:14px 40px;border-bottom:1px solid var(--rule);
    position:sticky;top:0;background:var(--paper);z-index:5;flex-wrap:wrap}
  .bar input{flex:1;min-width:220px;background:transparent;border:none;border-bottom:1px solid var(--rule);
    font:italic 500 17px var(--serif);color:var(--ink);padding:4px 2px;outline:none}
  .bar input:focus{border-bottom-color:var(--cinnabar)}
  .bar input::placeholder{color:var(--faded);opacity:.8}
  .count{font:300 12px var(--sans);letter-spacing:.1em;color:var(--faded);white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .count b{color:var(--cinnabar);font-weight:500}
  .clear{font:300 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--cinnabar);
    background:none;border:1px solid var(--cinnabar);padding:4px 10px;cursor:pointer;display:none}
  .clear:hover{background:var(--cinnabar);color:var(--paper)}
  .clear:focus-visible,.chip:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px}
  .cols{display:flex;align-items:flex-start}
  aside{width:288px;flex:none;padding:20px 22px 40px 40px;border-right:1px solid var(--rule);
    position:sticky;top:57px;max-height:calc(100vh - 57px);overflow-y:auto}
  .grp{margin-bottom:20px}
  .grp h3{font:400 10.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--faded);
    margin:0 0 8px;border-bottom:1px solid var(--rule2);padding-bottom:4px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font:300 12px var(--sans);letter-spacing:.03em;color:var(--ink);background:transparent;
    border:1px solid var(--rule);border-radius:999px;padding:2.5px 9px;cursor:pointer;
    font-variant-numeric:tabular-nums;transition:border-color .12s,color .12s}
  .chip i{font-style:normal;color:var(--faded);margin-left:4px;font-size:10.5px}
  .chip:hover{border-color:var(--ink)}
  .chip.on{border:1.5px solid var(--cinnabar);color:var(--cinnabar);font-weight:400}
  .chip.on i{color:var(--cinnabar)}
  .chip.zero{opacity:.32;pointer-events:none}
  .more{font:italic 400 13px var(--serif);color:var(--faded);background:none;border:none;cursor:pointer;padding:2px 4px}
  .more:hover{color:var(--cinnabar)}
  main{flex:1;min-width:0;padding:22px 40px 60px 30px}
  .card{border-bottom:1px solid var(--rule2);padding:14px 0 12px;display:flex;gap:16px}
  .card:first-child{padding-top:4px}
  .num{flex:none;width:52px;font:400 13px var(--sans);letter-spacing:.05em;color:var(--faded);
    padding-top:3px;font-variant-numeric:tabular-nums}
  .num.route{color:var(--cinnabar)}
  .body{min-width:0}
  .txt{font-size:17.5px;max-width:72ch}
  .txt em{font-style:italic}
  .meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
  .m{font:300 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faded);
    border:1px solid var(--rule2);border-radius:999px;padding:1.5px 8px;cursor:pointer;background:none}
  .m:hover{color:var(--cinnabar);border-color:var(--cinnabar)}
  .m.truth-быль{color:var(--cinnabar);border-color:rgba(194,59,43,.4)}
  .m.plain{cursor:default;border-color:transparent;padding-left:0}
  .m.plain:hover{color:var(--faded)}
  .empty{margin:70px auto;text-align:center;max-width:420px}
  .empty .est{display:inline-block;transform:rotate(-2.6deg);border:2.5px solid var(--cinnabar);
    color:var(--cinnabar);padding:10px 20px;font:400 13px/1.7 var(--sans);letter-spacing:.2em;text-transform:uppercase}
  .empty p{font:italic 400 16px var(--serif);color:var(--faded)}
  footer{padding:16px 40px 30px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;
    font:300 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--faded)}
  @media (max-width:820px){
    .cols{flex-direction:column}
    aside{position:static;width:100%;max-height:none;border-right:none;border-bottom:1px solid var(--rule);
      padding:16px 24px}
    main{padding:18px 24px 50px}
    header,.bar,footer{padding-left:24px;padding-right:24px}
    .stamp{display:none}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<div class="sheet">
<header>
  <h1>Опись скрытого</h1>
  <div class="sub">картотека фонда пасхалок · дело о мире · 238 позиций фонда + узлы кольцевых + изнанка</div>
  <div class="stamp">хранить вечно<br><span style="font-size:9px;letter-spacing:.16em">выдаче не подлежит</span></div>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="поиск по описи — текст, номер, имя…" autocomplete="off">
  <span class="count" id="count"></span>
  <button class="clear" id="clear">снять фильтры</button>
</div>
<div class="cols">
  <aside id="filters"></aside>
  <main id="list"></main>
</div>
<footer>
  <span>сост.: странник · зав. фондом: мох</span>
  <span>сверено с оригиналом · оригинал не предъявлен</span>
</footer>
</div>

"carrier":"предмет"},{"id":"К22","o":"К022","sec":"витрина капитала","text":"инвентарные бирки капсул отеля — того же формата и шрифта, что бирки экзаменационных келий XVIII века; нумерация продолжается с последней кельи (III: стойло для пишущего и капсула для работающего — одна опись, четыре века)","where":"неон·восток","depth":"III","rings":["неон"],"sides":["восток"],"persons":[],"cultures":["Япония"],"truth":"вымысел мира","carrier":"казённая бумага"},{"id":"К23","o":"К023","sec":"витрина капитала","text":"чек на стойке нет-кафе: «тариф \"ночь\". продлений: 4380» (III: двенадцать лет; временное стало постоянным, канцелярия исправно пробивала)","where":"сейчас·восток","depth":"III","rings":["сейчас"],"sides":["восток"],"persons":[],"cultures":[],"truth":"вымысел мира","carrier":"казённая бумага"},{"id":"К24","o":"К024","sec":"витрина капитала","text":"в баре у платформы в рамке — банковская выписка: «ВКЛАД: БУДУЩЕЕ. СНЯТИЕ: ПОТОМ» (нефтяной фонд поколений); рядом К6-родственная бирка «НАВСЕГДА» на кольце от пивной банки","where":"неон·север","depth":"II","rings":["неон"],"sides":["север"],"persons":[],"cultures":["Скандинавия"],"truth":"вымысел мира","carrier":"казённая бумага"},{"id":"УЗ1","o":"Я101","sec":"узлы кольцевых","text":"«весовая при заставе Лао-цзы» — Одна весовая на шве восток|юг: шёлк востока взвешивают против благовоний и папируса юга; гиря одна, клейма двух сторон — и оба клейма утверждают, что гиря честная. В очереди спорят сократики, торговцы просят потише; здесь же меняются историями, курс: одна на одну. Рядом на перекрёстке — СТОЛБ ЗОЛОТОГО ПРАВИЛА (Ж9, каноническая клетка): одна мысль пятью почерками пяти сторон; западная грань выбита позднее и глубже остальных — запад пришёл к правилу последним и резал старательнее всех; пятый почерк — степной, тамгой. Из чужих секторов столб не виден: столб не башня.","where":"осевое · шов восток|юг · шёлковый путь","depth":"II","rings":["осевое"],"sides":["восток","юг"],"persons":["Лао-цзы","Сократ"],"cultures":["Греция","Египет","Китай","Персия/Иран"],"truth":"вымысел мира","carrier":"место/ход"},{"id":"УЗ2","o":"Я102","sec":"узлы кольцевых","text":"«янтарный камень немого торга» — Плоский валун на меже север|равнина: с одной стороны выложен янтарь, с другой — бронза и соль; торгующие не показываются друг другу (немая торговля — быль), обмен идёт третьи сутки, несогласный просто не трогает товар. На камне мелом — «спасибо»: цена, приписанная позже. Первая сделка севера заключена молчанием — лучший протокол в истории канцелярии.","where":"осевое · шов север|равнина · степная ветка (узел без дороги)","depth":"II","rings":["осевое"],"sides":["север","равнина"],"persons":[],"cultures":[],"truth":"вымысел мира","carrier":"место/ход"},{"id":"УЗ3","o":"Я103","sec":"узлы кольцевых","text":"«хан с двумя воротами» — Караван-сарай на шве юг|запад: в восточные ворота входят ладан и специи, из западных выходят мулы с переводами. Во дворе — ТОЛЕДСКИЙ СТОЛ: за одним длинным столом три почерка (арабский, еврейский, латинский), одна книга проходит через три руки за один кадр; юг возвращает западу его же античность — перевод с перевода. На стене правило постоя: «СПОРЫ О ВЕРЕ — ЗА ВОРОТАМИ. О ЦЕНЕ — У ВЕСОВ». Расплата: тюки бумаги против телячьих кож; бумага побеждает на глазах.","where":"свет и сад · шов юг|запад · караваны","depth":"II","rings":["свет и сад"],"sides":["юг","запад"],"persons":[],"cultures":["Исламский мир","Испания"],"truth":"вымысел мира","carrier":"место/ход"},{"id":"УЗ4","o":"Я104","sec":"узлы кольцевых","text":"«ганзейские весы» — Причал-контора под смолёными сваями: треска штабелями, как дрова; весы с пломбой, счёт мелом по-нижненемецки на чёрной доске; санный караван уходит по льду к равнине — зерно в обмен на рыбу и воск. Мел стирается, пломба — нет.","where":"свет и сад · шов север|равнина · санная ветка (зимник)","depth":"II","rings":["свет и сад"],"sides":["север","равнина"],"persons":[],"cultures":["Исламский мир","Скандинавия"],"truth":"вымысел мира","carrier":"место/ход"},{"id":"УЗ5","o":"Я105","sec":"узлы кольцевых","text":"«волок у сарая «Полупустой тюк»» — Ладьи на катках между двумя реками, рядом караван-сарай северо-восточной дуги: бумага и чай уходят к равнине, меха и воск — навстречу, на восток. Весовая изба без гирь — вес меряют беличьими шкурками; хозяин сарая принимает оплату рукописями по весу. На этой бумаге будут писать летописи; курс слова к товару не менялся девять веков.","where":"свет и сад · шов равнина|восток · волок","depth":"II","rings":["свет и сад"],"sides":["равнина","восток"],"persons":[],"cultures":["Исламский мир","Русь/Россия"],"truth":"вымысел мира","carrier":"место/ход"},{"id":"УЗ6","o":"Я106","sec":"узлы кольцевых","text":"«таможня двух часов» — Станция на шве север|равнина: один буфет, часы с двумя парами стрелок — два времени, один буфет. Таможенный стол с двумя штампами: «ЗАПРЕЩЕНО ТАМ» — на вывозимое, «ЗАПРЕЩЕНО ЗДЕСЬ» — на ввозимое; обе таблички честные: главный товар века — запрещённое. Домкратов нет: колея здесь одна, меняются только правила.","where":"пар и тени · шов север|равнина · железная дорога","depth":"II","rings":["пар и тени"],"sides":["север","равнина"],"persons":[],"cultures":[],"truth":"вымысел мира","carrier":"место/ход"},{"id":"УЗ7","o":"Я107","sec":"узлы кольцевых","text":"«станция перестановки тележек» — Колея равнины (1520) не совпадает с колеёй востока: вагоны поднимают на домкратах и меняют ход, пассажиры не выходят; табличка на пакгаузе: «СОСТАВ ТОТ ЖЕ. ХОД ДРУГОЙ». Двадцать минут два экспресса стоят борт о борт, и через открытые окна успевают перейти: чайник, газета, одна недосказанная фраза. Граница, сделанная из железа: культурный шов шириной в 85 мм.","where":"пар и тени · шов равнина|восток · железная дорога","depth":"II","rings":["пар и тени"],"sides":["равнина","восток"],"persons":[],"cultures":[],"truth":"вымысел мира","carrier":"место/ход"},{"id":"УЗ8","o":"Я108","sec":"узлы кольцевых","text":"«аэропорт-хаб на насыпном острове» — Аэропорт, построенный в море взамен снесённого городского (того, что гладил соты по крыше); остров оседает на сантиметры в год, и табло прилётов сверяет с уровнем моря одна и та же служба. Транзитная зона, где все стороны меняются друг другом, не выходя в город; на дальнем витраже — тень самолёта, который больше не заходит на посадку между домами. (Распределительный центр с переклейкой этикеток — сцена клетки сейчас·запад, не узел.)","where":"сейчас · шов восток|запад · сеть","depth":"II","rings":["сейчас"],"sides":["восток","запад"],"persons":[],"cultures":["Япония"],"truth":"вымысел мира","carrier":"место/ход"},{"id":"УЗ9","o":"Я109","sec":"узлы кольцевых","text":"«кабельный берег» — Выход подводной магистрали на песок юга — и из чёрной воды севера в ангар: один кабель, два берега, один знак «НЕ ЯКОРИТЬ» с гербом канцелярии. Разговор идёт древней трассой — шёлковый путь лёг оптоволокном; юг присылает данные горячими, север возвращает их остывшими: обмен теплом в чистом виде, впервые честно оформленный. Рыбак чинит сеть над сетью.","where":"сейчас · шов юг|север · сеть","depth":"II","rings":["сейчас"],"sides":["юг","север"],"persons":[],"cultures":["Греция","Скандинавия"],"truth":"вымысел мира","carrier":"место/ход"},{"id":"УЗ10","o":"Я110","sec":"узлы кольцевых","text":"«контейнерный рынок у вышки» — Морские контейнеры и клетчатые сумки челноков — герб обмена равнины и востока; вышка связи приварена к старой опоре ЛЭП (дороги цепей несут теперь сигнал). На одном прилавке чётки, кассеты и шнуры зарядки — три эпохи одной торговли; рядом стенд З — «слова, которых не говорили» (по фонду — на кольцевой «сейчас»).","where":"сейчас · шов равнина|восток · сеть","depth":"II","rings":["сейчас"],"sides":["равнина","восток"],"persons":[],"cultures":["СССР","Китай"],"truth":"вымысел мира","carrier":"место/ход"},{"id":"U1","o":"Я21","sec":"изнанка","text":"крипта: вход — дверца за алтарём → выход — сухая цистерна у бассейна","where":"lightgarden:north → axial:south","depth":"III","rings":["изнанка"],"sides":[],"persons":[],"cultures":[],"truth":"вымысел мира","carrier":"место/ход"},{"id":"U2","o":"Я22","sec":"изнанка","text":"катакомбы: вход — тёмная дверь за колоннадой → выход — крипта собора","where":"porticoes:south → lightgarden:west","depth":"III","rings":["изнанка"],"sides":[],"persons":[],"cultures":["Рим"],"truth":"вымысел мира","carrier":"место/ход"},{"id":"U3","o":"Я23","sec":"изнанка","text":"канализация: вход — решётка у газового фонаря → выход — люк на территории завода","where":"steamshadows:west → catastrophes:plain","depth":"III","rings":["изнанка"],"sides":[],"persons":[],"cultures":[],"truth":"вымысел мира","carrier":"место/ход"},{"id":"U4","o":"Я24","sec":"изнанка","text":"бомбоубежище: вход — дверь в подвале → выход — задняя дверь вагона 89 6","where":"catastrophes:plain → neon:east","depth":"III","rings":["изнанка"],"sides":[],"persons":[],"cultures":["СССР"],"truth":"вымысел мира","carrier":"место/ход"},{"id":"U5","o":"Я25","sec":"изнанка","text":"метро: вход — заклеенный вход метро → выход — колодец городка","where":"now:east → townlet:all","depth":"III","rings":["изнанка"],"sides":[],"persons":[],"cultures":[],"truth":"вымысел мира","carrier":"место/ход"},{"id":"U6","o":"Я26","sec":"изнанка","text":"ход мха: вход — пифос (лечь и уснуть) → выход — нора у подножия огня","where":"townlet:all → edge:all","depth":"III","rings":["изнанка"],"sides":[],"persons":[],"cultures":[],"truth":"вымысел мира","carrier":"место/ход"},{"id":"U7","o":"Я27","sec":"изнанка","text":"кабельный коллектор («холодная жила»): вход — морозилка в подсобке парка (иней стрелкой вниз) → выход — КРИОСКЛЕП «WD» — тупик под двумя очагами. Комната: по документам — кремирован. по счетам — охлаждается. канцелярия верит счетам","where":"neon:west → twohearths:west","depth":"III","rings":["изнанка"],"sides":[],"persons":["Дисней"],"cultures":["США"],"truth":"вымысел мира","carrier":"место/ход"}];
const ROUTE_IDS = new Set(['Г1','Г2','Г3','Г5','Г6','Г8','Е3','Е6','Е7','А2','Д9']);
DATA.forEach(d => {
  d.depths = d.depth.split('/').map(s => s.trim());
  d.blob = (d.id + ' ' + d.text + ' ' + d.where + ' ' + d.persons.join(' ') + ' ' + d.cultures.join(' ')).toLowerCase();
});

const RING_ORDER = ['городок','осевое','портики','свет и сад','два очага','мелкий шрифт','пар и тени',
  'век катастроф','неон','сейчас','край','за кольцом','изнанка','где уместно'];
const SIDE_ORDER = ['юг','восток','запад','север','равнина','городок'];
const SEC_ORDER = ['граффити','кроличьи норы','убежища','предметы-переселенцы','философский пласт',
  'тихие поклоны','мемориал','стенд слов','полка писателей','витрина капитала','узлы кольцевых','изнанка'];

// группы фильтров: [ключ, заголовок, извлечение значений, порядок|null, сворачивать после N]
const GROUPS = [
  ['sides',   'сторона света',        d => d.sides,    SIDE_ORDER, 99],
  ['rings',   'кольцо времени',       d => d.rings,    RING_ORDER, 99],
  ['cultures','страна · культура',    d => d.cultures, null, 99],
  ['persons', 'авторы и участники',   d => d.persons,  null, 18],
  ['sec',     'раздел фонда',         d => [d.sec],    SEC_ORDER, 99],
  ['depths',  'глубина',              d => d.depths,   ['I','II','III'], 99],
  ['truth',   'достоверность',        d => [d.truth],  ['быль','легенда','анекдот','вымысел мира'], 99],
  ['carrier', 'носитель',             d => [d.carrier],null, 99],
];
const state = {q: '', open: {}};
GROUPS.forEach(([k]) => state[k] = new Set());

function matches(d, skipGroup) {
  if (state.q && !d.blob.includes(state.q)) return false;
  for (const [k,, get] of GROUPS) {
    if (k === skipGroup || !state[k].size) continue;
    const vals = get(d);
    if (![...state[k]].some(v => vals.includes(v))) return false;
  }
  return true;
}

function render() {
  const shown = DATA.filter(d => matches(d, null));
  // фильтры с фасетными счётчиками
  let fh = '';
  for (const [k, title, get, order, capN] of GROUPS) {
    const base = DATA.filter(d => matches(d, k));
    const counts = new Map();
    base.forEach(d => get(d).forEach(v => counts.set(v, (counts.get(v) || 0) + 1)));
    // все значения группы (и с нулём при активных фильтрах)
    const all = new Map();
    DATA.forEach(d => get(d).forEach(v => all.set(v, 1)));
    let keys = [...all.keys()];
    keys.sort(order
      ? (a, b) => order.indexOf(a) - order.indexOf(b)
      : (a, b) => (counts.get(b) || 0) - (counts.get(a) || 0) || a.localeCompare(b, 'ru'));
    const isOpen = state.open[k];
    let hidden = 0;
    const chips = keys.map((v, i) => {
      const n = counts.get(v) || 0;
      const on = state[k].has(v);
      if (!on && !isOpen && i >= capN) { hidden++; return ''; }
      return `<button class="chip${on ? ' on' : ''}${!n && !on ? ' zero' : ''}"
        data-g="${k}" data-v="${esc(v)}">${esc(v)}<i>${n}</i></button>`;
    }).join('');
    const more = hidden ? `<button class="more" data-open="${k}">…ещё ${hidden}</button>`
      : (isOpen && keys.length > capN ? `<button class="more" data-open="${k}">свернуть</button>` : '');
    fh += `<div class="grp"><h3>${title}</h3><div class="chips">${chips}${more}</div></div>`;
  }
  document.getElementById('filters').innerHTML = fh;

  // карточки
  document.getElementById('list').innerHTML = shown.length ? shown.map(d => `
    <div class="card">
      <div class="num${ROUTE_IDS.has(d.id) ? ' route" title="сквозной предмет' : ''}">${d.id}</div>
      <div class="body">
        <div class="txt">${fmt(d.text)}</div>
        <div class="meta">
          <span class="m plain">${esc(d.where)}</span>
          ${d.persons.map(p => `<button class="m" data-g="persons" data-v="${esc(p)}">${esc(p)}</button>`).join('')}
          ${d.cultures.map(c => `<button class="m" data-g="cultures" data-v="${esc(c)}">${esc(c)}</button>`).join('')}
          <button class="m" data-g="sec" data-v="${esc(d.sec)}">${esc(d.sec)}</button>
          <button class="m truth-${d.truth === 'быль' ? 'быль' : 'x'}" data-g="truth" data-v="${esc(d.truth)}">${esc(d.truth)}</button>
          <button class="m" data-g="depths" data-v="${esc(d.depths[0])}">гл. ${esc(d.depth)}</button>
        </div>
      </div>
    </div>`).join('')
    : `<div class="empty"><div class="est">по вашему запросу<br>ничего не значится</div>
       <p>считать действительным. снимите часть фильтров — фонд хранит всё.</p></div>`;

  const anyF = state.q || GROUPS.some(([k]) => state[k].size);
  document.getElementById('count').innerHTML =
    `предъявлено <b>${shown.length}</b> из ${DATA.length}${anyF ? ' · остальное хранится' : ''}`;
  document.getElementById('clear').style.display = anyF ? 'inline-block' : 'none';
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<em>$1</em>')
  .replace(/`(.+?)`/g,'<em>$1</em>'); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-g]');
  if (b) {
    const g = b.dataset.g, v = b.dataset.v;
    state[g].has(v) ? state[g].delete(v) : state[g].add(v);
    render(); return;
  }
  const m = e.target.closest('[data-open]');
  if (m) { state.open[m.dataset.open] = !state.open[m.dataset.open]; render(); return; }
  if (e.target.id === 'clear') {
    GROUPS.forEach(([k]) => state[k].clear());
    state.q = ''; document.getElementById('q').value = '';
    render();
  }
});
document.getElementById('q').addEventListener('input', e => {
  state.q = e.target.value.trim().toLowerCase(); render();
});
render();
</script>
