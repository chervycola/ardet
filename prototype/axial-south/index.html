<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ardet · осевое·юг — чаша на фундаменте</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#080706;overflow:hidden}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  #hud{position:fixed;top:14px;left:18px;pointer-events:none;
    font-family:Montserrat,sans-serif;font-weight:300;font-size:10px;
    letter-spacing:3px;color:#8A8D8F;text-transform:uppercase}
  #loc{position:fixed;top:14px;right:18px;pointer-events:none;text-align:right;
    font-family:Montserrat,sans-serif;font-weight:300;font-size:10px;
    letter-spacing:3px;color:#8A8D8F;text-transform:uppercase}
  #hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;pointer-events:none;
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:#5b5f61}
  #paper{position:fixed;left:50%;bottom:56px;transform:translateX(-50%) rotate(-1.2deg);
    background:linear-gradient(172deg,#EEE3CB,#E0D2B4);color:#3A3026;
    padding:14px 22px 15px;max-width:420px;box-shadow:0 8px 30px rgba(0,0,0,.65);
    display:none}
  #paper b{display:block;font-family:Montserrat;font-weight:500;font-size:8px;
    letter-spacing:3px;color:#C23B2B;margin-bottom:5px;text-transform:uppercase}
  #paper span{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;line-height:1.35}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">ardet · осевое · юг</div>
<div id="loc">чаша на фундаменте · день</div>
<div id="hint">wasd · палец — идти · e — рассмотреть</div>
<div id="paper"><b id="ptitle"></b><span id="ptext"></span></div>
<script>
// ═══════════════════════════════════════════════════════════════════
// ARDET — клетка «чаша на фундаменте», регистр «Волшебники-1977»:
// кадр Бакши — небо занимает верх, действие — сжатая полоса;
// многоплановость: небо с диском → дальние дюны/пирамиды → средний
// план с караваном → полоса действия → передний силуэтный план.
// Канон: ≤3 тёплых пятна, палитра без изменений.
// ═══════════════════════════════════════════════════════════════════
const NIGHT='#0D0B0A', BONE='#D9CFB8', ASH='#8A8D8F', MIST='#3D4A3A',
      CANDLE='#E28A3A', RED='#C23B2B', FAIENCE='#2E8B8B';
const WORLD={w:3000,h:1000};
const HOR=420;                    // мировой горизонт
const Q=1.6;
const IS_TOUCH='ontouchstart' in window||navigator.maxTouchPoints>0;

const LANTERN={x:1420,y:758};
const ATASH={x:2650,y:700};
const BOWL={x:980,y:630};
const TREE={x:1750,y:545};
const NILO={x:2350,y:485};

const cv=document.getElementById('c'), x=cv.getContext('2d');
let CW=0,CH=0,DPR=1,zoom=1;
const darkC=document.createElement('canvas'); const dk=darkC.getContext('2d');
function resize(){
  CW=innerWidth; CH=innerHeight;
  DPR=Math.min(2,devicePixelRatio||1);
  cv.width=CW*DPR; cv.height=CH*DPR;
  cv.style.width=CW+'px'; cv.style.height=CH+'px';
  darkC.width=CW*DPR; darkC.height=CH*DPR;
  zoom=Math.max(CW/1200, CH/820, CW/WORLD.w, CH/WORLD.h);
}
addEventListener('resize',resize); resize();

const J=i=>Math.sin(i*127.13)*43758.545%1;
const lerp=(a,b,k)=>a+(b-a)*k;
function lerpCol(c1,c2,k){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(c1),b=p(c2);
  return `rgb(${Math.round(lerp(a[0],b[0],k))},${Math.round(lerp(a[1],b[1],k))},${Math.round(lerp(a[2],b[2],k))})`;
}

function hatch(g,pathFn,bb,layers){
  for(const L of layers){
    g.save(); g.beginPath(); pathFn(g); g.clip();
    g.strokeStyle=L.col||BONE; g.globalAlpha=L.a; g.lineWidth=L.w||0.6;
    const ang=L.ang*Math.PI/180, diag=Math.hypot(bb.w,bb.h);
    const cx=bb.x+bb.w/2, cy=bb.y+bb.h/2, n=Math.ceil(diag/L.gap)+2;
    g.beginPath();
    for(let i=-n;i<n;i++){
      const off=i*L.gap, j1=J(i+L.ang)*(L.j||0), j2=J(i*2+L.ang)*(L.j||0);
      const x0=cx+Math.cos(ang+Math.PI/2)*off-Math.cos(ang)*diag;
      const y0=cy+Math.sin(ang+Math.PI/2)*off-Math.sin(ang)*diag;
      g.moveTo(x0+j1,y0+j2);
      g.lineTo(x0+Math.cos(ang)*diag*2+j2, y0+Math.sin(ang)*diag*2+j1);
    }
    g.stroke(); g.restore();
  }
  g.globalAlpha=1;
}
function rays(g,cx,cy,r0,r1,n,col,a,a0=0,a1=Math.PI*2){
  g.strokeStyle=col; g.globalAlpha=a; g.lineWidth=0.7;
  g.beginPath();
  for(let i=0;i<n;i++){
    const ang=a0+(i/n)*(a1-a0)+J(i)*0.03;
    const rr=r1*(0.75+J(i*3)*0.5);
    g.moveTo(cx+Math.cos(ang)*r0, cy+Math.sin(ang)*r0);
    g.lineTo(cx+Math.cos(ang)*rr, cy+Math.sin(ang)*rr);
  }
  g.stroke(); g.globalAlpha=1;
}

// ═══════════════ ДАЛЬНИЙ ПЛАН (параллакс 0.18): дюны и пирамиды ═══════════════
const farC=document.createElement('canvas'); farC.width=3600; farC.height=260;
(function renderFar(){
  const g=farC.getContext('2d');
  g.fillStyle='#0B0908'; g.globalAlpha=0.85;
  g.beginPath(); g.moveTo(0,260);
  for(let px=0;px<=3600;px+=60)
    g.lineTo(px,190+Math.sin(px*0.004)*22+J(px)*8);
  g.lineTo(3600,260); g.closePath(); g.fill();
  // пирамиды — до-осевой слой, силуэтами против неба
  const pyr=(px,wd,ht,al)=>{
    g.globalAlpha=al; g.fillStyle='#0A0807';
    g.beginPath(); g.moveTo(px-wd/2,238); g.lineTo(px,238-ht); g.lineTo(px+wd/2,238);
    g.closePath(); g.fill();
    g.strokeStyle=BONE; g.globalAlpha=al*0.55; g.lineWidth=1;
    g.beginPath(); g.moveTo(px,238-ht); g.lineTo(px-wd/2,238); g.stroke();
    g.globalAlpha=al*0.3;
    g.beginPath(); g.moveTo(px,238-ht); g.lineTo(px+wd/2,238); g.stroke();
  };
  pyr(940,330,180,0.8); pyr(1420,190,100,0.6); pyr(2660,260,140,0.7); pyr(560,120,58,0.5);
  g.fillStyle='#090807'; g.globalAlpha=0.95;
  g.beginPath(); g.moveTo(0,260);
  for(let px=0;px<=3600;px+=50)
    g.lineTo(px,228+Math.sin(px*0.007+2)*14+J(px*3)*6);
  g.lineTo(3600,260); g.closePath(); g.fill();
  g.globalAlpha=1;
})();

// ═══════════════ СРЕДНИЙ ПЛАН (параллакс 0.5): руины, камни, деревья ═══════════════
const midC=document.createElement('canvas'); midC.width=4200; midC.height=190;
(function renderMid(){
  const g=midC.getContext('2d');
  const base=186;
  g.fillStyle='#080706';
  g.beginPath(); g.moveTo(0,190);
  for(let px=0;px<=4200;px+=40) g.lineTo(px,base-6+J(px)*4);
  g.lineTo(4200,190); g.closePath(); g.fill();
  const rim=(fn)=>{ g.strokeStyle=BONE; g.globalAlpha=0.16; g.lineWidth=1; fn(); g.globalAlpha=1; };
  // обломанная колоннада
  for(let i=0;i<5;i++){
    const cx=520+i*46, h=64-Math.abs(J(i*7))*30;
    g.fillStyle='#080706'; g.fillRect(cx,base-h,16,h);
    rim(()=>{g.beginPath();g.moveTo(cx,base-h);g.lineTo(cx,base);g.stroke();});
  }
  g.fillRect(516,base-70,110,8);
  // одинокие мёртвые деревья
  const tree=(tx,s)=>{
    g.strokeStyle='#080706'; g.lineWidth=4*s; g.lineCap='round';
    g.beginPath(); g.moveTo(tx,base); g.quadraticCurveTo(tx-3*s,base-30*s,tx+3*s,base-52*s); g.stroke();
    g.lineWidth=1.8*s;
    g.beginPath();
    g.moveTo(tx+1*s,base-36*s); g.quadraticCurveTo(tx+16*s,base-46*s,tx+22*s,base-60*s);
    g.moveTo(tx,base-44*s); g.quadraticCurveTo(tx-12*s,base-56*s,tx-15*s,base-68*s);
    g.stroke(); g.lineCap='butt';
  };
  tree(1240,1); tree(2470,0.8); tree(3480,1.15);
  // стоячие камни и второй обелиск
  g.fillStyle='#080706';
  g.fillRect(1900,base-34,14,34); g.fillRect(1930,base-22,10,22);
  g.save(); g.translate(3050,base); g.rotate(-0.04);
  g.fillRect(-7,-78,14,78);
  g.restore();
  rim(()=>{g.beginPath();g.moveTo(3046,base-76);g.lineTo(3043,base);g.stroke();});
  g.fillRect(700,base-18,90,18); g.fillRect(2240,base-14,60,14); g.fillRect(3700,base-24,44,24);
})();

// ═══════════════ СТАТИЧНЫЙ СЛОЙ ПОЛОСЫ ДЕЙСТВИЯ ═══════════════
const staticC=document.createElement('canvas');
staticC.width=WORLD.w*Q; staticC.height=WORLD.h*Q;
const S=staticC.getContext('2d');

function renderStatic(){
  const g=S;
  g.setTransform(Q,0,0,Q,0,0);
  g.clearRect(0,0,WORLD.w,WORLD.h);
  // земля — только ниже горизонта; небо и планы рисуются за кадром
  g.fillStyle=NIGHT; g.fillRect(0,HOR,WORLD.w,WORLD.h-HOR);
  hatch(g,p=>p.rect(0,HOR,WORLD.w,WORLD.h-HOR),{x:0,y:HOR,w:WORLD.w,h:WORLD.h-HOR},[
    {ang:0,gap:3.6,a:0.17,w:0.55,j:1},
    {ang:0,gap:7.6,a:0.10,w:0.5,j:1.6},
  ]);
  hatch(g,p=>p.rect(0,HOR,WORLD.w,WORLD.h-HOR),{x:0,y:HOR,w:WORLD.w,h:WORLD.h-HOR},[
    {ang:2,gap:9,a:0.05,col:RED,w:0.5,j:2},
  ]);
  // кромка горизонта — рим-лайт
  g.strokeStyle=BONE; g.globalAlpha=0.22; g.lineWidth=1.2;
  g.beginPath();
  for(let px=0;px<=WORLD.w;px+=40) px?g.lineTo(px,HOR+2+J(px)*2):g.moveTo(px,HOR+2);
  g.stroke(); g.globalAlpha=1;

  // плиты у дворика
  g.strokeStyle=BONE; g.lineWidth=0.6;
  for(let row=0;row<7;row++){
    for(let col=0;col<10;col++){
      const px=640+col*74+(row%2?37:0), py=560+row*44;
      if(J(row*17+col)>0.7) continue;
      g.globalAlpha=0.15+Math.abs(J(row+col*7))*0.09;
      g.strokeRect(px+J(col)*3,py+J(row)*2,68,38);
    }
  }
  g.globalAlpha=1;
  // сухая трава и камни
  for(let i=0;i<540;i++){
    const px=(J(i)*0.5+0.5)*WORLD.w, py=445+(J(i*3)*0.5+0.5)*520;
    if(px>640&&px<1390&&py>540&&py<880) continue;
    g.globalAlpha=0.09+Math.abs(J(i*5))*0.08;
    g.strokeStyle=BONE; g.lineWidth=0.5;
    g.beginPath(); g.moveTo(px,py); g.lineTo(px+5+J(i*7)*4,py+J(i*11)*2); g.stroke();
  }
  for(let i=0;i<80;i++){
    const px=(J(i*13)*0.5+0.5)*WORLD.w, py=460+(J(i*17)*0.5+0.5)*500;
    g.globalAlpha=0.18;
    g.beginPath(); g.ellipse(px,py,3+Math.abs(J(i))*5,1.6+Math.abs(J(i*3))*2,0,0,7); g.stroke();
  }
  g.globalAlpha=1;
  // колючка
  g.strokeStyle=ASH; g.globalAlpha=0.35; g.lineWidth=0.7;
  for(let i=0;i<9;i++){
    const bx=180+i*26, by=930+J(i)*5;
    g.beginPath(); g.moveTo(bx,by); g.lineTo(bx+22,by-3);
    g.moveTo(bx+6,by-4); g.lineTo(bx+10,by+3);
    g.moveTo(bx+15,by-4); g.lineTo(bx+18,by+3); g.stroke();
  }
  g.globalAlpha=1;

  // мох
  const moss=(mx,my,r,d)=>{
    const p=pp=>{
      for(let i=0;i<=9;i++){
        const a=i/9*Math.PI*2, rr=r*(0.7+Math.abs(J(i*3+mx))*0.5);
        const px=mx+Math.cos(a)*rr, py=my+Math.sin(a)*rr*0.6;
        i?pp.lineTo(px,py):pp.moveTo(px,py);
      }
      pp.closePath();
    };
    g.fillStyle=`rgba(61,74,58,${0.13*d})`; g.beginPath(); p(g); g.fill();
    hatch(g,p,{x:mx-r,y:my-r,w:r*2,h:r*2},[{ang:-20,gap:2.2,a:0.28*d,col:MIST,w:0.5,j:0.5}]);
  };
  moss(700,930,28,0.7); moss(2180,910,36,0.8); moss(2500,480,24,0.6);
  moss(320,500,30,0.6); moss(1240,940,32,0.7);

  // радиальная дорога
  g.strokeStyle='#090807'; g.lineWidth=7; g.globalAlpha=0.55; g.lineCap='round';
  g.beginPath(); g.moveTo(0,800);
  g.quadraticCurveTo(760,770, 1500,782);
  g.quadraticCurveTo(2300,796, 3000,772); g.stroke();
  g.globalAlpha=1; g.lineCap='butt';
  g.strokeStyle=BONE; g.lineWidth=0.6;
  for(let i=0;i<64;i++){
    const tt=i/64, px=tt*3000;
    const py=800+(770-800)*Math.sin(tt*Math.PI)+J(i)*5;
    if(J(i*3)>0.45) continue;
    g.globalAlpha=0.12+Math.abs(J(i*5))*0.08;
    g.beginPath(); g.ellipse(px,py-4,20,7,J(i)*0.1,0,7); g.stroke();
  }
  g.globalAlpha=1;

  // ручей Гераклита
  const brook=off=>{
    g.beginPath();
    for(let tt=0;tt<=1;tt+=0.02){
      const px=2130+tt*260+Math.sin(tt*9)*18+off;
      const py=HOR+8+tt*560;
      tt?g.lineTo(px,py):g.moveTo(px,py);
    }
  };
  g.strokeStyle=MIST; g.globalAlpha=0.7; g.lineWidth=8; brook(0); g.stroke();
  g.strokeStyle=BONE; g.globalAlpha=0.25; g.lineWidth=0.8;
  brook(-6); g.stroke(); brook(7); g.stroke();
  g.globalAlpha=1;
  // мостик
  g.fillStyle='#12100D'; g.fillRect(2222,752,120,44);
  g.strokeStyle=BONE; g.globalAlpha=0.6; g.lineWidth=1;
  g.strokeRect(2222,752,120,44);
  g.beginPath(); g.moveTo(2282,752); g.lineTo(2282,796); g.stroke();
  g.globalAlpha=1;

  // ── ДВОРИК: кладка на до-осевом фундаменте ──
  const course=(bx,by,wd,ht)=>{
    g.fillStyle='#100E0B'; g.fillRect(bx,by-ht,wd,ht);
    hatch(g,p=>p.rect(bx,by-ht,wd,ht),{x:bx,y:by-ht,w:wd,h:ht},[
      {ang:90,gap:3,a:0.16,w:0.55,j:0.4},{ang:0,gap:6,a:0.1,w:0.5}]);
    g.strokeStyle=BONE; g.lineWidth=0.7;
    for(let r=0;r<ht/22;r++){
      const ry=by-ht+r*22;
      g.globalAlpha=0.4;
      g.beginPath(); g.moveTo(bx,ry); g.lineTo(bx+wd,ry); g.stroke();
      for(let c=0;c<wd/46;c++){
        g.globalAlpha=0.3;
        g.beginPath(); g.moveTo(bx+c*46+(r%2?23:0),ry); g.lineTo(bx+c*46+(r%2?23:0),ry+22); g.stroke();
      }
    }
    g.fillStyle='#0A0908'; g.fillRect(bx,by,wd,14);
    g.globalAlpha=0.55; g.strokeStyle=BONE;
    g.beginPath(); g.moveTo(bx,by); g.lineTo(bx+wd,by); g.stroke();
    g.globalAlpha=0.22;
    for(let c=0;c<wd/70;c++){
      const hx=bx+14+c*70;
      g.beginPath(); g.moveTo(hx,by+3); g.lineTo(hx+8,by+3);
      g.moveTo(hx+3,by+6); g.lineTo(hx+3,by+11);
      g.moveTo(hx+12,by+8); g.arc(hx+12,by+8,2.6,0,7); g.stroke();
    }
    g.globalAlpha=0.7; g.strokeStyle=BONE; g.lineWidth=1;
    g.strokeRect(bx,by-ht,wd,ht+14); g.globalAlpha=1;
  };
  course(660,545,560,80);
  course(660,690,120,56);
  course(1140,690,80,56);

  // блок вверх ногами (Д14)
  g.strokeStyle=BONE; g.globalAlpha=0.5; g.lineWidth=0.8;
  g.strokeRect(694,652,44,20);
  g.globalAlpha=0.35;
  g.beginPath(); g.moveTo(704,668); g.lineTo(712,668);
  g.moveTo(708,665); g.lineTo(708,660);
  g.moveTo(722,661); g.arc(722,661,2.6,0,7); g.stroke();
  g.globalAlpha=1;
  g.save(); g.translate(716,678); g.rotate(0.05);
  g.fillStyle='#E0D2B4'; g.fillRect(-16,-5,32,10);
  g.strokeStyle='#3A3026'; g.globalAlpha=0.6; g.lineWidth=0.5; g.strokeRect(-16,-5,32,10);
  g.restore(); g.globalAlpha=1;

  // ΓΝΩΘΙ ΣΑΥΤΟΝ
  g.save(); g.translate(920,505); g.rotate(-0.045);
  g.fillStyle=BONE; g.globalAlpha=0.5; g.font='11px "Cormorant Garamond"';
  g.fillText('ΓΝΩΘΙ ΣΑΥΤΟΝ',0,0);
  g.restore(); g.globalAlpha=1;

  // ── ЧАША ──
  const bw=BOWL;
  g.fillStyle='rgba(4,3,3,0.5)';
  g.beginPath(); g.ellipse(bw.x+16,bw.y+34,52,11,0.1,0,7); g.fill();
  g.fillStyle='#12100D'; g.fillRect(bw.x-26,bw.y-6,52,36);
  hatch(g,p=>p.rect(bw.x-26,bw.y-6,52,36),{x:bw.x-26,y:bw.y-6,w:52,h:36},[
    {ang:90,gap:2.6,a:0.22,w:0.55}]);
  g.strokeStyle=BONE; g.globalAlpha=0.7; g.lineWidth=1;
  g.strokeRect(bw.x-26,bw.y-6,52,36);
  g.beginPath(); g.moveTo(bw.x-32,bw.y+30); g.lineTo(bw.x+32,bw.y+30); g.stroke();
  const cup=p=>{p.moveTo(bw.x-40,bw.y-24);
    p.bezierCurveTo(bw.x-36,bw.y-4, bw.x+36,bw.y-4, bw.x+40,bw.y-24);};
  g.fillStyle='#14110E'; g.beginPath(); cup(g);
  g.lineTo(bw.x-40,bw.y-24); g.fill();
  g.strokeStyle=BONE; g.globalAlpha=0.85; g.lineWidth=1.2;
  g.beginPath(); cup(g); g.stroke();
  g.beginPath(); g.ellipse(bw.x,bw.y-24,40,9,0,0,7); g.stroke();
  g.globalAlpha=1;

  // ── КЛЕТКА С ПЕТУХОМ ──
  const kx=880, ky=742;
  g.strokeStyle=BONE; g.globalAlpha=0.65; g.lineWidth=0.9;
  g.strokeRect(kx-24,ky-34,48,34);
  for(let i=1;i<6;i++){ g.beginPath(); g.moveTo(kx-24+i*8,ky-34); g.lineTo(kx-24+i*8,ky); g.stroke(); }
  g.globalAlpha=1;
  g.save(); g.translate(kx,ky+10); g.rotate(-0.03);
  g.fillStyle='#E0D2B4'; g.fillRect(-34,-7,68,14);
  g.strokeStyle='#3A3026'; g.globalAlpha=0.7; g.lineWidth=0.5; g.strokeRect(-34,-7,68,14);
  g.fillStyle='#3A3026'; g.font='500 6px Montserrat'; g.textAlign='center';
  g.fillText('ЧЕЛОВЕК (ПО ПЛАТОНУ)',0,2.5); g.textAlign='left';
  g.restore(); g.globalAlpha=1;

  // ── ВЕДОМОСТЬ (Ж14) ──
  g.strokeStyle='#2A241E'; g.lineWidth=4;
  g.beginPath(); g.moveTo(1160,720); g.lineTo(1160,646); g.stroke();
  g.save(); g.translate(1160,660); g.rotate(0.04);

function ambientDark(ph){
  if(ph<0.42) return 0.03;
  if(ph<0.55) return 0.03+((ph-0.42)/0.13)*0.75;
  if(ph<0.92) return 0.78;
  return 0.78-((ph-0.92)/0.08)*0.75;
}
function phaseWord(ph){
  return ph<0.42?'день':(ph<0.55?'сумерки':(ph<0.92?'ночь':'рассвет'));
}

const footprints=[];
let lastFoot={x:player.x,y:player.y}, footSide=1;

function collide(nx,ny){
  const R=10;
  for(const s of solids){
    if(s.t==='r'){
      const cx2=Math.max(s.x,Math.min(nx,s.x+s.w)), cy2=Math.max(s.y,Math.min(ny,s.y+s.h));
      const dx=nx-cx2, dy=ny-cy2, d=Math.hypot(dx,dy);
      if(d<R){ const k=(R-d)/(d||1); nx+=dx*k; ny+=dy*k; }
    }else{
      const dx=nx-s.x, dy=ny-s.y, d=Math.hypot(dx,dy), rr=s.r+R;
      if(d<rr){ const k=(rr-d)/(d||1); nx+=dx*k; ny+=dy*k; }
    }
  }
  nx=Math.max(16,Math.min(WORLD.w-16,nx));
  ny=Math.max(HOR+25,Math.min(WORLD.h-32,ny));
  return [nx,ny];
}

function updatePlayer(dt){
  let dx=0,dy=0;
  if(keys['w']||keys['ц']||keys['arrowup'])dy-=1;
  if(keys['s']||keys['ы']||keys['arrowdown'])dy+=1;
  if(keys['a']||keys['ф']||keys['arrowleft'])dx-=1;
  if(keys['d']||keys['в']||keys['arrowright'])dx+=1;
  if(!dx&&!dy&&touchTarget){
    const tx=touchTarget.x-player.x, ty=touchTarget.y-player.y, d=Math.hypot(tx,ty);
    if(d>8){dx=tx/d;dy=ty/d;} else if(!touchHeld) touchTarget=null;
  }
  const len=Math.hypot(dx,dy);
  player.moving=len>0.01;
  if(player.moving){
    dx/=len;dy/=len;
    const sp=2.5; // плавучая походка регистра-1977
    const [nx,ny]=collide(player.x+dx*sp, player.y+dy*sp*0.8);
    player.x=nx;player.y=ny;
    player.fx=dx;player.fy=dy;player.step+=sp;
    if(Math.hypot(player.x-lastFoot.x,player.y-lastFoot.y)>17){
      footSide*=-1;
      footprints.push({x:player.x-player.fy*3.4*footSide, y:player.y+6+player.fx*2*footSide,
        a:Math.atan2(player.fy,player.fx), age:0});
      if(footprints.length>240)footprints.shift();
      lastFoot={x:player.x,y:player.y};
    }
    for(const pk of PICKUPS){
      if(pk.taken) continue;
      if(Math.hypot(player.x-pk.x,player.y-pk.y)<16){
        pk.taken=true; inv.moss++;
        note(pk.x,pk.y-20,'+ мох');
      }
    }
  }
}

// ═══════════════ ШЁПОТЫ ═══════════════
let whisper={t:'',life:0,x:0,y:0}, whisperCd=0;
function updateWhispers(litHere){
  if(whisper.life>0){whisper.life--; if(whisper.life<=0)whisperCd=150; return;}
  if(whisperCd>0){whisperCd--;return;}
  if(!litHere) return;
  for(const w of whispers){
    if(Math.hypot(player.x-w.x,player.y-w.y)<w.r){
      whisper={t:w.t,life:300,x:w.x,y:w.y-40}; break;
    }
  }
}

// ═══════════════ НЕБО И ПЛАНЫ (регистр «Волшебники-1977») ═══════════════
function drawSky(ph,darkA,t){
  const hy=(HOR-cam.y)*zoom;            // экранный горизонт
  const k=Math.min(1,darkA/0.78);       // 0 — день, 1 — ночь
  const sg=x.createLinearGradient(0,0,0,hy);
  sg.addColorStop(0, lerpCol('#1C0F0B','#050404',k));
  sg.addColorStop(0.62, lerpCol('#3A1710','#0B0908',k));
  sg.addColorStop(1, lerpCol('#5A1F14','#150C0A',k));
  x.fillStyle=sg; x.fillRect(0,0,CW,hy+2);
  const hg=x.createLinearGradient(0,hy-90,0,hy);
  hg.addColorStop(0,'rgba(194,59,43,0)');
  hg.addColorStop(1,`rgba(194,59,43,${0.4-0.28*k})`);
  x.fillStyle=hg; x.fillRect(0,hy-90,CW,90);
  x.fillStyle=`rgba(226,138,58,${0.10-0.08*k})`; x.fillRect(0,hy-16,CW,16);

  if(k>0.5){
    x.fillStyle=BONE;
    for(let i=0;i<44;i++){
      x.globalAlpha=(0.10+Math.abs(J(i*7))*0.16)*(k-0.5)*2;
      x.fillRect((J(i)*0.5+0.5)*CW, (J(i*3)*0.5+0.5)*hy*0.8, 1.4,1.4);
    }
    x.globalAlpha=1;
  }

  // диск: солнце днём / красная луна ночью
  let discX,discY,discR;
  if(k<0.55){
    const dp=Math.min(1,ph/0.42);
    discX=CW*(0.24+0.5*dp)-cam.x*zoom*0.06;
    discY=hy-(Math.sin(Math.PI*dp)*hy*0.62)-24;
    discR=Math.min(CW,CH)*0.075;
    x.fillStyle=RED; x.globalAlpha=0.8*(1-k);
    x.beginPath(); x.arc(discX,discY,discR,0,7); x.fill();
    x.globalAlpha=0.25*(1-k); x.fillStyle='#E28A3A';
    x.beginPath(); x.arc(discX,discY,discR*0.7,0,7); x.fill();
    // лицо солнца — едва различимо в мареве (канон ART_BIBLE)
    x.strokeStyle='#0D0B0A'; x.globalAlpha=0.07*(1-k); x.lineWidth=2;
    x.beginPath(); x.arc(discX-discR*0.3,discY-discR*0.14,discR*0.1,0.4,2.6); x.stroke();
    x.beginPath(); x.arc(discX+discR*0.3,discY-discR*0.14,discR*0.1,0.5,2.7); x.stroke();
    x.beginPath(); x.arc(discX,discY+discR*0.28,discR*0.3,0.5,2.6); x.stroke();
    x.globalAlpha=1;
  }else{
    // красная луна — фирменный знак, с кольцевыми мазками и потёками
    const np=Math.max(0,Math.min(1,(ph-0.55)/0.37));
    discX=CW*(0.7-0.3*np)-cam.x*zoom*0.05;
    discY=hy*0.46-Math.sin(np*Math.PI)*hy*0.08;
    discR=Math.min(CW,CH)*0.052;
    x.fillStyle=RED; x.globalAlpha=0.85;
    x.beginPath(); x.arc(discX,discY,discR,0,7); x.fill();
    x.strokeStyle='#7E241A'; x.lineWidth=2;
    for(let i=0;i<3;i++){
      x.globalAlpha=0.4-i*0.1;
      x.beginPath(); x.arc(discX+J(i)*5,discY+J(i*3)*4,discR*(0.5+i*0.22),J(i*7)*2,J(i*7)*2+4.6); x.stroke();
    }
    x.strokeStyle=RED;
    for(let i=0;i<3;i++){
      x.globalAlpha=0.3-i*0.07; x.lineWidth=2.4-i*0.5;
      const dxx=discX-discR*0.5+i*discR*0.5+J(i*9)*4;
      x.beginPath(); x.moveTo(dxx,discY+discR*0.85);
      x.lineTo(dxx+J(i)*2,discY+discR*(1.3+Math.abs(J(i*5))*0.8)); x.stroke();
    }
    x.globalAlpha=1;
  }

  // дальний план (0.18)
  const fw=3600*zoom*0.9, fh=260*zoom*0.9;
  x.globalAlpha=0.9;
  x.drawImage(farC, -cam.x*0.18*zoom, hy-fh+3*zoom, fw, fh);
  x.globalAlpha=1;
  // дымка между планами
  const hz=x.createLinearGradient(0,hy-40,0,hy+6);
  hz.addColorStop(0,'rgba(217,207,184,0)');
  hz.addColorStop(1,`rgba(217,207,184,${0.06-0.045*k})`);
  x.fillStyle=hz; x.fillRect(0,hy-40,CW,46);

  // средний план (0.5)
  const mw=4200*zoom*0.82, mh=190*zoom*0.82;
  x.drawImage(midC, -cam.x*0.5*zoom, hy-mh+6*zoom, mw, mh);

  // караван — жизнь среднего плана: идёт своей дорогой, всегда
  const cs=zoom*0.8;
  for(let i=0;i<6;i++){
    const wx=((t*7+i*52)%4600)-200;
    const sx=wx*zoom*0.82 - cam.x*0.5*zoom;
    if(sx<-40||sx>CW+40) continue;
    const sy=hy+2*zoom;
    x.fillStyle='#080706'; x.globalAlpha=0.85;
    if(i===0){ // проводник с посохом
      x.fillRect(sx-1.6*cs,sy-11*cs,3.2*cs,8*cs);
      x.beginPath(); x.arc(sx,sy-12.4*cs,1.8*cs,0,7); x.fill();
      x.strokeStyle='#080706'; x.lineWidth=1*cs;
      x.beginPath(); x.moveTo(sx+2.4*cs,sy-10*cs); x.lineTo(sx+3.4*cs,sy); x.stroke();
      const lp2=Math.sin(t*4+i);
      x.beginPath(); x.moveTo(sx-0.6*cs,sy-3*cs); x.lineTo(sx-0.6*cs+lp2*1.8*cs,sy);
      x.moveTo(sx+0.6*cs,sy-3*cs); x.lineTo(sx+0.6*cs-lp2*1.8*cs,sy); x.stroke();
    }else{ // верблюд
      x.beginPath();
      x.moveTo(sx-7*cs,sy);
      x.quadraticCurveTo(sx-8*cs,sy-6*cs, sx-4*cs,sy-7*cs);
      x.quadraticCurveTo(sx-2*cs,sy-9.4*cs, sx,sy-7.2*cs);
      x.quadraticCurveTo(sx+2*cs,sy-9*cs, sx+4*cs,sy-6.8*cs);
      x.quadraticCurveTo(sx+6*cs,sy-6.6*cs, sx+6.6*cs,sy-9.4*cs);
      x.lineTo(sx+8*cs,sy-9.8*cs); x.lineTo(sx+8*cs,sy-8.4*cs);
      x.lineTo(sx+7*cs,sy-5*cs); x.lineTo(sx+7*cs,sy);
      x.closePath(); x.fill();
      const lp2=Math.sin(t*3.2+i*2);
      x.strokeStyle='#080706'; x.lineWidth=1.1*cs;
      x.beginPath();
      x.moveTo(sx-5*cs,sy-1*cs); x.lineTo(sx-5*cs+lp2*1.6*cs,sy+3.4*cs);
      x.moveTo(sx-2*cs,sy-1*cs); x.lineTo(sx-2*cs-lp2*1.6*cs,sy+3.4*cs);
      x.moveTo(sx+3*cs,sy-1*cs); x.lineTo(sx+3*cs+lp2*1.4*cs,sy+3.4*cs);
      x.moveTo(sx+5.6*cs,sy-1*cs); x.lineTo(sx+5.6*cs-lp2*1.4*cs,sy+3.4*cs);
      x.stroke();
    }
    x.globalAlpha=1;
  }

  // птицы у диска — днём, разрозненные (анти-слоп: не стая-галочки)
  if(k<0.4){
    x.strokeStyle='#0A0807'; x.lineWidth=1.6;
    for(let i=0;i<4;i++){
      const a=t*0.12+i*2.3;
      const bx=discX+Math.cos(a)*(discR*2.2+i*46);
      const by=discY+Math.sin(a*0.8)*(discR*1.1+i*18);
      if(by>hy-16) continue;
      const fl=Math.sin(t*5.4+i*2)*3.4;
      x.globalAlpha=0.6*(1-k*2);
      x.beginPath();
      x.moveTo(bx-5,by+fl*0.4); x.quadraticCurveTo(bx,by-2-fl,bx,by);
      x.quadraticCurveTo(bx,by-2-fl,bx+5,by+fl*0.4);
      x.stroke();
    }
    x.globalAlpha=1;
  }
}

// передний силуэтный план (параллакс 1.28)
function drawForeground(){
  const k=1.28;
  x.fillStyle='#040303'; x.strokeStyle='#040303';
  const step=22;
  const w0=cam.x*k, w1=w0+CW/zoom+60;
  for(let wx=Math.floor(w0/step)*step; wx<w1; wx+=step){
    const seed=wx/step;
    const sx=(wx-w0)*zoom;
    const h=(10+Math.abs(J(seed))*30)*zoom;
    if(J(seed*3)>0.55){ // камень
      x.globalAlpha=0.9;
      x.beginPath(); x.ellipse(sx,CH+3,step*0.5*zoom,h*0.4,0,Math.PI,0); x.fill();
      continue;
    }
    x.globalAlpha=0.88; x.lineWidth=2.2*zoom; x.lineCap='round';
    for(let b=0;b<3;b++){
      const bx=sx+(b-1)*5*zoom;
      x.beginPath(); x.moveTo(bx,CH+4);
      x.quadraticCurveTo(bx+J(seed+b)*6*zoom, CH-h*0.6, bx+J(seed*7+b)*10*zoom, CH-h-b*3*zoom);
      x.stroke();
    }
    x.lineCap='butt';
  }
  x.globalAlpha=1;
}

// ═══════════════ КАДР ═══════════════
let t0=performance.now(), tPrev=t0, frameN=0;
let sitPhase=0;
const locEl=document.getElementById('loc');
function frame(now){
  const t=(now-t0)/1000, dt=Math.min(0.05,(now-tPrev)/1000); tPrev=now; frameN++;
  tCycle+=dt;
  const ph=(tCycle%CYCLE)/CYCLE;
  const darkA=ambientDark(ph);
  const breath=0.8+0.2*Math.sin(t*(Math.PI*2/7));

  const lights=[
    {x:ATASH.x,y:ATASH.y-90,r:150*(0.94+0.06*Math.sin(t*7.7))},
    {x:LANTERN.x,y:LANTERN.y-16,r:105*(0.95+0.05*Math.sin(t*6.1))},
  ];
  lights.push({x:player.x,y:player.y-14,r:30+ember.v*70});

  let litHere=darkA<0.4;
  let nearLight=false;
  for(const L of lights.slice(0,-1)){
    const d=Math.hypot(player.x-L.x,player.y-L.y);
    if(d<L.r){litHere=true;}
    if(d<L.r*0.85){nearLight=true;}
  }
  if(nearLight) ember.v=Math.min(1,ember.v+dt/3);
  else ember.v=Math.max(0,ember.v-dt/(darkA>0.4?220:420));
  if(ember.v>0.05) litHere=litHere||darkA<0.4;

  if(darkA>0.7 && !nearLight && ember.v<=0.05 && sitPhase===0) sitPhase=0.0001;
  if(sitPhase>0){
    sitPhase+=dt/2.4;
    if(sitPhase>=1){
      tCycle=Math.ceil(tCycle/CYCLE)*CYCLE+CYCLE*0.935;
      player.x=ATASH.x-60; player.y=ATASH.y+40;
      ember.v=0.55; sitPhase=-1;
      note(player.x,player.y-60,'вечер пережит');
    }
  }
  if(sitPhase<0){ sitPhase+=dt/1.6; if(sitPhase>=0)sitPhase=0; }

  updatePlayer(dt); updateWhispers(litHere);
  if(paperTimer>0){ paperTimer--; if(paperTimer<=0) paperEl.style.display='none'; }

  const viewW=CW/zoom, viewH=CH/zoom;
  let tx=player.x-viewW/2, ty=player.y-viewH/2;
  cam.x+=(tx-cam.x)*0.06; cam.y+=(ty-cam.y)*0.06;
  cam.x=Math.max(0,Math.min(WORLD.w-viewW,cam.x));
  cam.y=Math.max(0,Math.min(WORLD.h-viewH,cam.y));
  locEl.textContent='чаша на фундаменте · '+phaseWord(ph);

  x.setTransform(DPR,0,0,DPR,0,0);
  x.fillStyle=NIGHT; x.fillRect(0,0,CW,CH);
  x.imageSmoothingEnabled=true;

  // небо + дальние планы + караван
  drawSky(ph,darkA,t);

  // полоса действия
  x.drawImage(staticC,cam.x*Q,cam.y*Q,viewW*Q,viewH*Q, 0,0,CW,CH);

  x.setTransform(DPR*zoom,0,0,DPR*zoom,-cam.x*DPR*zoom,-cam.y*DPR*zoom);

  // следы
  for(const f of footprints){
    f.age++;
    const a=Math.max(0,1-f.age/800)*0.2;
    if(a<=0)continue;
    x.strokeStyle=BONE; x.globalAlpha=a; x.lineWidth=0.8;
    x.beginPath(); x.ellipse(f.x,f.y,3.4,1.6,f.a,0,7); x.stroke();
  }
  x.globalAlpha=1;

  // вода в чаше — бирюза фаянса
  x.save(); x.beginPath();
  x.ellipse(BOWL.x,BOWL.y-24,36,7.6,0,0,7); x.clip();
  x.fillStyle=FAIENCE; x.globalAlpha=0.5+(darkA<0.4?0.22:0);
  x.fillRect(BOWL.x-40,BOWL.y-34,80,20);
  x.strokeStyle='#8FD4CE'; x.lineWidth=0.8;
  for(let i=0;i<3;i++){
    x.globalAlpha=0.35+0.2*Math.sin(t*1.3+i*2.4);
    const ry=BOWL.y-27+i*2.6+Math.sin(t*0.9+i)*0.8;
    x.beginPath(); x.moveTo(BOWL.x-28,ry); x.quadraticCurveTo(BOWL.x,ry+1.4,BOWL.x+28,ry); x.stroke();
  }
  x.restore(); x.globalAlpha=1;
  x.strokeStyle=BONE; x.globalAlpha=0.5; x.lineWidth=0.7;
  x.beginPath(); x.ellipse(BOWL.x,BOWL.y-24,36,7.6,0,0,7); x.stroke();
  x.globalAlpha=1;

  // ручей — блики
  x.strokeStyle='#5B7C74'; x.lineWidth=1.1;
  for(let i=0;i<7;i++){
    x.globalAlpha=0.25+0.15*Math.sin(t*2+i*2);
    const tt=((t*0.06+i*0.145)%1);
    const px=2130+tt*260+Math.sin(tt*9)*18, py=HOR+8+tt*560;
    x.beginPath(); x.moveTo(px-3,py); x.lineTo(px+3,py+9); x.stroke();
  }
  x.globalAlpha=1;

  // тёплый свет
  const warmGlow=(gx,gy,r,al)=>{
    x.save(); x.translate(gx,gy); x.scale(1,0.5);
    const gg=x.createRadialGradient(0,0,6,0,0,r);
    gg.addColorStop(0,`rgba(226,138,58,${al})`);
    gg.addColorStop(0.5,`rgba(194,59,43,${al*0.35})`);
    gg.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=gg; x.fillRect(-r,-r,r*2,r*2);
    x.restore();
  };
  warmGlow(ATASH.x,ATASH.y+2,150*breath,0.2*breath);
  rays(x,ATASH.x,ATASH.y-88,26,90*breath,44,CANDLE,0.11*breath);
  warmGlow(LANTERN.x,LANTERN.y+6,70,0.14);

  // пламя аташкады
  const af=(ph2,s,col,al)=>{
    x.fillStyle=col; x.globalAlpha=al;
    const fh=(30+Math.sin(t*3.3+ph2)*7)*s, fw2=(11+Math.sin(t*4.9+ph2)*3)*s;
    x.beginPath();
    x.moveTo(ATASH.x-fw2,ATASH.y-86);
    x.bezierCurveTo(ATASH.x-fw2*1.3,ATASH.y-86-fh*0.45, ATASH.x+Math.sin(t*5+ph2)*5,ATASH.y-86-fh*0.8,
      ATASH.x+Math.sin(t*2.6+ph2)*4,ATASH.y-86-fh);
    x.bezierCurveTo(ATASH.x+fw2*1.25,ATASH.y-86-fh*0.5, ATASH.x+fw2,ATASH.y-86-fh*0.15, ATASH.x+fw2,ATASH.y-86);
    x.closePath(); x.fill(); x.globalAlpha=1;
  };
  af(0,1.1,RED,0.45); af(2.1,0.9,CANDLE,0.7); af(4.2,0.5,'#F2C079',0.9);
  x.fillStyle=CANDLE;
  for(let i=0;i<5;i++){
    const sp=(t*0.22+i*0.2)%1;
    if(sp<0.9){
      x.globalAlpha=(1-sp)*0.8;
      x.beginPath(); x.arc(ATASH.x+Math.sin(t*1.3+i*2)*10*sp, ATASH.y-96-sp*90, 1.1,0,7); x.fill();
    }
  }
  x.globalAlpha=1;

  // фонарь Диогена
  const lf=0.85+0.15*Math.sin(t*6.1);
  x.fillStyle=`rgba(242,192,121,${0.85*lf})`;
  x.fillRect(LANTERN.x-3.4,LANTERN.y-22,7,10);
  x.fillStyle=CANDLE; x.globalAlpha=0.75*lf;
  x.beginPath();
  x.moveTo(LANTERN.x-2.6,LANTERN.y-14);
  x.quadraticCurveTo(LANTERN.x+Math.sin(t*5.2)*1.6,LANTERN.y-25, LANTERN.x+2.6,LANTERN.y-14);
  x.closePath(); x.fill();
  x.globalAlpha=1;
  rays(x,LANTERN.x,LANTERN.y-17,10,34,16,CANDLE,0.1*lf);

  // петух
  const rx=880, ry=730, peck=Math.max(0,Math.sin(t*1.7))*Math.max(0,Math.sin(t*9))*3;
  x.fillStyle='#0A0908';
  x.beginPath(); x.ellipse(rx,ry-8,7,5,0,0,7); x.fill();
  x.beginPath(); x.arc(rx+6,ry-13+peck,3,0,7); x.fill();
  x.strokeStyle='#0A0908'; x.lineWidth=1.6;
  x.beginPath(); x.moveTo(rx+8.6,ry-13+peck); x.lineTo(rx+11,ry-12+peck); x.stroke();
  x.strokeStyle=RED; x.globalAlpha=0.8; x.lineWidth=1.2;
  x.beginPath(); x.moveTo(rx+5,ry-16+peck); x.lineTo(rx+6,ry-18+peck);
  x.lineTo(rx+7,ry-16+peck); x.stroke();
  x.globalAlpha=1;
  x.strokeStyle='#0A0908'; x.lineWidth=1.2;
  x.beginPath(); x.moveTo(rx-2,ry-3); x.lineTo(rx-2,ry);
  x.moveTo(rx+2,ry-3); x.lineTo(rx+2,ry); x.stroke();
  x.strokeStyle=BONE; x.globalAlpha=0.3; x.lineWidth=0.5;
  for(let i=0;i<4;i++){
    x.beginPath(); x.moveTo(rx-6+i*3,ry-11); x.lineTo(rx-7+i*3,ry-14); x.stroke();
  }
  x.globalAlpha=1;

  // сократики
  const soc=(sx,sy,flip,ph2)=>{
    const arm=Math.sin(t*0.9+ph2)*0.3+0.2;
    x.fillStyle='rgba(4,3,3,0.45)';
    x.beginPath(); x.ellipse(sx+2,sy+2,9,3,0,0,7); x.fill();
    x.fillStyle='#0B0A08';
    x.beginPath();
    x.moveTo(sx-6*flip,sy);
    x.bezierCurveTo(sx-8*flip,sy-14, sx-6*flip,sy-24, sx-2*flip,sy-28);
    x.lineTo(sx+4*flip,sy-28);
    x.bezierCurveTo(sx+7*flip,sy-20, sx+8*flip,sy-10, sx+6*flip,sy);
    x.closePath(); x.fill();
    x.beginPath(); x.arc(sx+1*flip,sy-32,4.4,0,7); x.fill();
    x.strokeStyle='#0B0A08'; x.lineWidth=2; x.lineCap='round';
    x.beginPath(); x.moveTo(sx+3*flip,sy-24);
    x.lineTo(sx+(10+arm*8)*flip,sy-26-arm*8); x.stroke(); x.lineCap='butt';
    x.strokeStyle=BONE; x.globalAlpha=0.3; x.lineWidth=0.6;
    x.beginPath(); x.arc(sx+1*flip,sy-32,4.6,-2.6,-0.8); x.stroke();
    x.beginPath(); x.moveTo(sx-5.4*flip,sy);
    x.bezierCurveTo(sx-7.4*flip,sy-14, sx-5.6*flip,sy-24, sx-1.8*flip,sy-28); x.stroke();
    x.globalAlpha=1;
  };
  soc(920,655,1,0); soc(1046,652,-1,2.6);

  // служитель аташкады
  const srvT=(t%9)/9, srv=srvT<0.22?Math.sin(srvT/0.22*Math.PI):0;
  const zx=ATASH.x+44, zy=ATASH.y+6;
  x.fillStyle='rgba(4,3,3,0.45)';
  x.beginPath(); x.ellipse(zx+2,zy+2,8,3,0,0,7); x.fill();
  x.fillStyle='#0B0A08';
  x.beginPath();
  x.moveTo(zx-5,zy);
  x.bezierCurveTo(zx-7,zy-13, zx-5,zy-22, zx-1,zy-26);
  x.lineTo(zx+3,zy-26);
  x.bezierCurveTo(zx+6,zy-18, zx+7,zy-9, zx+5,zy);
  x.closePath(); x.fill();
  x.beginPath(); x.arc(zx,zy-29,4,0,7); x.fill();
  x.strokeStyle='#0B0A08'; x.lineWidth=2; x.lineCap='round';
  x.beginPath(); x.moveTo(zx-2,zy-20);
  x.lineTo(zx-8-srv*16,zy-24-srv*26); x.stroke(); x.lineCap='butt';
  x.strokeStyle=BONE; x.globalAlpha=0.25; x.lineWidth=0.6;
  x.beginPath(); x.arc(zx,zy-29,4.2,-2.6,-0.8); x.stroke(); x.globalAlpha=1;

  // пыль в воздухе
  x.fillStyle=BONE;
  for(let i=0;i<22;i++){
    const px=((J(i)*0.5+0.5)*WORLD.w + t*(4+Math.abs(J(i*3))*5))%WORLD.w;
    const py=HOR+40+(J(i*7)*0.5+0.5)*480 + Math.sin(t*0.5+i)*6;
    x.globalAlpha=(0.04+Math.abs(J(i*5))*0.05)*(darkA<0.4?1:0.4);
    x.fillRect(px,py,1.3,1.3);
  }
  x.globalAlpha=1;

  // качающиеся травы
  const sway2=(gx,gy,n)=>{
    x.strokeStyle='#0A0908'; x.lineWidth=1.4;
    for(let b=0;b<n;b++){
      const bend=Math.sin(t*0.9+gx*0.01+b)*3;
      x.globalAlpha=0.55;
      x.beginPath(); x.moveTo(gx+b*4,gy);
      x.quadraticCurveTo(gx+b*4+bend*0.5,gy-9, gx+b*4+bend,gy-16-Math.abs(J(b+gx))*8);
      x.stroke();
    }
    x.globalAlpha=1;
  };
  sway2(420,860,4); sway2(1330,700,3); sway2(1960,780,5); sway2(2760,880,4); sway2(240,610,3);

  // подбираемый мох
  for(const pk of PICKUPS){
    if(pk.taken) continue;
    const gl=0.5+0.35*Math.sin(t*2.2+pk.x);
    x.strokeStyle=MIST; x.globalAlpha=0.8*gl+0.2; x.lineWidth=1.4;
    for(let i=0;i<3;i++){
      x.beginPath(); x.moveTo(pk.x-4+i*4,pk.y+3);
      x.quadraticCurveTo(pk.x-5+i*4,pk.y-4, pk.x-2+i*4,pk.y-7); x.stroke();
    }
  }
  x.globalAlpha=1;

  drawWanderer(t);

  for(const o of occluders){
    if(player.y<o.base &&
       player.x+14>o.x && player.x-14<o.x+o.w &&
       player.y+10>o.y && player.y-24<o.y+o.h){
      x.drawImage(staticC,o.x*Q,o.y*Q,o.w*Q,o.h*Q,o.x,o.y,o.w,o.h);
    }
  }

  // передний силуэтный план
  x.setTransform(DPR,0,0,DPR,0,0);
  drawForeground();

  // ТЬМА
  if(darkA>0.01){
    dk.setTransform(DPR,0,0,DPR,0,0);
    dk.clearRect(0,0,CW,CH);
    dk.fillStyle=`rgba(3,2,2,${darkA})`;
    dk.fillRect(0,0,CW,CH);
    dk.globalCompositeOperation='destination-out';
    for(const L of lights){
      const sx2=(L.x-cam.x)*zoom, sy2=(L.y-cam.y)*zoom, sr=L.r*zoom;
      const gg=dk.createRadialGradient(sx2,sy2,sr*0.12,sx2,sy2,sr);
      gg.addColorStop(0,'rgba(0,0,0,1)');
      gg.addColorStop(0.6,'rgba(0,0,0,0.85)');
      gg.addColorStop(1,'rgba(0,0,0,0)');
      dk.fillStyle=gg;
      dk.beginPath(); dk.arc(sx2,sy2,sr,0,7); dk.fill();
    }
    // небо и луна не гаснут полностью — ночь Бакши светится сверху
    const hy2=(HOR-cam.y)*zoom;
    const skyHole=dk.createLinearGradient(0,0,0,hy2);
    skyHole.addColorStop(0,'rgba(0,0,0,0.55)');
    skyHole.addColorStop(1,'rgba(0,0,0,0.15)');
    dk.fillStyle=skyHole; dk.fillRect(0,0,CW,Math.max(0,hy2));
    dk.globalCompositeOperation='source-over';
    x.drawImage(darkC,0,0,CW,CH);
  }

  x.setTransform(DPR*zoom,0,0,DPR*zoom,-cam.x*DPR*zoom,-cam.y*DPR*zoom);
  // пометки
  for(let i=notes.length-1;i>=0;i--){
    const n=notes[i]; n.life--; n.y-=0.14;
    if(n.life<=0){notes.splice(i,1);continue;}
    const a=Math.min(1,n.life/40)*Math.min(1,(150-n.life)/20);
    x.font='italic 15px "Cormorant Garamond"'; x.textAlign='center';
    x.fillStyle=`rgba(217,207,184,${a*0.85})`;
    x.fillText(n.t,n.x,n.y);
    x.textAlign='left';
  }
  // подсказка осмотра
  let nearIns=null;
  for(const ins of INSPECT){
    if(Math.hypot(player.x-ins.x,player.y-ins.y)<ins.r+34){nearIns=ins;break;}
  }
  if(nearIns && paperTimer<=0){
    x.font='italic 14px "Cormorant Garamond"'; x.textAlign='center';
    x.fillStyle='rgba(217,207,184,0.6)';
    x.fillText(IS_TOUCH?'коснись — рассмотреть':'e — рассмотреть',nearIns.x,nearIns.y-64);
    x.textAlign='left';
  }
  // шёпот
  if(whisper.life>0){
    const a=whisper.life>240?(300-whisper.life)/60:Math.min(1,whisper.life/120);
    const sx2=(whisper.x-cam.x)*zoom, sy2=(whisper.y-cam.y)*zoom-(300-whisper.life)*0.06;
    x.setTransform(DPR,0,0,DPR,0,0);
    x.font='italic 17px "Cormorant Garamond"'; x.textAlign='center';
    x.fillStyle='rgba(217,207,184,'+(a*0.7)+')';
    x.fillText(whisper.t, Math.max(120,Math.min(CW-120,sx2)), Math.max(40,Math.min(CH-60,sy2)));
    x.textAlign='left';
  }

  // экранный слой
  x.setTransform(DPR,0,0,DPR,0,0);
  if(darkA<0.4){
    x.fillStyle=`rgba(194,59,43,${0.028*(1-darkA*2.5)})`;
    x.fillRect(0,0,CW,CH);
    x.fillStyle=`rgba(226,138,58,${0.02*(1-darkA*2.5)})`;
    x.fillRect(0,0,CW,CH);
  }
  const gseed=Math.floor(t*7);
  x.globalAlpha=0.05;
  for(let i=0;i<170;i++){
    x.fillStyle=(i%3)?BONE:ASH;
    x.fillRect((J(i+gseed)*0.5+0.5)*CW,(J(i*7+gseed)*0.5+0.5)*CH,1,1);
  }
  x.globalAlpha=1;
  const vig=x.createRadialGradient(CW/2,CH/2,Math.min(CW,CH)*0.44,CW/2,CH/2,Math.max(CW,CH)*0.72);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,`rgba(5,4,3,${0.26+darkA*0.34})`);
  x.fillStyle=vig; x.fillRect(0,0,CW,CH);
  if(sitPhase!==0){
    x.fillStyle=`rgba(3,2,2,${sitPhase>0?Math.min(1,sitPhase):1-Math.min(1,sitPhase+1)})`;
    x.fillRect(0,0,CW,CH);
  }
  x.strokeStyle=BONE; x.globalAlpha=0.5; x.lineWidth=1;
  x.strokeRect(10,10,CW-20,CH-20);
  x.globalAlpha=0.18; x.strokeRect(14,14,CW-28,CH-28);
  x.globalAlpha=1;

  requestAnimationFrame(frame);
}

// ── Странник: плавучая походка регистра-1977 ──
function drawWanderer(t){
  const p=player;
  const per=0.8+(p.y/WORLD.h)*0.45;
  const mov=p.moving?1:0;
  const bob=Math.abs(Math.sin(p.step*0.24))*3.4*mov;
  const sway=Math.sin(p.step*0.12)*0.07*mov + Math.sin(t*0.9)*0.012
           + p.fx*0.05*mov;
  x.fillStyle='rgba(4,3,3,0.48)';
  x.beginPath(); x.ellipse(p.x+3,p.y+3,13*per,4.4*per,0,0,7); x.fill();
  x.save(); x.translate(p.x,p.y); x.rotate(sway); x.scale(per,per); x.translate(0,-bob);
  const lp=Math.sin(p.step*0.24);
  x.strokeStyle='#0A0908'; x.lineWidth=3; x.lineCap='round';
  x.beginPath();
  x.moveTo(-3.4,-7); x.lineTo(-3.4+lp*5.2*mov,0.6);
  x.moveTo(3.4,-7); x.lineTo(3.4-lp*5.2*mov,0.6);
  x.stroke(); x.lineCap='butt';
  x.fillStyle='#0B0A08';
  x.beginPath();
  x.moveTo(-7,-30);
  x.bezierCurveTo(-10,-22,-12,-13,-13,-4);
  for(let i=0;i<=6;i++){
    const sx=-13+(26)*(i/6);
    x.lineTo(sx-1.6,-4-(i%2?4.6:0)-Math.abs(J(i*3))*2.4);
    x.lineTo(sx,-4);
  }
  x.bezierCurveTo(12,-13,10,-22,7,-30);
  x.closePath(); x.fill();
  x.strokeStyle=BONE; x.globalAlpha=0.12; x.lineWidth=0.5;
  for(let i=0;i<3;i++){
    x.beginPath(); x.moveTo(-10+i*2,-26+i*7); x.lineTo(9-i*2,-23+i*7); x.stroke();
  }
  x.globalAlpha=1;
  x.fillStyle='#060505';
  x.beginPath(); x.ellipse(p.fx*1.6,-37,8.6,8,0,0,7); x.fill();
  x.beginPath(); x.moveTo(-6,-33); x.quadraticCurveTo(0,-27,6,-33); x.lineTo(4,-29.4); x.lineTo(-4,-29.4); x.closePath(); x.fill();
  x.fillStyle='#020202';
  x.beginPath(); x.ellipse(p.fx*4,-36.4,4.6,4,0,0,7); x.fill();
  x.strokeStyle=BONE; x.globalAlpha=0.3; x.lineWidth=0.8;
  x.beginPath(); x.ellipse(p.fx*1.6,-37,8.9,8.3,0,Math.PI*1.05,Math.PI*1.75); x.stroke();
  x.beginPath(); x.moveTo(-7.4,-29); x.bezierCurveTo(-10.4,-21,-12.4,-12,-13.2,-4); x.stroke();
  x.globalAlpha=1;
  const df=Math.hypot(p.x-ATASH.x,p.y-ATASH.y);
  if(df<380){
    const la=Math.atan2(ATASH.y-90-p.y,ATASH.x-p.x);
    x.strokeStyle='#E8C89A'; x.globalAlpha=0.5-df/380*0.35; x.lineWidth=1;
    x.beginPath(); x.ellipse(p.fx*1.6,-37,8.9,8.3,0,la-0.8,la+0.8); x.stroke();
    x.globalAlpha=1;
  }
  const hb=0.5+0.5*Math.sin(t*2.6);
  x.fillStyle='#F2C079'; x.globalAlpha=(0.25+ember.v*0.75)*(0.6+hb*0.4);
  x.beginPath(); x.arc(p.fx*2.4,-22,1.5+ember.v*1.3,0,7); x.fill();
  x.globalAlpha=1;
  x.strokeStyle='#241E18'; x.lineWidth=2;
  x.beginPath(); x.moveTo(9,-26); x.lineTo(12.6,1); x.stroke();
  x.strokeStyle=BONE; x.globalAlpha=0.35; x.lineWidth=0.6;
  x.beginPath(); x.moveTo(9.8,-26); x.lineTo(13.4,1); x.stroke();
  x.globalAlpha=1;
  x.restore();
}

window.__game={player,cam:()=>cam,tp:(px,py)=>{player.x=px;player.y=py;},
  ember,setPhase:f=>{tCycle=Math.floor(tCycle/CYCLE)*CYCLE+CYCLE*f;}};
requestAnimationFrame(frame);
</script>
