<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ardet · офорт — играбельная проба</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#080706;overflow:hidden}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  #hud{position:fixed;top:14px;left:18px;pointer-events:none;
    font-family:Montserrat,sans-serif;font-weight:300;font-size:10px;
    letter-spacing:3px;color:#8A8D8F;text-transform:uppercase}
  #loc{position:fixed;top:14px;right:18px;pointer-events:none;text-align:right;
    font-family:Montserrat,sans-serif;font-weight:300;font-size:10px;
    letter-spacing:3px;color:#8A8D8F;text-transform:uppercase}
  #hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;pointer-events:none;
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:#5b5f61}
  /* опись — бумажный ярлык, не полоса */
  #opis{position:fixed;left:16px;bottom:16px;pointer-events:none;
    background:linear-gradient(172deg,#EEE3CB,#E0D2B4);color:#3A3026;
    transform:rotate(-1.6deg);padding:8px 14px 9px;
    box-shadow:0 6px 22px rgba(0,0,0,0.6);}
  #opis b{display:block;font-family:Montserrat;font-weight:500;font-size:8px;
    letter-spacing:3px;color:#C23B2B;margin-bottom:3px}
  #opis span{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px}
  #paper{position:fixed;left:50%;bottom:60px;transform:translateX(-50%) rotate(-1.2deg);
    background:linear-gradient(172deg,#EEE3CB,#E0D2B4);color:#3A3026;
    padding:13px 20px 14px;max-width:400px;box-shadow:0 8px 30px rgba(0,0,0,.65);display:none}
  #paper b{display:block;font-family:Montserrat;font-weight:500;font-size:8px;
    letter-spacing:3px;color:#C23B2B;margin-bottom:4px;text-transform:uppercase}
  #paper span{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15.5px;line-height:1.35}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">ardet · проба офорта</div>
<div id="loc">городок · вечер</div>
<div id="hint">wasd · палец — идти · e — быт</div>
<div id="opis"><b>опись</b><span id="opistext">пусто. пока честно.</span></div>
<div id="paper"><b id="ptitle"></b><span id="ptext"></span></div>
<script>
// ═══════════════════════════════════════════════════════════════════
// ARDET — играбельная проба. Визуально и по петле — как Don't Starve,
// но по канону: ни одной полосы. Состояние = свет и чернила.
// Ночь съедает мир до кругов света; костёр кормится щепой; уголёк
// у сердца — личный огонь; фонарь можно затеплить навсегда.
// ═══════════════════════════════════════════════════════════════════
const NIGHT='#0D0B0A', BONE='#D9CFB8', ASH='#8A8D8F', MIST='#3D4A3A', CANDLE='#E28A3A', RED='#C23B2B';
const WORLD={w:2560,h:1000};
const HOR=420; // мировой горизонт — регистр «Волшебники-1977»
const Q=1.6;
const FIRE={x:820,y:760};
const LANTERN={x:480,y:780};
const TOWER={x:340,y:930};   // пожарная каланча — Маячник обратного света
const CATHOME={x:1065,y:530}; // дом кота
const IS_TOUCH='ontouchstart' in window||navigator.maxTouchPoints>0;

const cv=document.getElementById('c'), x=cv.getContext('2d');
let CW=0,CH=0,DPR=1,zoom=1;
const darkC=document.createElement('canvas'); const dk=darkC.getContext('2d');
function resize(){
  CW=innerWidth; CH=innerHeight;
  DPR=Math.min(2,devicePixelRatio||1);
  cv.width=CW*DPR; cv.height=CH*DPR;
  cv.style.width=CW+'px'; cv.style.height=CH+'px';
  darkC.width=CW*DPR; darkC.height=CH*DPR;
  zoom=Math.max(CW/1200, CH/820, CW/WORLD.w, CH/WORLD.h);
}
addEventListener('resize',resize); resize();

const J=i=>Math.sin(i*127.13)*43758.545%1;

function hatch(g,pathFn,bb,layers){
  for(const L of layers){
    g.save(); g.beginPath(); pathFn(g); g.clip();
    g.strokeStyle=L.col||BONE; g.globalAlpha=L.a; g.lineWidth=L.w||0.6;
    const ang=L.ang*Math.PI/180, diag=Math.hypot(bb.w,bb.h);
    const cx=bb.x+bb.w/2, cy=bb.y+bb.h/2, n=Math.ceil(diag/L.gap)+2;
    g.beginPath();
    for(let i=-n;i<n;i++){
      const off=i*L.gap, j1=J(i+L.ang)*(L.j||0), j2=J(i*2+L.ang)*(L.j||0);
      const x0=cx+Math.cos(ang+Math.PI/2)*off-Math.cos(ang)*diag;
      const y0=cy+Math.sin(ang+Math.PI/2)*off-Math.sin(ang)*diag;
      g.moveTo(x0+j1,y0+j2);
      g.lineTo(x0+Math.cos(ang)*diag*2+j2, y0+Math.sin(ang)*diag*2+j1);
    }
    g.stroke(); g.restore();
  }
  g.globalAlpha=1;
}
function rays(g,cx,cy,r0,r1,n,col,a,a0=0,a1=Math.PI*2){
  g.strokeStyle=col; g.globalAlpha=a; g.lineWidth=0.7;
  g.beginPath();
  for(let i=0;i<n;i++){
    const ang=a0+(i/n)*(a1-a0)+J(i)*0.03;
    const rr=r1*(0.75+J(i*3)*0.5);
    g.moveTo(cx+Math.cos(ang)*r0, cy+Math.sin(ang)*r0);
    g.lineTo(cx+Math.cos(ang)*rr, cy+Math.sin(ang)*rr);
  }
  g.stroke(); g.globalAlpha=1;
}

// ═══════ ДАЛЬНИЙ ПЛАН (0.15): гора и ЗАМОК — виден и недостижим ═══════
const castleC=document.createElement('canvas'); castleC.width=3200; castleC.height=300;
(function renderCastle(){
  const g=castleC.getContext('2d');
  // дальние холмы
  g.fillStyle='#0B0908'; g.globalAlpha=0.8;
  g.beginPath(); g.moveTo(0,300);
  for(let px=0;px<=3200;px+=70) g.lineTo(px,236+Math.sin(px*0.003)*18+J(px)*7);
  g.lineTo(3200,300); g.closePath(); g.fill();
  // ГОРА ЗАМКА
  const bx=880, base=286;
  g.globalAlpha=0.72; g.fillStyle='#0A0807';
  g.beginPath(); g.moveTo(bx-400,base);
  g.lineTo(bx-250,base-72); g.lineTo(bx-175,base-58);
  g.lineTo(bx-105,base-104); g.lineTo(bx-58,base-96);
  g.lineTo(bx-30,base-128); g.lineTo(bx+120,base-128);  // плато замка
  g.lineTo(bx+168,base-86); g.lineTo(bx+255,base-100);
  g.lineTo(bx+410,base); g.closePath(); g.fill();
  // ЗАМОК на плато
  const wallY=base-128;
  g.fillStyle='#0A0807';
  g.fillRect(bx-28,wallY-42,146,42);                    // стена
  const tw=(tx,w,h)=>{ g.fillRect(tx,wallY-h,w,h);
    g.beginPath(); g.moveTo(tx-3,wallY-h); g.lineTo(tx+w/2,wallY-h-20); g.lineTo(tx+w+3,wallY-h); g.closePath(); g.fill(); };
  tw(bx-24,22,64); tw(bx+20,28,102); tw(bx+66,20,56); tw(bx+100,24,80);
  for(let i=0;i<9;i++) g.fillRect(bx-28+i*16.5,wallY-48,8,8); // зубцы
  // флажок на высшей башне
  g.strokeStyle='#0A0807'; g.lineWidth=1.6;
  g.beginPath(); g.moveTo(bx+34,wallY-122); g.lineTo(bx+34,wallY-136); g.stroke();
  g.beginPath(); g.moveTo(bx+34,wallY-136); g.lineTo(bx+44,wallY-132); g.lineTo(bx+34,wallY-128); g.closePath();
  g.fillStyle='#0A0807'; g.fill();
  // марево рвёт кладку — редкими полосами
  g.globalCompositeOperation='destination-out';
  for(let y2=wallY-140;y2<wallY;y2+=6){
    if(J(y2)>-0.15) continue;
    g.globalAlpha=0.35+Math.abs(J(y2*3))*0.3;
    g.fillRect(bx-56,y2,216,1.8);
  }
  g.globalCompositeOperation='source-over';
  // лунная кромка башен
  g.strokeStyle=BONE; g.globalAlpha=0.28; g.lineWidth=1;
  g.beginPath(); g.moveTo(bx+20,wallY-102); g.lineTo(bx+20,wallY-42);
  g.moveTo(bx+100,wallY-80); g.lineTo(bx+100,wallY-42);
  g.moveTo(bx-28,wallY-42); g.lineTo(bx-28,wallY); g.stroke();
  g.globalAlpha=1;
  // ближняя гряда
  g.globalAlpha=0.95; g.fillStyle='#090807';
  g.beginPath(); g.moveTo(0,300);
  for(let px=0;px<=3200;px+=54) g.lineTo(px,272+Math.sin(px*0.006+1)*11+J(px*3)*5);
  g.lineTo(3200,300); g.closePath(); g.fill();
  g.globalAlpha=1;
})();
// ═══════ СРЕДНИЙ ПЛАН (0.5): поля, ограды, стога, изба ═══════
const midC=document.createElement('canvas'); midC.width=2900; midC.height=150;
(function renderMid(){
  const g=midC.getContext('2d');
  const base=146;
  g.fillStyle='#080706';
  g.beginPath(); g.moveTo(0,150);
  for(let px=0;px<=2900;px+=40) g.lineTo(px,base-5+J(px)*4);
  g.lineTo(2900,150); g.closePath(); g.fill();
  // жердяные ограды полей
  g.strokeStyle='#080706'; g.lineWidth=2.4;
  for(const x0 of [180,940,2000,2560]){
    for(let i=0;i<7;i++){
      g.beginPath(); g.moveTo(x0+i*26,base); g.lineTo(x0+i*26,base-16-Math.abs(J(i+x0))*6); g.stroke();
    }
    g.lineWidth=1.6;
    g.beginPath(); g.moveTo(x0-4,base-9); g.lineTo(x0+160,base-13); g.stroke();
    g.lineWidth=2.4;
  }
  // стога
  const stack=(sx,s2)=>{ g.fillStyle='#080706';
    g.beginPath(); g.moveTo(sx-16*s2,base);
    g.quadraticCurveTo(sx-14*s2,base-22*s2, sx,base-26*s2);
    g.quadraticCurveTo(sx+14*s2,base-22*s2, sx+16*s2,base); g.closePath(); g.fill();
    g.strokeStyle=BONE; g.globalAlpha=0.14; g.lineWidth=1;
    g.beginPath(); g.moveTo(sx-8*s2,base-20*s2); g.quadraticCurveTo(sx,base-25*s2,sx+8*s2,base-20*s2); g.stroke();
    g.globalAlpha=1; };
  stack(560,1); stack(660,0.75); stack(2260,1.1);
  // изба с тёмным окном и одинокое дерево
  g.fillStyle='#080706';
  g.fillRect(1360,base-30,52,30);
  g.beginPath(); g.moveTo(1354,base-30); g.lineTo(1386,base-46); g.lineTo(1418,base-30); g.closePath(); g.fill();
  g.strokeStyle='#080706'; g.lineWidth=3.4; g.lineCap='round';
  g.beginPath(); g.moveTo(1700,base); g.quadraticCurveTo(1697,base-26,1703,base-44); g.stroke();
  g.lineWidth=1.6;
  g.beginPath(); g.moveTo(1702,base-32); g.quadraticCurveTo(1716,base-42,1722,base-54);
  g.moveTo(1701,base-38); g.quadraticCurveTo(1688,base-48,1684,base-58); g.stroke();
  g.lineCap='butt';
})();

// ═══════════════ СТАТИЧНЫЙ СЛОЙ ═══════════════
const staticC=document.createElement('canvas');
staticC.width=WORLD.w*Q; staticC.height=WORLD.h*Q;
const S=staticC.getContext('2d');

// фасад «картонкой» — как в Don't Starve: стена анфас + двускатная крыша
function facade(g,bx0,base,wid,hgt,roofH,tile){
  const wallTop=base-hgt, bx1=bx0+wid, peak=wallTop-roofH, cx=bx0+wid/2;
  // прижатая тень у основания
  g.fillStyle='rgba(4,3,3,0.5)';
  g.beginPath(); g.ellipse(cx+14,base+7,wid*0.56,13,0,0,7); g.fill();
  // стена
  g.fillStyle='#0F0D0B'; g.fillRect(bx0,wallTop,wid,hgt);
  hatch(g,p=>p.rect(bx0,wallTop,wid,hgt),{x:bx0,y:wallTop,w:wid,h:hgt},[
    {ang:90,gap:2.8,a:0.2,w:0.6,j:0.4},{ang:0,gap:5.4,a:0.11,w:0.5,j:0.6}]);
  g.strokeStyle=BONE; g.globalAlpha=0.6; g.lineWidth=1;
  g.strokeRect(bx0,wallTop,wid,hgt); g.globalAlpha=1;
  // крыша
  const roof=p=>{p.moveTo(bx0-12,wallTop);p.lineTo(cx,peak);p.lineTo(bx1+12,wallTop);p.closePath();};
  g.fillStyle='#13110E'; g.beginPath(); roof(g); g.fill();
  g.save(); g.beginPath(); roof(g); g.clip();
  g.strokeStyle=BONE; g.lineWidth=0.6;
  const rows=Math.floor(roofH/12);
  for(let r=0;r<rows+1;r++){
    const ry=peak+8+r*12;
    g.globalAlpha=0.2+r*0.025;
    g.beginPath();
    if(tile==='arc'){
      for(let cx2=bx0-14;cx2<bx1+16;cx2+=16){
        g.moveTo(cx2+15,ry+(r%2?8:0));
        g.arc(cx2+7.5+(r%2?8:0),ry,7.5,0,Math.PI);
      }
    }else{
      for(let i=0;i<wid/14+2;i++){
        const sx=bx0-12+i*14+(r%2?7:0);
        g.moveTo(sx,ry); g.lineTo(sx+11,ry+3.2);
      }
    }
    g.stroke();
  }
  g.restore(); g.globalAlpha=1;
  g.strokeStyle=BONE; g.globalAlpha=0.65; g.lineWidth=1.1;
  g.beginPath(); roof(g); g.stroke(); g.globalAlpha=1;
  return {wallTop,peak,cx};
}

function renderStatic(){
  const g=S;
  g.setTransform(Q,0,0,Q,0,0);
  g.clearRect(0,0,WORLD.w,WORLD.h);
  // земля — только ниже горизонта; небо и планы рисуются за кадром
  g.fillStyle=NIGHT; g.fillRect(0,HOR,WORLD.w,WORLD.h-HOR);
  hatch(g,p=>p.rect(0,HOR,WORLD.w,WORLD.h-HOR),{x:0,y:HOR,w:WORLD.w,h:WORLD.h-HOR},[
    {ang:0,gap:3.6,a:0.13,w:0.55,j:1},
    {ang:0,gap:7.6,a:0.08,w:0.5,j:1.6},
  ]);
  // рим-лайт горизонта
  g.strokeStyle=BONE; g.globalAlpha=0.2; g.lineWidth=1.2;
  g.beginPath();
  for(let px=0;px<=WORLD.w;px+=40) px?g.lineTo(px,HOR+2+J(px)*2):g.moveTo(px,HOR+2);
  g.stroke(); g.globalAlpha=1;

  // брусчатка городка
  g.strokeStyle=BONE; g.lineWidth=0.55;
  for(let row=0;row<18;row++){
    const ry=440+row*30;
    for(let i=0;i<24;i++){
      const sx=(i*60+((row%2)?30:0));
      if(sx>1420) continue;
      if(J(row*31+i)>0.62) continue;
      g.globalAlpha=0.09+Math.abs(J(row+i*7))*0.07;
      g.beginPath(); g.ellipse(sx,ry,24,8.4,J(i+row)*0.08,0,7); g.stroke();
    }
  }
  g.globalAlpha=1;
  // пустошь
  for(let i=0;i<520;i++){
    const px=1420+(J(i)*0.5+0.5)*1140, py=445+(J(i*3)*0.5+0.5)*520;
    g.globalAlpha=0.10+Math.abs(J(i*5))*0.08;
    g.strokeStyle=BONE; g.lineWidth=0.5;
    g.beginPath(); g.moveTo(px,py); g.lineTo(px+6+J(i*7)*4,py+J(i*11)*1.5); g.stroke();
  }
  for(let i=0;i<70;i++){
    const px=1430+(J(i*13)*0.5+0.5)*1120, py=450+(J(i*17)*0.5+0.5)*510;
    g.globalAlpha=0.2;
    g.beginPath(); g.ellipse(px,py,3+Math.abs(J(i))*4,1.6+Math.abs(J(i*3))*2,0,0,7); g.stroke();
  }
  g.globalAlpha=1;

  // мох
  const moss=(mx,my,r,d)=>{
    const p=pp=>{
      for(let i=0;i<=9;i++){
        const a=i/9*Math.PI*2, rr=r*(0.7+Math.abs(J(i*3+mx))*0.5);
        const px=mx+Math.cos(a)*rr, py=my+Math.sin(a)*rr*0.6;
        i?pp.lineTo(px,py):pp.moveTo(px,py);
      }
      pp.closePath();
    };
    g.fillStyle=`rgba(61,74,58,${0.14*d})`; g.beginPath(); p(g); g.fill();
    hatch(g,p,{x:mx-r,y:my-r,w:r*2,h:r*2},[{ang:-20,gap:2.2,a:0.3*d,col:MIST,w:0.5,j:0.5}]);
    g.fillStyle=MIST; g.globalAlpha=0.5*d;
    for(let i=0;i<8;i++) g.fillRect(mx+J(i*7+mx)*r*0.8, my+J(i*3+my)*r*0.5, 1.4,1.4);
    g.globalAlpha=1;
  };
  moss(240,470,30,0.8); moss(660,930,38,0.7); moss(1240,560,28,0.8);
  moss(560,455,24,0.6); moss(1180,950,32,0.7);
  moss(1560,690,40,1); moss(1900,920,46,1); moss(2260,740,36,1.1);
  moss(2050,700,28,1.2); moss(2440,910,42,1.3);

  // колеи
  g.strokeStyle='#090807'; g.lineWidth=6; g.globalAlpha=0.6; g.lineCap='round';
  for(const off of [0,15]){
    g.beginPath(); g.moveTo(185,740+off);
    g.quadraticCurveTo(900,790+off, 1660,798+off);
    g.quadraticCurveTo(2100,804+off, 2560,822+off);
    g.stroke();
  }
  g.globalAlpha=0.14; g.strokeStyle=BONE; g.lineWidth=0.8;
  for(const off of [-4,19]){
    g.beginPath(); g.moveTo(185,740+off);
    g.quadraticCurveTo(900,790+off, 1660,798+off);
    g.quadraticCurveTo(2100,804+off, 2560,822+off);
    g.stroke();
  }
  g.globalAlpha=1; g.lineCap='butt';

  // ВРАТА
  const gx=64, gy=740;
  g.fillStyle='rgba(4,3,3,0.45)';
  g.beginPath(); g.moveTo(gx+2,gy); g.lineTo(gx+52,gy+34); g.lineTo(gx+150,gy+34); g.lineTo(gx+118,gy); g.closePath(); g.fill();
  g.strokeStyle=BONE; g.globalAlpha=0.75; g.lineWidth=1.2;
  g.strokeRect(gx-6,gy-120,16,120);
  g.strokeRect(gx+96,gy-120,16,120);
  g.beginPath(); g.moveTo(gx-8,gy-120);
  g.quadraticCurveTo(gx+52,gy-136, gx+114,gy-120); g.stroke();
  g.globalAlpha=1;
  hatch(g,p=>{p.rect(gx-6,gy-120,16,120);p.rect(gx+96,gy-120,16,120);},
    {x:gx-6,y:gy-120,w:120,h:120},[{ang:90,gap:2.4,a:0.26,w:0.6,j:0.4},{ang:8,gap:9,a:0.13,w:0.5}]);
  const leaf=p=>{p.moveTo(gx+40,gy+16);p.lineTo(gx+96,gy+30);p.lineTo(gx+88,gy+74);p.lineTo(gx+30,gy+58);p.closePath();};
  g.fillStyle='#0F0D0B'; g.beginPath(); leaf(g); g.fill();
  hatch(g,leaf,{x:gx+28,y:gy+14,w:72,h:64},[{ang:16,gap:3,a:0.24,w:0.55}]);
  g.strokeStyle=BONE; g.globalAlpha=0.5; g.lineWidth=0.9;
  g.beginPath(); leaf(g); g.stroke();
  for(let i=1;i<4;i++){
    g.beginPath(); g.moveTo(gx+40+i*14,gy+16+i*3.4); g.lineTo(gx+30+i*14.5,gy+58+i*4); g.stroke();
  }
  g.globalAlpha=1;
  g.strokeStyle=MIST; g.globalAlpha=0.85; g.lineWidth=0.9;
  for(let i=0;i<11;i++){
    const bx2=gx+22+i*7;
    g.beginPath(); g.moveTo(bx2,gy+14);
    g.quadraticCurveTo(bx2+J(i)*5-2,gy-2-Math.abs(J(i*2))*8, bx2+J(i*3)*7-3,gy-8-Math.abs(J(i))*9);
    g.stroke();
  }
  g.globalAlpha=1;

  // ── КАНЦЕЛЯРИЯ — фасад анфас ──
  const kf=facade(g,300,560,260,150,62,'arc');
  g.strokeStyle=ASH; g.lineWidth=0.9;
  const winxs=[330,392,454,516];
  for(const wx of winxs){
    g.globalAlpha=0.6;
    g.strokeRect(wx,446,34,36);
    g.beginPath(); g.moveTo(wx+17,446); g.lineTo(wx+17,482);
    g.moveTo(wx,464); g.lineTo(wx+34,464); g.stroke();
  }

function collide(nx,ny){
  const R=10;
  for(const s of solids){
    if(s.t==='r'){
      const cx2=Math.max(s.x,Math.min(nx,s.x+s.w)), cy2=Math.max(s.y,Math.min(ny,s.y+s.h));
      const dx=nx-cx2, dy=ny-cy2, d=Math.hypot(dx,dy);
      if(d<R){ const k=(R-d)/(d||1); nx+=dx*k; ny+=dy*k; }
    }else{
      const dx=nx-s.x, dy=ny-s.y, d=Math.hypot(dx,dy), rr=s.r+R;
      if(d<rr){ const k=(rr-d)/(d||1); nx+=dx*k; ny+=dy*k; }
    }
  }
  nx=Math.max(16,Math.min(WORLD.w-16,nx));
  ny=Math.max(HOR+25,Math.min(WORLD.h-32,ny));
  return [nx,ny];
}

function updatePlayer(dt){
  let dx=0,dy=0;
  if(keys['w']||keys['ц']||keys['arrowup'])dy-=1;
  if(keys['s']||keys['ы']||keys['arrowdown'])dy+=1;
  if(keys['a']||keys['ф']||keys['arrowleft'])dx-=1;
  if(keys['d']||keys['в']||keys['arrowright'])dx+=1;
  if(!dx&&!dy&&touchTarget){
    const tx=touchTarget.x-player.x, ty=touchTarget.y-player.y, d=Math.hypot(tx,ty);
    if(d>8){dx=tx/d;dy=ty/d;} else if(!touchHeld) touchTarget=null;
  }
  const len=Math.hypot(dx,dy);
  player.moving=len>0.01;
  if(player.moving){
    dx/=len;dy/=len;
    const sp=2.7;
    const [nx,ny]=collide(player.x+dx*sp, player.y+dy*sp*0.86);
    player.x=nx;player.y=ny;
    player.fx=dx;player.fy=dy;player.step+=sp;
    if(Math.hypot(player.x-lastFoot.x,player.y-lastFoot.y)>17){
      footSide*=-1;
      footprints.push({x:player.x-player.fy*3.4*footSide, y:player.y+6+player.fx*2*footSide,
        a:Math.atan2(player.fy,player.fx), age:0});
      if(footprints.length>240)footprints.shift();
      lastFoot={x:player.x,y:player.y};
    }
    // подбор
    for(const pk of PICKUPS){
      if(pk.taken) continue;
      if(Math.hypot(player.x-pk.x,player.y-pk.y)<16){
        pk.taken=true; inv[pk.k]++;
        note(pk.x,pk.y-20,'+ '+NAMES[pk.k]); opis();
      }
    }
  }
}

function drawSky(ph,darkA,t,shx,shy){
  const hy=(HOR-cam.y-shy)*zoom;
  const k=Math.min(1,darkA/0.8);
  const sg=x.createLinearGradient(0,0,0,hy);
  sg.addColorStop(0, lerpCol('#17100C','#050404',k));
  sg.addColorStop(0.62, lerpCol('#2E1712','#0B0908',k));
  sg.addColorStop(1, lerpCol('#4A2013','#140C0A',k));
  x.fillStyle=sg; x.fillRect(0,0,CW,hy+2);
  const hg=x.createLinearGradient(0,hy-80,0,hy);
  hg.addColorStop(0,'rgba(194,59,43,0)');
  hg.addColorStop(1,`rgba(194,59,43,${0.32-0.24*k})`);
  x.fillStyle=hg; x.fillRect(0,hy-80,CW,80);
  x.fillStyle=`rgba(226,138,58,${0.09-0.07*k})`; x.fillRect(0,hy-14,CW,14);
  if(k>0.5){
    x.fillStyle=BONE;
    for(let i=0;i<40;i++){
      x.globalAlpha=(0.10+Math.abs(J(i*7))*0.15)*(k-0.5)*2;
      x.fillRect((J(i)*0.5+0.5)*CW, (J(i*3)*0.5+0.5)*hy*0.75, 1.4,1.4);
    }
    x.globalAlpha=1;
  }
  // диск: тусклое солнце днём / красная луна ночью
  if(k<0.55){
    const dp=Math.min(1,ph/0.42);
    const dX=CW*(0.22+0.5*dp)-cam.x*zoom*0.05;
    const dY=hy-(Math.sin(Math.PI*dp)*hy*0.6)-20;
    const dR=Math.min(CW,CH)*0.062;
    x.fillStyle=RED; x.globalAlpha=0.7*(1-k);
    x.beginPath(); x.arc(dX,dY,dR,0,7); x.fill();
    x.globalAlpha=0.22*(1-k); x.fillStyle=CANDLE;
    x.beginPath(); x.arc(dX,dY,dR*0.68,0,7); x.fill();
    x.globalAlpha=1;
  }else{
    const np=Math.max(0,Math.min(1,(ph-0.55)/0.37));
    const dX=CW*(0.68-0.3*np)-cam.x*zoom*0.04;
    const dY=hy*0.44-Math.sin(np*Math.PI)*hy*0.08;
    const dR=Math.min(CW,CH)*0.048;
    x.fillStyle=RED; x.globalAlpha=0.85;
    x.beginPath(); x.arc(dX,dY,dR,0,7); x.fill();
    x.strokeStyle='#7E241A'; x.lineWidth=2;
    for(let i=0;i<3;i++){
      x.globalAlpha=0.4-i*0.1;
      x.beginPath(); x.arc(dX+J(i)*4,dY+J(i*3)*3,dR*(0.5+i*0.22),J(i*7)*2,J(i*7)*2+4.6); x.stroke();
    }
    x.strokeStyle=RED;
    for(let i=0;i<3;i++){
      x.globalAlpha=0.3-i*0.07; x.lineWidth=2.2-i*0.5;
      const dxx=dX-dR*0.5+i*dR*0.5+J(i*9)*3;
      x.beginPath(); x.moveTo(dxx,dY+dR*0.85);
      x.lineTo(dxx+J(i)*2,dY+dR*(1.3+Math.abs(J(i*5))*0.7)); x.stroke();
    }
    x.globalAlpha=1;
  }
  // дальний план: холмы и ЗАМОК (0.15)
  const fw=3200*zoom*0.9, fh=300*zoom*0.9;
  x.globalAlpha=0.92;
  x.drawImage(castleC, -cam.x*0.15*zoom-160, hy-fh+3*zoom, fw, fh);
  x.globalAlpha=1;
  const hz=x.createLinearGradient(0,hy-34,0,hy+5);
  hz.addColorStop(0,'rgba(217,207,184,0)');
  hz.addColorStop(1,`rgba(217,207,184,${0.055-0.04*k})`);
  x.fillStyle=hz; x.fillRect(0,hy-34,CW,40);
  // средний план: поля, стога, изба (0.5)
  const mw=2900*zoom*0.85, mh=150*zoom*0.85;
  x.drawImage(midC, -cam.x*0.5*zoom, hy-mh+5*zoom, mw, mh);
  // птицы у диска — днём, разрозненные
  if(k<0.35){
    x.strokeStyle='#0A0807'; x.lineWidth=1.5;
    for(let i=0;i<3;i++){
      const a=t*0.1+i*2.5;
      const bx2=CW*0.4+Math.cos(a)*(90+i*60);
      const by2=hy*0.4+Math.sin(a*0.8)*40;
      if(by2>hy-14) continue;
      const fl=Math.sin(t*5+i*2)*3;
      x.globalAlpha=0.55;
      x.beginPath();
      x.moveTo(bx2-5,by2+fl*0.4); x.quadraticCurveTo(bx2,by2-2-fl,bx2,by2);
      x.quadraticCurveTo(bx2,by2-2-fl,bx2+5,by2+fl*0.4); x.stroke();
    }
    x.globalAlpha=1;
  }
}
function drawForeground(shx){
  const k=1.28, step=24;
  x.fillStyle='#040303'; x.strokeStyle='#040303';
  const w0=(cam.x+shx)*k, w1=w0+CW/zoom+60;
  for(let wx=Math.floor(w0/step)*step; wx<w1; wx+=step){
    const seed=wx/step, sx=(wx-w0)*zoom;
    const h=(9+Math.abs(J(seed))*26)*zoom;
    if(J(seed*3)>0.6){
      x.globalAlpha=0.9;
      x.beginPath(); x.ellipse(sx,CH+3,step*0.5*zoom,h*0.35,0,Math.PI,0); x.fill();
      continue;
    }
    x.globalAlpha=0.85; x.lineWidth=2*zoom; x.lineCap='round';
    for(let b=0;b<3;b++){
      const bx2=sx+(b-1)*5*zoom;
      x.beginPath(); x.moveTo(bx2,CH+4);
      x.quadraticCurveTo(bx2+J(seed+b)*5*zoom, CH-h*0.6, bx2+J(seed*7+b)*9*zoom, CH-h-b*3*zoom);
      x.stroke();
    }
    x.lineCap='butt';
  }
  x.globalAlpha=1;
}
const lerp=(a,b,k)=>a+(b-a)*k;
function lerpCol(c1,c2,k){
  const q=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=q(c1),b=q(c2);
  return `rgb(${Math.round(lerp(a[0],b[0],k))},${Math.round(lerp(a[1],b[1],k))},${Math.round(lerp(a[2],b[2],k))}`+')';
}

// ═══════════════ КАДР ═══════════════
let t0=performance.now(), tPrev=t0, frameN=0;
let sitPhase=0; // 0 — нет; >0 идёт «пересиживание ночи»
const locEl=document.getElementById('loc');
function frame(now){
  const t=(now-t0)/1000, dt=Math.min(0.05,(now-tPrev)/1000); tPrev=now; frameN++;
  const breath=(0.75+0.25*Math.sin(t*(Math.PI*2/6)))*(0.55+fire.fuel*0.45);
  tCycle+=dt;
  const ph=(tCycle%CYCLE)/CYCLE;
  if(ph<lastPhase){ // новое утро — подбираемое возвращается
    PICKUPS.forEach(p=>{if(Math.abs(J(p.x+frameN))>0.35)p.taken=false;});
  }
  lastPhase=ph;
  const darkA=ambientDark(ph);

  // костёр горит и прогорает
  fire.fuel=Math.max(0.08,fire.fuel-dt/340);
  const fireR=(110+fire.fuel*170)*(0.94+0.06*Math.sin(t*8.7));

  // источники света
  const lights=[
    {x:FIRE.x,y:FIRE.y-10,r:fireR},
    {x:471,y:508,r:120*(0.9+0.1*Math.sin(t*7.1))}, // окно №3
  ];
  if(lanternLit) lights.push({x:LANTERN.x+17,y:LANTERN.y-112,r:120*(0.95+0.05*Math.sin(t*6.3))});
  lights.push({x:player.x,y:player.y-14,r:30+ember.v*70});

  // освещён ли странник
  let litHere=darkA<0.4;
  let nearLight=false;
  for(const L of lights.slice(0,-1)){
    const d=Math.hypot(player.x-L.x,player.y-L.y);
    if(d<L.r){litHere=true;}
    if(d<L.r*0.85){nearLight=true;}
  }
  // уголёк: греется у огня, тускнеет в пути (ночью быстрее)
  if(nearLight) ember.v=Math.min(1,ember.v+dt/3);
  else ember.v=Math.max(0,ember.v-dt/(darkA>0.4?220:420));
  if(ember.v>0.05) litHere=litHere||darkA<0.4;

  // ночь взяла своё: уголёк погас, света нет — странник садится до утра
  if(darkA>0.7 && !nearLight && ember.v<=0.05 && sitPhase===0) sitPhase=0.0001;
  if(sitPhase>0){
    sitPhase+=dt/2.4;
    if(sitPhase>=1){
      tCycle=Math.ceil(tCycle/CYCLE)*CYCLE+CYCLE*0.935; // к рассвету
      player.x=FIRE.x+52; player.y=FIRE.y+38;
      ember.v=0.55; sitPhase=-1; // -1 = проявление
      note(player.x,player.y-60,'вечер пережит');
    }
  }
  if(sitPhase<0){ sitPhase+=dt/1.6; if(sitPhase>=0)sitPhase=0; }

  updatePlayer(dt); updateWhispers(litHere);
  if(paperTimer>0){ paperTimer--; if(paperTimer<=0) paperEl.style.display='none'; }
  stillT = player.moving ? 0 : stillT+dt;
  const dayN=Math.floor(tCycle/CYCLE);

  // ── ЧАЙ ТРЕТЬЕГО ОКНА: дым 3 минуты в один и тот же час ──
  const teaOn = ph>0.455 && ph<0.48;
  if(teaOn && dayN!==lastTeaDay && Math.hypot(player.x-471,player.y-520)<170){
    lastTeaDay=dayN; teaDays++; teaSeenToday=true;
    try{localStorage.setItem('ardet_tea_days',''+teaDays);}catch(e){}
    if(teaDays>=3 && !teaCup){
      teaCup=1; try{localStorage.setItem('ardet_tea_cup','1');}catch(e){}
      note(488,470,'на подоконнике — второй стакан');
    } else note(471,476,'ложечка о стакан, единожды');
  }

  // ── ПИШУЩИЙ СИЛУЭТ: «Не отвлекаю?» — раз за игру, в полночь, неподвижному ──
  if(!silDone && ph>0.715 && ph<0.75 && stillT>3 &&
     Math.hypot(player.x-471,player.y-520)<90){
    silDone=true; try{localStorage.setItem('ardet_sil','1');}catch(e){}
    note(471,426,'— Не отвлекаю?');
  }

  // ── КОТ — ОТВЕТ ПО ФОРМЕ: неподвижному, раз в сутки ──
  if(catBlink>0) catBlink-=dt;
  if(catTalkDay!==dayN && stillT>7 &&
     Math.hypot(player.x-CATHOME.x,player.y-CATHOME.y)<150){
    catTalkDay=dayN; catBlink=3.2;
    setTimeout(()=>note(1065,366,'в журнале наблюдений: «беседа состоялась»'),3400);
  }

  // ── ЛУЧ МАЯЧНИКА: раз в ночь, полный оборот, артерии проступают ──
  const beamOn = ph>0.60 && ph<0.66;
  const beamA = beamOn ? ((ph-0.60)/0.06)*Math.PI*2 - Math.PI/2 : 0;

  const viewW=CW/zoom, viewH=CH/zoom;
  let tx=player.x-viewW/2, ty=player.y-viewH/2;
  cam.x+=(tx-cam.x)*0.08; cam.y+=(ty-cam.y)*0.08;
  cam.x=Math.max(0,Math.min(WORLD.w-viewW,cam.x));
  cam.y=Math.max(0,Math.min(WORLD.h-viewH,cam.y));
  let shx=0,shy=0;
  if(player.x>2400){
    const amp=(player.x-2400)/160*5;
    shx=J(frameN*3)*amp; shy=J(frameN*7)*amp;
  }
  locEl.textContent=(player.x<1520?'городок':(player.x<2360?'за мостом':'край'))+' · '+phaseWord(ph);

  // статичный слой
  x.setTransform(DPR,0,0,DPR,0,0);
  x.fillStyle=NIGHT; x.fillRect(0,0,CW,CH);
  x.imageSmoothingEnabled=true;
  drawSky(ph,darkA,t,shx,shy);
  x.drawImage(staticC,(cam.x+shx)*Q,(cam.y+shy)*Q,viewW*Q,viewH*Q, 0,0,CW,CH);

  x.setTransform(DPR*zoom,0,0,DPR*zoom,-(cam.x+shx)*DPR*zoom,-(cam.y+shy)*DPR*zoom);

  // следы
  for(const f of footprints){
    f.age++;
    const a=Math.max(0,1-f.age/800)*0.2;
    if(a<=0)continue;
    x.strokeStyle=BONE; x.globalAlpha=a; x.lineWidth=0.8;
    x.beginPath(); x.ellipse(f.x,f.y,3.4,1.6,f.a,0,7); x.stroke();
  }
  x.globalAlpha=1;

  // свет костра по земле
  x.save(); x.translate(FIRE.x,FIRE.y+4); x.scale(1,0.5);
  const bg2=x.createRadialGradient(0,0,10,0,0,200*breath);
  bg2.addColorStop(0,`rgba(226,138,58,${0.26*breath})`);
  bg2.addColorStop(0.5,`rgba(194,59,43,${0.09*breath})`);
  bg2.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=bg2; x.fillRect(-210,-210,420,420);
  rays(x,0,0,44,150*breath,64,CANDLE,0.13*breath);
  rays(x,0,0,34,90*breath,32,'#F2C079',0.16*breath);
  x.restore();

  // окно №3 (фасад): тёплое стекло + свет на брусчатку
  const flick=0.8+0.2*(Math.sin(t*7.1)*0.3+Math.sin(t*12.7)*0.2+Math.sin(t*2.3)*0.5);
  const w3x=454, w3y=446;
  const spill=p=>{p.moveTo(w3x-2,560);p.lineTo(w3x+36,560);p.lineTo(w3x+58,656);p.lineTo(w3x-26,656);p.closePath();};
  const sg=x.createLinearGradient(0,560,0,656);
  sg.addColorStop(0,`rgba(226,138,58,${0.2*flick})`); sg.addColorStop(1,'rgba(226,138,58,0)');
  x.fillStyle=sg; x.beginPath(); spill(x); x.fill();
  rays(x,w3x+17,560,12,64,18,CANDLE,0.11*flick,0.5,Math.PI-0.5);
  x.fillStyle=`rgba(236,190,120,${0.85*flick})`; x.fillRect(w3x,w3y,34,36);
  x.strokeStyle=NIGHT; x.lineWidth=1.3;
  x.beginPath(); x.moveTo(w3x+17,w3y); x.lineTo(w3x+17,w3y+36);
  x.moveTo(w3x,w3y+18); x.lineTo(w3x+34,w3y+18); x.stroke();
  x.fillStyle='rgba(13,11,10,0.75)';
  x.beginPath(); x.arc(w3x+11,w3y+26,6,Math.PI,0); x.fill();
  const wg=x.createRadialGradient(w3x+17,w3y+18,4,w3x+17,w3y+18,70);
  wg.addColorStop(0,`rgba(226,138,58,${0.25*flick})`); wg.addColorStop(1,'rgba(226,138,58,0)');
  x.fillStyle=wg; x.fillRect(w3x-56,w3y-56,146,146);

  // фонарь затеплен?
  if(lanternLit){
    const lgl=x.createRadialGradient(LANTERN.x+17,LANTERN.y-112,2,LANTERN.x+17,LANTERN.y-112,70);
    lgl.addColorStop(0,'rgba(226,138,58,0.5)'); lgl.addColorStop(1,'rgba(226,138,58,0)');
    x.fillStyle=lgl; x.fillRect(LANTERN.x-60,LANTERN.y-190,160,160);
    x.fillStyle=`rgba(242,192,121,${0.8+0.2*Math.sin(t*6.3)})`;
    x.fillRect(LANTERN.x+12,LANTERN.y-120,10,13);
    rays(x,LANTERN.x+17,LANTERN.y-112,16,52,20,CANDLE,0.12);
  }

  // лужа
  x.save(); x.beginPath();
  for(let i=0;i<=10;i++){
    const a=i/10*Math.PI*2, rr=64*(0.8+Math.abs(J(i*5))*0.3);
    const px=1120+Math.cos(a)*rr, py=700+Math.sin(a)*rr*0.36;
    i?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.closePath(); x.clip();
  x.fillStyle='#DDC08A'; x.globalAlpha=0.5*(darkA>0.3?1:0.4);
  x.beginPath(); x.ellipse(1108,696,15,9,0,0,7); x.fill();
  x.strokeStyle='#0E0D0B'; x.globalAlpha=0.8; x.lineWidth=1.1;
  for(let i=0;i<2;i++){
    const ry2=693+i*6+Math.sin(t*0.8+i*2)*1.4;
    x.beginPath(); x.moveTo(1090,ry2); x.lineTo(1128,ry2); x.stroke();
  }
  x.restore(); x.globalAlpha=1;

  // дым
  x.strokeStyle=ASH; x.lineWidth=1.2;
  for(let i=0;i<3;i++){
    x.globalAlpha=0.26-i*0.06;
    const phm=t*0.3+i*2.1;
    x.beginPath();
    x.moveTo(1118,414-i*18);
    x.bezierCurveTo(1132+Math.sin(phm)*9,398-i*18, 1112+Math.cos(phm*0.8)*10,384-i*18, 1128+Math.sin(phm*0.6)*12,368-i*18);
    x.stroke();
  }
  x.globalAlpha=1;

  // кот на коньке дома
  const catx=1065, caty=396, tw=Math.sin(t*1.1);
  x.fillStyle='#080706';
  x.beginPath(); x.ellipse(catx,caty,8,5,0,0,7); x.fill();
  x.beginPath(); x.arc(catx+7,caty-3.4,3.6,0,7); x.fill();
  x.beginPath(); x.moveTo(catx+5,caty-6); x.lineTo(catx+6.2,caty-9.4); x.lineTo(catx+7.6,caty-6.2); x.closePath(); x.fill();
  x.beginPath(); x.moveTo(catx+7.4,caty-6.2); x.lineTo(catx+8.8,caty-9.2); x.lineTo(catx+9.8,caty-5.8); x.closePath(); x.fill();
  x.strokeStyle='#080706'; x.lineWidth=1.8;
  x.beginPath(); x.moveTo(catx-7.4,caty);
  x.bezierCurveTo(catx-13,caty-2+tw, catx-13,caty-11+tw*2, catx-9,caty-12+tw*2);
  x.stroke();
  x.strokeStyle=BONE; x.globalAlpha=0.55; x.lineWidth=0.6;
  x.beginPath(); x.ellipse(catx,caty,8,5,0,-2.4,-0.6); x.stroke();
  x.globalAlpha=1;

  // подбираемое — мерцает, зовёт
  for(const pk of PICKUPS){
    if(pk.taken) continue;
    const gl=0.5+0.35*Math.sin(t*2.2+pk.x);
    if(pk.k==='wood'){
      x.strokeStyle=BONE; x.globalAlpha=0.65*gl+0.2; x.lineWidth=1.6;
      x.beginPath(); x.moveTo(pk.x-7,pk.y+3); x.lineTo(pk.x+7,pk.y-4);
      x.moveTo(pk.x-5,pk.y-4); x.lineTo(pk.x+6,pk.y+4); x.stroke();
    }else if(pk.k==='moss'){
      x.strokeStyle=MIST; x.globalAlpha=0.8*gl+0.2; x.lineWidth=1.4;
      for(let i=0;i<3;i++){
        x.beginPath(); x.moveTo(pk.x-4+i*4,pk.y+3);
        x.quadraticCurveTo(pk.x-5+i*4,pk.y-4, pk.x-2+i*4,pk.y-7); x.stroke();
      }
    }else{
      x.fillStyle='#E8DCC3'; x.globalAlpha=0.6*gl+0.25;
      x.beginPath(); x.ellipse(pk.x,pk.y,4,5.4,0,0,7); x.fill();
      x.strokeStyle=BONE; x.globalAlpha=0.5;
      x.beginPath(); x.ellipse(pk.x,pk.y,4,5.4,0,0,7); x.stroke();
    }
  }
  x.globalAlpha=1;

  // спрайты по глубине
  const sprites=[
    {y:FIRE.y, draw:()=>drawFire(t,breath)},
    {y:862, draw:()=>drawJester(t,breath)},
    {y:player.y, draw:()=>drawWanderer(t)},
  ].sort((a,b)=>a.y-b.y);
  for(const s of sprites) s.draw();

  // ── дым чая над канцелярией ──
  if(teaOn){
    x.strokeStyle=ASH; x.lineWidth=1.1;
    for(let i=0;i<3;i++){
      x.globalAlpha=0.3-i*0.08;
      x.beginPath(); x.moveTo(430,344-i*20);
      x.bezierCurveTo(431,328-i*20, 429,312-i*20, 430.5,296-i*20); x.stroke();
    }
    x.globalAlpha=1;
  }
  // ── второй стакан на подоконнике (навсегда) ──
  if(teaCup){
    x.strokeStyle=BONE; x.globalAlpha=0.8; x.lineWidth=0.9;
    x.strokeRect(490,473,5,8);
    x.beginPath(); x.moveTo(495,475); x.arc(496.5,477,1.6,-1.2,1.2); x.stroke();
    x.globalAlpha=1;
  }
  // ── глаза кота при беседе: медленно закрывает, открывает ──
  if(catBlink>0){
    const bph=3.2-catBlink;
    const open=bph<1?1-bph:(bph<2?0:(bph-2));
    x.fillStyle='#DDC08A'; x.globalAlpha=0.85;
    x.beginPath(); x.ellipse(1062,394,1.5,1.5*Math.max(0.06,open),0,0,7); x.fill();
    x.beginPath(); x.ellipse(1068,394,1.5,1.5*Math.max(0.06,open),0,0,7); x.fill();
    x.globalAlpha=1;
  }
  // ── луч маячника: полоса света идёт по кольцам ──
  if(beamOn){
    const bx=TOWER.x, by=TOWER.y-176;
    x.save();
    const grd=x.createLinearGradient(bx,by,bx+Math.cos(beamA)*700,by+Math.sin(beamA)*700*0.5);
    grd.addColorStop(0,'rgba(217,207,184,0.20)');
    grd.addColorStop(1,'rgba(217,207,184,0)');
    x.fillStyle=grd;
    x.beginPath(); x.moveTo(bx,by);
    x.lineTo(bx+Math.cos(beamA-0.09)*760, by+Math.sin(beamA-0.09)*760*0.55);
    x.lineTo(bx+Math.cos(beamA+0.09)*760, by+Math.sin(beamA+0.09)*760*0.55);
    x.closePath(); x.fill();
    x.restore();
    // артерии проступают в луче: колеи дороги пунктиром кости
    x.strokeStyle=BONE; x.lineWidth=1.6;
    for(let tt=0;tt<=1;tt+=0.02){
      const px=185+tt*2375;
      const py=740+52*Math.sin(tt*Math.PI*0.9)+12*tt;
      const ang=Math.atan2((py-TOWER.y)*1.8,px-TOWER.x);
      let d=Math.abs(((ang-beamA+Math.PI*3)%(Math.PI*2))-Math.PI);
      if(d<0.22){
        x.globalAlpha=0.55*(1-d/0.22);
        x.beginPath(); x.moveTo(px-8,py); x.lineTo(px+8,py); x.stroke();
      }
    }
    x.globalAlpha=1;
    // мох в луче серебрится
    x.fillStyle=BONE;
    for(const [mx,my] of [[240,470],[660,930],[1240,560],[1560,690],[1900,920],[2260,740]]){
      const ang=Math.atan2((my-TOWER.y)*1.8,mx-TOWER.x);
      let d=Math.abs(((ang-beamA+Math.PI*3)%(Math.PI*2))-Math.PI);
      if(d<0.18){ x.globalAlpha=0.35; x.beginPath(); x.ellipse(mx,my,10,4,0,0,7); x.fill(); }
    }
    x.globalAlpha=1;
  }

  // окклюдеры
  for(const o of occluders){
    if(player.y<o.base &&
       player.x+14>o.x && player.x-14<o.x+o.w &&
       player.y+10>o.y && player.y-24<o.y+o.h){
      x.drawImage(staticC,o.x*Q,o.y*Q,o.w*Q,o.h*Q,o.x,o.y,o.w,o.h);
    }
  }
  // передний силуэтный план
  x.setTransform(DPR,0,0,DPR,0,0);
  drawForeground(shx);
  x.setTransform(DPR*zoom,0,0,DPR*zoom,-(cam.x+shx)*DPR*zoom,-(cam.y+shy)*DPR*zoom);

  // глазницы черепа
  x.strokeStyle=CANDLE; x.globalAlpha=0.7*breath; x.lineWidth=0.8;
  x.beginPath(); x.arc(884-5.3,640+1,2,0.6,2.5); x.stroke();
  x.beginPath(); x.arc(884+5.3,640+1,2,0.6,2.5); x.stroke();
  x.globalAlpha=1;

  // ═══ ТЬМА: ночь съедает мир до кругов света ═══
  if(darkA>0.01){
    dk.setTransform(DPR,0,0,DPR,0,0);
    dk.clearRect(0,0,CW,CH);
    dk.fillStyle=`rgba(3,2,2,${darkA})`;
    dk.fillRect(0,0,CW,CH);
    dk.globalCompositeOperation='destination-out';
    for(const L of lights){
      const sx2=(L.x-cam.x-shx)*zoom, sy2=(L.y-cam.y-shy)*zoom, sr=L.r*zoom;
      const gg=dk.createRadialGradient(sx2,sy2,sr*0.12,sx2,sy2,sr);
      gg.addColorStop(0,'rgba(0,0,0,1)');
      gg.addColorStop(0.6,'rgba(0,0,0,0.85)');
      gg.addColorStop(1,'rgba(0,0,0,0)');
      dk.fillStyle=gg;
      dk.beginPath(); dk.arc(sx2,sy2,sr,0,7); dk.fill();
    }
    // небо и луна не гаснут полностью
    const hy2=(HOR-cam.y-shy)*zoom;
    const skyHole=dk.createLinearGradient(0,0,0,Math.max(1,hy2));
    skyHole.addColorStop(0,'rgba(0,0,0,0.55)');
    skyHole.addColorStop(1,'rgba(0,0,0,0.15)');
    dk.fillStyle=skyHole; dk.fillRect(0,0,CW,Math.max(0,hy2));
    dk.globalCompositeOperation='source-over';
    x.setTransform(DPR,0,0,DPR,0,0);
    x.drawImage(darkC,0,0,CW,CH);
    x.setTransform(DPR*zoom,0,0,DPR*zoom,-(cam.x+shx)*DPR*zoom,-(cam.y+shy)*DPR*zoom);
  }

  // всплывающие пометки
  for(let i=notes.length-1;i>=0;i--){
    const n=notes[i]; n.life--; n.y-=0.14;
    if(n.life<=0){notes.splice(i,1);continue;}
    const a=Math.min(1,n.life/40)*Math.min(1,(150-n.life)/20);
    x.font='italic 15px "Cormorant Garamond"'; x.textAlign='center';
    x.fillStyle=`rgba(217,207,184,${a*0.85})`;
    x.fillText(n.t,n.x,n.y);
    x.textAlign='left';
  }

  // подсказки действий
  const dF=Math.hypot(player.x-FIRE.x,player.y-FIRE.y);
  const dL=Math.hypot(player.x-LANTERN.x,player.y-LANTERN.y);
  x.font='italic 14px "Cormorant Garamond"'; x.textAlign='center';
  x.fillStyle='rgba(217,207,184,0.6)';
  if(dF<90&&inv.wood>0) x.fillText(IS_TOUCH?'коснись огня — подложить щепу':'e — подложить щепу',FIRE.x,FIRE.y-92);
  else if(dF<90&&inv.moss>0&&ember.v<0.9) x.fillText(IS_TOUCH?'коснись огня — покормить уголёк':'e — покормить уголёк мхом',FIRE.x,FIRE.y-92);
  if(dL<80&&!lanternLit&&ember.v>0.35) x.fillText(IS_TOUCH?'коснись фонаря — затеплить':'e — затеплить фонарь',LANTERN.x,LANTERN.y-146);
  if(paperTimer<=0){
    if(Math.hypot(player.x-760,player.y-318)<80)
      x.fillText('e — покрутить ворот',760,214);
    else for(const ins of INSPECT){
      if(Math.hypot(player.x-ins.x,player.y-ins.y)<ins.r+34){
        x.fillText('e — рассмотреть',ins.x,ins.y-56); break;
      }
    }
  }
  x.textAlign='left';

  // шёпот
  if(whisper.life>0){
    const a=whisper.life>240?(300-whisper.life)/60:Math.min(1,whisper.life/120);
    const sx2=(whisper.x-cam.x-shx)*zoom, sy2=(whisper.y-cam.y-shy)*zoom-(300-whisper.life)*0.06;
    x.setTransform(DPR,0,0,DPR,0,0);
    x.font='italic 17px "Cormorant Garamond"'; x.textAlign='center';
    x.fillStyle='rgba(217,207,184,'+(a*0.7)+')';
    x.fillText(whisper.t, Math.max(120,Math.min(CW-120,sx2)), Math.max(40,Math.min(CH-60,sy2)));
    x.textAlign='left';
  }

  // экранный слой
  x.setTransform(DPR,0,0,DPR,0,0);
  const gseed=Math.floor(t*7);
  x.globalAlpha=0.05;
  for(let i=0;i<170;i++){
    x.fillStyle=(i%3)?BONE:ASH;
    x.fillRect((J(i+gseed)*0.5+0.5)*CW,(J(i*7+gseed)*0.5+0.5)*CH,1,1);
  }
  x.globalAlpha=1;
  const vig=x.createRadialGradient(CW/2,CH/2,Math.min(CW,CH)*0.44,CW/2,CH/2,Math.max(CW,CH)*0.72);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,`rgba(5,4,3,${0.4+darkA*0.2})`);
  x.fillStyle=vig; x.fillRect(0,0,CW,CH);
  // пересиживание ночи — мягкое затемнение и возврат
  if(sitPhase!==0){
    const a=sitPhase>0?Math.min(1,sitPhase):1-Math.min(1,-sitPhase*(-1));
    const aa=sitPhase>0?Math.min(1,sitPhase):Math.min(1,1+sitPhase);
    x.fillStyle=`rgba(3,2,2,${sitPhase>0?Math.min(1,sitPhase):1-Math.min(1,sitPhase+1)})`;
    x.fillRect(0,0,CW,CH);
  }
  x.strokeStyle=BONE; x.globalAlpha=0.5; x.lineWidth=1;
  x.strokeRect(10,10,CW-20,CH-20);
  x.globalAlpha=0.18; x.strokeRect(14,14,CW-28,CH-28);
  x.globalAlpha=1;

  requestAnimationFrame(frame);
}

// ── костёр ──
function drawFire(t,breath){
  const bx=FIRE.x, by=FIRE.y, fs=0.55+fire.fuel*0.6;
  const flame=(ph,s,col,al)=>{
    x.fillStyle=col; x.globalAlpha=al;
    const fh=(52+Math.sin(t*3.1+ph)*11)*s*fs, fw=(17+Math.sin(t*4.7+ph)*4.6)*s*fs;
    x.beginPath();
    x.moveTo(bx-fw,by);
    x.bezierCurveTo(bx-fw*1.3,by-fh*0.45, bx+Math.sin(t*5+ph)*7,by-fh*0.8, bx+Math.sin(t*2.4+ph)*5.4,by-fh);
    x.bezierCurveTo(bx+fw*1.25,by-fh*0.5, bx+fw,by-fh*0.15, bx+fw,by);
    x.closePath(); x.fill(); x.globalAlpha=1;
  };
  flame(0,1.12,RED,0.5); flame(2.2,0.88,CANDLE,0.72); flame(4.1,0.5,'#F2C079',0.9);
  x.strokeStyle='#F2C079'; x.lineWidth=0.7;
  for(let i=0;i<7;i++){
    x.globalAlpha=0.4*fs;
    const ph=t*2.2+i*1.7, hgt=(27+Math.sin(ph)*8)*fs;
    x.beginPath();
    x.moveTo(bx-11+i*3.7,by-3);
    x.quadraticCurveTo(bx-9+i*3.7+Math.sin(ph)*4,by-hgt*0.6, bx-7+i*3.7+Math.sin(ph*1.3)*4.6,by-hgt);
    x.stroke();
  }
  x.globalAlpha=1;
  x.fillStyle=CANDLE;
  for(let i=0;i<9;i++){
    const sp=(t*0.24+i*0.11)%1;
    if(sp<0.9){
      x.globalAlpha=(1-sp)*0.85*fs;
      x.beginPath();
      x.arc(bx+Math.sin(t*1.4+i*2.2)*18*sp, by-16-sp*130*fs, 1.2,0,7);
      x.fill();
    }
  }
  x.globalAlpha=1;
}

// ── Шут ──
function drawJester(t,breath){
  const jx=940, jy=800, sw=Math.sin(t*0.8)*2;
  x.fillStyle='rgba(4,3,3,0.5)';
  x.beginPath(); x.ellipse(jx+22,jy+4,26,6,0.1,0,7); x.fill();
  x.fillStyle='#0A0908';
  x.beginPath();
  x.moveTo(jx-13,jy);
  x.bezierCurveTo(jx-15,jy-30, jx-8,jy-46, jx-3+sw,jy-52);
  x.lineTo(jx-10+sw,jy-66); x.lineTo(jx-4+sw,jy-58);
  x.lineTo(jx+sw,jy-72); x.lineTo(jx+4+sw,jy-58);
  x.lineTo(jx+10+sw,jy-64); x.lineTo(jx+5+sw,jy-52);
  x.bezierCurveTo(jx+10,jy-41, jx+12,jy-22, jx+10,jy);
  x.closePath(); x.fill();
  x.fillStyle=CANDLE; x.globalAlpha=0.85*breath;
  x.beginPath(); x.arc(jx-10+sw,jy-66,1.6,0,7); x.fill();
  x.beginPath(); x.arc(jx+sw,jy-72,1.6,0,7); x.fill();
  x.beginPath(); x.arc(jx+10+sw,jy-64,1.6,0,7); x.fill();
  x.globalAlpha=1;
  x.strokeStyle='#E8C89A'; x.globalAlpha=0.7*breath; x.lineWidth=1.1;
  x.beginPath();
  x.moveTo(jx-13,jy);
  x.bezierCurveTo(jx-15,jy-30, jx-8,jy-46, jx-3+sw,jy-52);
  x.stroke(); x.globalAlpha=1;
  x.strokeStyle='#B99B6E'; x.globalAlpha=0.4*breath; x.lineWidth=0.5;
  for(let i=0;i<3;i++){
    x.beginPath();
    x.moveTo(jx-7+i*6,jy-7); x.lineTo(jx-4.6+i*6,jy-12);
    x.lineTo(jx-2.2+i*6,jy-7); x.lineTo(jx-4.6+i*6,jy-2);
    x.closePath(); x.stroke();
  }
  x.globalAlpha=1;
}

// ── Странник — «картонка» как в Don't Starve: большая голова, качание ──
function drawWanderer(t){
  const p=player;
  const per=0.8+(p.y/WORLD.h)*0.45;           // лёгкая перспектива: ниже — крупнее
  const mov=p.moving?1:0;
  const bob=Math.abs(Math.sin(p.step*0.28))*2.6*mov;
  const sway=Math.sin(p.step*0.14)*0.055*mov + Math.sin(t*0.9)*0.012;
  // тень (не качается)
  x.fillStyle='rgba(4,3,3,0.48)';
  x.beginPath(); x.ellipse(p.x+3,p.y+3,13*per,4.4*per,0,0,7); x.fill();
  x.save(); x.translate(p.x,p.y); x.rotate(sway); x.scale(per,per); x.translate(0,-bob);
  // ноги — шаг
  const lp=Math.sin(p.step*0.28);
  x.strokeStyle='#0A0908'; x.lineWidth=3; x.lineCap='round';
  x.beginPath();
  x.moveTo(-3.4,-7); x.lineTo(-3.4+lp*4.6*mov,0.6);
  x.moveTo(3.4,-7); x.lineTo(3.4-lp*4.6*mov,0.6);
  x.stroke(); x.lineCap='butt';
  // плащ-лохмотья: узкие плечи, рваный подол
  x.fillStyle='#0B0A08';
  x.beginPath();
  x.moveTo(-7,-30);
  x.bezierCurveTo(-10,-22,-12,-13,-13,-4);
  for(let i=0;i<=6;i++){
    const sx=-13+(26)*(i/6);
    x.lineTo(sx-1.6,-4-(i%2?4.6:0)-Math.abs(J(i*3))*2.4);
    x.lineTo(sx,-4);
  }
  x.bezierCurveTo(12,-13,10,-22,7,-30);
  x.closePath(); x.fill();
  // штрих по ткани
  x.strokeStyle=BONE; x.globalAlpha=0.12; x.lineWidth=0.5;
  for(let i=0;i<3;i++){
    x.beginPath(); x.moveTo(-10+i*2,-26+i*7); x.lineTo(9-i*2,-23+i*7); x.stroke();
  }
  x.globalAlpha=1;
  // голова — крупный капюшон (пропорция DS)
  x.fillStyle='#060505';
  x.beginPath(); x.ellipse(p.fx*1.6,-37,8.6,8,0,0,7); x.fill();
  x.beginPath(); x.moveTo(-6,-33); x.quadraticCurveTo(0,-27,6,-33); x.lineTo(4,-29.4); x.lineTo(-4,-29.4); x.closePath(); x.fill();
  // тьма лица
  x.fillStyle='#020202';
  x.beginPath(); x.ellipse(p.fx*4,-36.4,4.6,4,0,0,7); x.fill();
  // лунная кромка
  x.strokeStyle=BONE; x.globalAlpha=0.3; x.lineWidth=0.8;
  x.beginPath(); x.ellipse(p.fx*1.6,-37,8.9,8.3,0,Math.PI*1.05,Math.PI*1.75); x.stroke();
  x.beginPath(); x.moveTo(-7.4,-29); x.bezierCurveTo(-10.4,-21,-12.4,-12,-13.2,-4); x.stroke();
  x.globalAlpha=1;
  // кромка от костра
  const df=Math.hypot(p.x-FIRE.x,p.y-FIRE.y);
  if(df<380){
    const la=Math.atan2(FIRE.y-p.y,FIRE.x-p.x);
    x.strokeStyle='#E8C89A'; x.globalAlpha=0.5-df/380*0.35; x.lineWidth=1;
    x.beginPath(); x.ellipse(p.fx*1.6,-37,8.9,8.3,0,la-0.8,la+0.8); x.stroke();
    x.globalAlpha=1;
  }
  // уголёк у сердца — единственный «индикатор»
  const hb=0.5+0.5*Math.sin(t*2.6);
  x.fillStyle='#F2C079'; x.globalAlpha=(0.25+ember.v*0.75)*(0.6+hb*0.4);
  x.beginPath(); x.arc(p.fx*2.4,-22,1.5+ember.v*1.3,0,7); x.fill();
  x.globalAlpha=1;
  // дорожный посох
  x.strokeStyle='#241E18'; x.lineWidth=2;
  x.beginPath(); x.moveTo(9,-26); x.lineTo(12.6,1); x.stroke();
  x.strokeStyle=BONE; x.globalAlpha=0.35; x.lineWidth=0.6;
  x.beginPath(); x.moveTo(9.8,-26); x.lineTo(13.4,1); x.stroke();
  x.globalAlpha=1;
  x.restore();
}

window.__game={player,cam:()=>cam,tp:(px,py)=>{player.x=px;player.y=py;},
  inv,fire,ember,setPhase:f=>{tCycle=Math.floor(tCycle/CYCLE)*CYCLE+CYCLE*f;},
  act:tryAction};
opis();
requestAnimationFrame(frame);
</script>
