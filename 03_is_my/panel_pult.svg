<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="138mm" viewBox="0 0 200 138"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="ps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221d18"/><stop offset="1" stop-color="#100d0b"/>
    </linearGradient>
    <radialGradient id="kg" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#3a342e"/><stop offset="1" stop-color="#171411"/></radialGradient>
    <radialGradient id="stick" cx="0.35" cy="0.3" r="0.85"><stop offset="0" stop-color="#4a443d"/><stop offset="1" stop-color="#15120f"/></radialGradient>
    <radialGradient id="lA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd27a"/><stop offset="0.5" stop-color="#e0a23a"/><stop offset="1" stop-color="#7a5410"/></radialGradient>
    <radialGradient id="lG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#b6f5c4"/><stop offset="0.5" stop-color="#4fbf6a"/><stop offset="1" stop-color="#16602c"/></radialGradient>
    <g id="knob"><circle r="7.5" fill="#0c0a09"/><circle r="6.6" fill="url(#kg)" stroke="#4a433d" stroke-width="0.3"/>
      <line x1="0" y1="0" x2="-3.3" y2="-5" stroke="#d9d4cc" stroke-width="1" stroke-linecap="round"/><circle r="0.8" fill="#0c0a09"/></g>
    <g id="tog"><rect x="-2.3" y="-4.4" width="4.6" height="8.8" rx="2" fill="#0c0a09" stroke="#4a433d" stroke-width="0.35"/>
      <circle cx="0" cy="-2.2" r="1.9" fill="#b9b2a6" stroke="#5c574f" stroke-width="0.25"/></g>
    <g id="jk"><circle r="4.4" fill="#0c0a09"/><circle r="4.1" fill="#b9b2a6" stroke="#5c574f" stroke-width="0.25"/>
      <circle r="3.0" fill="#15120f"/><circle r="1.4" fill="#000"/></g>
  </defs>

  <!-- body face -->
  <rect x="5" y="5" width="190" height="113" rx="7" fill="url(#ps)" stroke="#000" stroke-width="0.6"/>
  <rect x="6.5" y="6.5" width="187" height="110" rx="6" fill="none" stroke="#37312b" stroke-width="0.3"/>

  <!-- USB-C on top-right edge -->
  <rect x="166" y="3.4" width="14" height="4.2" rx="2" fill="#0a0908" stroke="#5c574f" stroke-width="0.3"/>
  <text x="173" y="13" text-anchor="middle" font-size="2.2" fill="#8a837a">USB-C charge/MIDI</text>

  <!-- title -->
  <text x="100" y="15" text-anchor="middle" font-size="6.5" font-weight="700" letter-spacing="2" fill="#e6e1d8">IS MY</text>
  <text x="100" y="20" text-anchor="middle" font-size="2.3" letter-spacing="0.8" fill="#8a837a">PILOT · донор-аппаратура</text>

  <!-- top toggles -->
  <text x="62" y="28" text-anchor="middle" font-size="2.6" font-weight="600" fill="#d9d4cc">ARM</text>
  <use href="#tog" transform="translate(62,34)"/>
  <text x="66" y="32.5" font-size="1.9" fill="#8a837a">on</text><text x="66" y="37" font-size="1.9" fill="#6f685f">off</text>

  <text x="100" y="28" text-anchor="middle" font-size="2.6" font-weight="600" fill="#d9d4cc">MODE</text>
  <use href="#tog" transform="translate(100,34)"/>
  <text x="104" y="31.5" font-size="1.8" fill="#8a837a">SHAPER</text><text x="104" y="35" font-size="1.8" fill="#8a837a">RING</text><text x="104" y="38.5" font-size="1.8" fill="#8a837a">GATE</text>

  <text x="138" y="28" text-anchor="middle" font-size="2.6" font-weight="600" fill="#d9d4cc">LINK</text>
  <use href="#tog" transform="translate(138,34)"/>
  <text x="142" y="32.5" font-size="1.9" fill="#8a837a">sync</text><text x="142" y="37" font-size="1.9" fill="#6f685f">indep</text>

  <!-- shoulder knobs -->
  <text x="24" y="27" text-anchor="middle" font-size="2.6" font-weight="600" fill="#d9d4cc">LEVEL</text>
  <use href="#knob" transform="translate(24,36)"/>
  <text x="176" y="27" text-anchor="middle" font-size="2.6" font-weight="600" fill="#d9d4cc">TONE</text>
  <use href="#knob" transform="translate(176,36)"/>

  <!-- indicators -->
  <circle cx="78" cy="50" r="2.0" fill="url(#lG)"/><text x="78" y="55" text-anchor="middle" font-size="2" fill="#8a837a">ARM</text>
  <circle cx="90" cy="50" r="2.0" fill="url(#lA)"/><text x="90" y="55" text-anchor="middle" font-size="2" fill="#8a837a">ACT</text>
  <rect x="108" y="48.5" width="3" height="4" rx="0.6" fill="#4fbf6a"/>
  <rect x="112.5" y="48.5" width="3" height="4" rx="0.6" fill="#4fbf6a"/>
  <rect x="117" y="48.5" width="3" height="4" rx="0.6" fill="#e0a23a"/>
  <rect x="121.5" y="48.5" width="3" height="4" rx="0.6" fill="#3a342e"/>
  <text x="116" y="46.5" text-anchor="middle" font-size="2" fill="#8a837a">BATT</text>

  <!-- LEFT gimbal = active throttle -->
  <text x="54" y="62" text-anchor="middle" font-size="2.0" fill="#6f9aa8">throttle-гимбал</text>
  <text x="54" y="65.5" text-anchor="middle" font-size="2.3" font-weight="600" fill="#e8c9a8">DRIVE ↑↓ free</text>
  <circle cx="54" cy="86" r="18.5" fill="#0c0a09" stroke="#3a342e" stroke-width="0.5"/>
  <circle cx="54" cy="86" r="17" fill="#181512" stroke="#46403a" stroke-width="0.4"/>
  <line x1="54" y1="71" x2="54" y2="101" stroke="#6f685f" stroke-width="0.3" stroke-dasharray="1 1"/>
  <line x1="39" y1="86" x2="69" y2="86" stroke="#6f685f" stroke-width="0.3" stroke-dasharray="1 1"/>
  <circle cx="54" cy="86" r="8.5" fill="url(#stick)" stroke="#5c574f" stroke-width="0.4"/>
  <circle cx="54" cy="86" r="2" fill="#0c0a09"/>
  <text x="54" y="109" text-anchor="middle" font-size="2.3" font-weight="600" fill="#e8c9a8">BIAS ↔ center</text>
  <text x="54" y="113" text-anchor="middle" font-size="2.0" fill="#8a837a">press = GATE (note C2)</text>

  <!-- RIGHT gimbal = aux -->
  <text x="146" y="65.5" text-anchor="middle" font-size="2.3" font-weight="600" fill="#6f685f">AUX gimbal</text>
  <circle cx="146" cy="86" r="18.5" fill="#0c0a09" stroke="#3a342e" stroke-width="0.5"/>
  <circle cx="146" cy="86" r="17" fill="#141210" stroke="#332e29" stroke-width="0.4"/>
  <circle cx="146" cy="86" r="8.5" fill="url(#stick)" stroke="#46403a" stroke-width="0.4" opacity="0.7"/>
  <circle cx="146" cy="86" r="2" fill="#0c0a09"/>
  <text x="146" y="109" text-anchor="middle" font-size="2.0" fill="#6f685f">опц. 2-я пара CV / не задействован</text>

  <!-- bottom edge strip with jacks -->
  <rect x="5" y="120" width="190" height="15" rx="3" fill="#0d0b0a" stroke="#2a2521" stroke-width="0.4"/>
  <text x="9" y="124.5" font-size="1.9" letter-spacing="0.4" fill="#5d574f">НИЖНЯЯ КРОМКА</text>
  <use href="#jk" transform="translate(70,127.5)"/>
  <use href="#jk" transform="translate(85,127.5)"/>
  <use href="#jk" transform="translate(100,127.5)"/>
  <use href="#jk" transform="translate(140,127.5)"/>
  <use href="#jk" transform="translate(178,127.5)"/>
  <text x="70"  y="123.5" text-anchor="middle" font-size="1.8" fill="#7fa3b0">CV X</text>
  <text x="85"  y="123.5" text-anchor="middle" font-size="1.8" fill="#7fa3b0">CV Y</text>
  <text x="100" y="123.5" text-anchor="middle" font-size="1.8" fill="#7fa3b0">CV GATE</text>
  <text x="140" y="123.5" text-anchor="middle" font-size="1.8" fill="#8a837a">MIDI OUT (TRS)</text>
  <text x="178" y="123.5" text-anchor="middle" font-size="1.8" fill="#8a837a">FOOT (gate)</text>
</svg>
