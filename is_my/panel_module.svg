<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="70.8mm" height="128.5mm"
     viewBox="0 0 70.8 128.5" font-family="Helvetica, Arial, sans-serif">

  <!-- ====== defs: reusable parts ====== -->
  <defs>
    <!-- panel texture / subtle vertical sheen -->
    <linearGradient id="panelSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#211d19"/>
      <stop offset="0.5" stop-color="#1a1714"/>
      <stop offset="1"   stop-color="#100e0c"/>
    </linearGradient>
    <radialGradient id="knobGrad" cx="0.35" cy="0.30" r="0.8">
      <stop offset="0" stop-color="#3a342e"/>
      <stop offset="1" stop-color="#171411"/>
    </radialGradient>
    <radialGradient id="ledAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.5" stop-color="#e0a23a"/>
      <stop offset="1" stop-color="#7a5410"/>
    </radialGradient>
    <radialGradient id="ledGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b6f5c4"/>
      <stop offset="0.5" stop-color="#4fbf6a"/>
      <stop offset="1" stop-color="#16602c"/>
    </radialGradient>

    <!-- potentiometer / attenuverter knob -->
    <g id="pot">
      <circle r="6.9" fill="#0c0a09"/>
      <circle r="6.0" fill="url(#knobGrad)" stroke="#4a433d" stroke-width="0.3"/>
      <circle r="6.0" fill="none" stroke="#000" stroke-width="0.15" opacity="0.6"/>
      <line x1="0" y1="0" x2="-3.0" y2="-4.6" stroke="#d9d4cc" stroke-width="0.9" stroke-linecap="round"/>
      <circle r="0.7" fill="#0c0a09"/>
    </g>

    <!-- 3.5mm jack (input) -->
    <g id="jack">
      <circle r="3.6" fill="#0c0a09"/>
      <circle r="3.4" fill="#b9b2a6" stroke="#5c574f" stroke-width="0.2"/>
      <circle r="2.5" fill="#15120f"/>
      <circle r="1.15" fill="#000"/>
    </g>

    <!-- mounting slot -->
    <g id="slot">
      <rect x="-2.5" y="-1.6" width="5" height="3.2" rx="1.6" fill="#0a0908" stroke="#3a342e" stroke-width="0.2"/>
    </g>
  </defs>

  <!-- ====== panel body ====== -->
  <rect x="0" y="0" width="70.8" height="128.5" rx="1.2" fill="url(#panelSheen)" stroke="#000" stroke-width="0.4"/>
  <rect x="1.2" y="1.2" width="68.4" height="126.1" rx="0.8" fill="none" stroke="#37312b" stroke-width="0.25"/>

  <!-- mounting slots -->
  <use href="#slot" transform="translate(7.5,3.2)"/>
  <use href="#slot" transform="translate(63.3,3.2)"/>
  <use href="#slot" transform="translate(7.5,125.3)"/>
  <use href="#slot" transform="translate(63.3,125.3)"/>

  <!-- ====== title block ====== -->
  <text x="35.4" y="9.2" text-anchor="middle" font-size="6.2" font-weight="700"
        letter-spacing="1.6" fill="#e6e1d8">IS MY</text>
  <text x="35.4" y="12.8" text-anchor="middle" font-size="1.85" letter-spacing="0.9"
        fill="#8a837a">SYSTEM SUICIDE — No. 8</text>

  <!-- status LEDs flanking title -->
  <circle cx="11.5" cy="8.0" r="1.7" fill="url(#ledAmber)"/>
  <text x="11.5" y="13.2" text-anchor="middle" font-size="1.7" fill="#8a837a">ACT</text>
  <circle cx="59.3" cy="8.0" r="1.7" fill="url(#ledGreen)"/>
  <text x="59.3" y="13.2" text-anchor="middle" font-size="1.7" fill="#8a837a">ARM</text>

  <!-- divider: MOD -->
  <line x1="4" y1="17.5" x2="66.8" y2="17.5" stroke="#37312b" stroke-width="0.3"/>
  <text x="4.5" y="20.6" font-size="1.9" letter-spacing="0.8" fill="#6f685f">MODULATION · attenuverter + CV in</text>

  <!-- ====== BANK 1: attenuverters (pot over CV jack), 2x2 ====== -->
  <!-- column x: 23.0 / 47.8 ; rows pot 30/57, jack 42/69 -->

  <!-- DRIVE -->
  <text x="23.0" y="26.5" text-anchor="middle" font-size="2.5" font-weight="600" letter-spacing="0.5" fill="#d9d4cc">DRIVE</text>
  <use href="#pot"  transform="translate(23.0,33.0)"/>
  <use href="#jack" transform="translate(23.0,44.5)"/>
  <text x="23.0" y="49.6" text-anchor="middle" font-size="1.6" fill="#8a837a">CV</text>

  <!-- BIAS -->
  <text x="47.8" y="26.5" text-anchor="middle" font-size="2.5" font-weight="600" letter-spacing="0.5" fill="#d9d4cc">BIAS</text>
  <use href="#pot"  transform="translate(47.8,33.0)"/>
  <use href="#jack" transform="translate(47.8,44.5)"/>
  <text x="47.8" y="49.6" text-anchor="middle" font-size="1.6" fill="#8a837a">CV</text>

  <!-- LEVEL -->
  <text x="23.0" y="56.0" text-anchor="middle" font-size="2.5" font-weight="600" letter-spacing="0.5" fill="#d9d4cc">LEVEL</text>
  <use href="#pot"  transform="translate(23.0,62.5)"/>
  <use href="#jack" transform="translate(23.0,74.0)"/>
  <text x="23.0" y="79.1" text-anchor="middle" font-size="1.6" fill="#8a837a">CV</text>

  <!-- TONE -->
  <text x="47.8" y="56.0" text-anchor="middle" font-size="2.5" font-weight="600" letter-spacing="0.5" fill="#d9d4cc">TONE</text>
  <use href="#pot"  transform="translate(47.8,62.5)"/>
  <use href="#jack" transform="translate(47.8,74.0)"/>
  <text x="47.8" y="79.1" text-anchor="middle" font-size="1.6" fill="#8a837a">CV</text>

  <!-- divider: CV OUT -->
  <line x1="4" y1="83.5" x2="66.8" y2="83.5" stroke="#37312b" stroke-width="0.3"/>
  <text x="4.5" y="86.6" font-size="1.9" letter-spacing="0.8" fill="#6f685f">CV OUT · joystick passthrough</text>

  <!-- ====== BANK 2: CV out X / Y / GATE, 3 across ====== -->
  <!-- x: 16.5 / 35.4 / 54.3 ; y 94 -->
  <use href="#jack" transform="translate(16.5,94.5)"/>
  <text x="16.5" y="100.0" text-anchor="middle" font-size="2.2" font-weight="600" fill="#d9d4cc">X</text>
  <use href="#jack" transform="translate(35.4,94.5)"/>
  <text x="35.4" y="100.0" text-anchor="middle" font-size="2.2" font-weight="600" fill="#d9d4cc">Y</text>
  <use href="#jack" transform="translate(54.3,94.5)"/>
  <text x="54.3" y="100.0" text-anchor="middle" font-size="2.2" font-weight="600" fill="#d9d4cc">GATE</text>

  <!-- divider: I/O -->
  <line x1="4" y1="103.5" x2="66.8" y2="103.5" stroke="#37312b" stroke-width="0.3"/>
  <text x="4.5" y="106.6" font-size="1.9" letter-spacing="0.8" fill="#6f685f">AUDIO / MIDI</text>

  <!-- ====== BANK 3: I/O (no video knob) ====== -->
  <!-- row1 y 112.5: AUDIO IN | AUDIO OUT(inverted) -->
  <use href="#jack" transform="translate(23.0,112.5)"/>
  <text x="23.0" y="118.0" text-anchor="middle" font-size="1.7" fill="#8a837a">AUDIO IN</text>

  <use href="#jack" transform="translate(47.8,112.5)"/>
  <rect x="43.0" y="116.4" width="9.6" height="2.7" rx="0.5" fill="#cfc9bf"/>
  <text x="47.8" y="118.35" text-anchor="middle" font-size="1.7" font-weight="700" fill="#14110f">AUDIO OUT</text>

  <!-- row2 y 122: VIDEO IN (под пересмотром) | MIDI IN -->
  <use href="#jack" transform="translate(23.0,122.0)"/>
  <text x="23.0" y="127.3" text-anchor="middle" font-size="1.6" fill="#6f685f">VID IN ?</text>

  <use href="#jack" transform="translate(47.8,122.0)"/>
  <text x="47.8" y="127.3" text-anchor="middle" font-size="1.6" fill="#8a837a">MIDI IN</text>

</svg>
