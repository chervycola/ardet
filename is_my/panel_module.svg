<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="81.0mm" height="128.5mm"
     viewBox="0 0 81.0 128.5" font-family="Helvetica, Arial, sans-serif">

  <defs>
    <linearGradient id="panelSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#211d19"/>
      <stop offset="0.5" stop-color="#1a1714"/>
      <stop offset="1"   stop-color="#100e0c"/>
    </linearGradient>
    <radialGradient id="knobGrad" cx="0.35" cy="0.30" r="0.8">
      <stop offset="0" stop-color="#3a342e"/>
      <stop offset="1" stop-color="#171411"/>
    </radialGradient>
    <radialGradient id="knobVoice" cx="0.35" cy="0.30" r="0.8">
      <stop offset="0" stop-color="#42332a"/>
      <stop offset="1" stop-color="#1c1310"/>
    </radialGradient>
    <radialGradient id="ledAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.5" stop-color="#e0a23a"/>
      <stop offset="1" stop-color="#7a5410"/>
    </radialGradient>
    <radialGradient id="ledGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b6f5c4"/>
      <stop offset="0.5" stop-color="#4fbf6a"/>
      <stop offset="1" stop-color="#16602c"/>
    </radialGradient>

    <g id="pot">
      <circle r="6.9" fill="#0c0a09"/>
      <circle r="6.0" fill="url(#knobGrad)" stroke="#4a433d" stroke-width="0.3"/>
      <line x1="0" y1="0" x2="-3.0" y2="-4.6" stroke="#d9d4cc" stroke-width="0.9" stroke-linecap="round"/>
      <circle r="0.7" fill="#0c0a09"/>
    </g>
    <g id="potv">
      <circle r="6.9" fill="#0c0a09"/>
      <circle r="6.0" fill="url(#knobVoice)" stroke="#6b5240" stroke-width="0.3"/>
      <line x1="0" y1="0" x2="-3.0" y2="-4.6" stroke="#e8c9a8" stroke-width="0.9" stroke-linecap="round"/>
      <circle r="0.7" fill="#0c0a09"/>
    </g>
    <g id="jack">
      <circle r="3.6" fill="#0c0a09"/>
      <circle r="3.4" fill="#b9b2a6" stroke="#5c574f" stroke-width="0.2"/>
      <circle r="2.5" fill="#15120f"/>
      <circle r="1.15" fill="#000"/>
    </g>
    <g id="slot">
      <rect x="-2.5" y="-1.6" width="5" height="3.2" rx="1.6" fill="#0a0908" stroke="#3a342e" stroke-width="0.2"/>
    </g>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="81.0" height="128.5" rx="1.2" fill="url(#panelSheen)" stroke="#000" stroke-width="0.4"/>
  <rect x="1.2" y="1.2" width="78.6" height="126.1" rx="0.8" fill="none" stroke="#37312b" stroke-width="0.25"/>

  <use href="#slot" transform="translate(7.5,3.2)"/>
  <use href="#slot" transform="translate(73.5,3.2)"/>
  <use href="#slot" transform="translate(7.5,125.3)"/>
  <use href="#slot" transform="translate(73.5,125.3)"/>

  <!-- title -->
  <text x="40.5" y="9.2" text-anchor="middle" font-size="6.2" font-weight="700" letter-spacing="1.8" fill="#e6e1d8">IS MY</text>
  <text x="40.5" y="12.8" text-anchor="middle" font-size="1.85" letter-spacing="0.9" fill="#8a837a">SYSTEM SUICIDE — No. 8</text>
  <circle cx="10.5" cy="8.0" r="1.7" fill="url(#ledAmber)"/>
  <text x="10.5" y="13.0" text-anchor="middle" font-size="1.6" fill="#8a837a">ACT</text>
  <circle cx="70.5" cy="8.0" r="1.7" fill="url(#ledGreen)"/>
  <text x="70.5" y="13.0" text-anchor="middle" font-size="1.6" fill="#8a837a">ARM</text>

  <!-- divider PARAMETERS -->
  <line x1="4" y1="16.5" x2="77" y2="16.5" stroke="#37312b" stroke-width="0.3"/>
  <text x="4.5" y="19.4" font-size="1.85" letter-spacing="0.7" fill="#6f685f">MODULATION</text>
  <text x="76.5" y="19.4" text-anchor="end" font-size="1.85" letter-spacing="0.7" fill="#a07a5c">VOICE · godeater</text>
  <line x1="56" y1="21.5" x2="56" y2="98.5" stroke="#2a2521" stroke-width="0.25" stroke-dasharray="1.2 1.2"/>

  <!-- ===== POTS (c1=17, c2=40.5, c3=64) ===== -->
  <!-- row1 -->
  <text x="17"   y="24.0" text-anchor="middle" font-size="2.4" font-weight="600" fill="#d9d4cc">DRIVE</text>
  <use href="#pot" transform="translate(17,31.0)"/>
  <text x="40.5" y="24.0" text-anchor="middle" font-size="2.4" font-weight="600" fill="#d9d4cc">BIAS</text>
  <use href="#pot" transform="translate(40.5,31.0)"/>
  <text x="64"   y="24.0" text-anchor="middle" font-size="2.4" font-weight="600" fill="#e8c9a8">HPF</text>
  <use href="#potv" transform="translate(64,31.0)"/>

  <!-- row2 -->
  <text x="17"   y="41.0" text-anchor="middle" font-size="2.4" font-weight="600" fill="#d9d4cc">LEVEL</text>
  <use href="#pot" transform="translate(17,48.0)"/>
  <text x="40.5" y="41.0" text-anchor="middle" font-size="2.4" font-weight="600" fill="#d9d4cc">TONE</text>
  <use href="#pot" transform="translate(40.5,48.0)"/>
  <text x="64"   y="41.0" text-anchor="middle" font-size="2.4" font-weight="600" fill="#e8c9a8">MIX</text>
  <use href="#potv" transform="translate(64,48.0)"/>

  <!-- row3 BASS -->
  <text x="64"   y="58.0" text-anchor="middle" font-size="2.4" font-weight="600" fill="#e8c9a8">BASS</text>
  <use href="#potv" transform="translate(64,65.0)"/>

  <!-- divider CV IN -->
  <line x1="4" y1="73.0" x2="77" y2="73.0" stroke="#37312b" stroke-width="0.3"/>
  <text x="4.5" y="75.9" font-size="1.8" letter-spacing="0.6" fill="#6f685f">CV IN · attenuverted · normalled → pult</text>

  <!-- CV-in jacks row1 -->
  <use href="#jack" transform="translate(17,81.5)"/>
  <text x="17" y="86.7" text-anchor="middle" font-size="1.5" fill="#8a837a">DRIVE</text>
  <use href="#jack" transform="translate(40.5,81.5)"/>
  <text x="40.5" y="86.7" text-anchor="middle" font-size="1.5" fill="#8a837a">BIAS</text>
  <use href="#jack" transform="translate(64,81.5)"/>
  <text x="64" y="86.7" text-anchor="middle" font-size="1.5" fill="#a98a6f">HPF</text>

  <!-- CV-in jacks row2 -->
  <use href="#jack" transform="translate(17,92.0)"/>
  <text x="17" y="97.2" text-anchor="middle" font-size="1.5" fill="#8a837a">LEVEL</text>
  <use href="#jack" transform="translate(40.5,92.0)"/>
  <text x="40.5" y="97.2" text-anchor="middle" font-size="1.5" fill="#8a837a">TONE</text>
  <use href="#jack" transform="translate(64,92.0)"/>
  <text x="64" y="97.2" text-anchor="middle" font-size="1.5" fill="#a98a6f">MIX</text>

  <!-- divider CV OUT -->
  <line x1="4" y1="101.5" x2="77" y2="101.5" stroke="#37312b" stroke-width="0.3"/>
  <text x="4.5" y="104.4" font-size="1.8" letter-spacing="0.6" fill="#6f685f">CV OUT · joystick passthrough</text>

  <use href="#jack" transform="translate(17,109.5)"/>
  <text x="17" y="114.9" text-anchor="middle" font-size="2.1" font-weight="600" fill="#d9d4cc">X</text>
  <use href="#jack" transform="translate(40.5,109.5)"/>
  <text x="40.5" y="114.9" text-anchor="middle" font-size="2.1" font-weight="600" fill="#d9d4cc">Y</text>
  <use href="#jack" transform="translate(64,109.5)"/>
  <text x="64" y="114.9" text-anchor="middle" font-size="2.1" font-weight="600" fill="#d9d4cc">GATE</text>

  <!-- divider AUDIO/MIDI -->
  <line x1="4" y1="117.0" x2="77" y2="117.0" stroke="#37312b" stroke-width="0.3"/>

  <use href="#jack" transform="translate(17,122.0)"/>
  <text x="17" y="127.2" text-anchor="middle" font-size="1.5" fill="#8a837a">AUDIO IN</text>
  <use href="#jack" transform="translate(40.5,122.0)"/>
  <rect x="35.5" y="125.5" width="10.0" height="2.5" rx="0.5" fill="#cfc9bf"/>
  <text x="40.5" y="127.35" text-anchor="middle" font-size="1.5" font-weight="700" fill="#14110f">AUDIO OUT</text>
  <use href="#jack" transform="translate(64,122.0)"/>
  <text x="64" y="127.2" text-anchor="middle" font-size="1.5" fill="#8a837a">MIDI IN</text>

</svg>
