<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="101.6mm" height="128.5mm"
     viewBox="0 0 101.6 128.5" font-family="Helvetica, Arial, sans-serif">

  <defs>
    <linearGradient id="panelSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#211d19"/>
      <stop offset="0.5" stop-color="#1a1714"/>
      <stop offset="1"   stop-color="#100e0c"/>
    </linearGradient>
    <radialGradient id="knobGrad" cx="0.35" cy="0.30" r="0.8">
      <stop offset="0" stop-color="#3a342e"/><stop offset="1" stop-color="#171411"/>
    </radialGradient>
    <radialGradient id="knobVoice" cx="0.35" cy="0.30" r="0.8">
      <stop offset="0" stop-color="#42332a"/><stop offset="1" stop-color="#1c1310"/>
    </radialGradient>
    <radialGradient id="knobFilt" cx="0.35" cy="0.30" r="0.8">
      <stop offset="0" stop-color="#2c3a42"/><stop offset="1" stop-color="#101a1f"/>
    </radialGradient>
    <radialGradient id="ledAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a"/><stop offset="0.5" stop-color="#e0a23a"/><stop offset="1" stop-color="#7a5410"/>
    </radialGradient>
    <radialGradient id="ledGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b6f5c4"/><stop offset="0.5" stop-color="#4fbf6a"/><stop offset="1" stop-color="#16602c"/>
    </radialGradient>

    <g id="pot">
      <circle r="6.6" fill="#0c0a09"/><circle r="5.8" fill="url(#knobGrad)" stroke="#4a433d" stroke-width="0.3"/>
      <line x1="0" y1="0" x2="-2.9" y2="-4.4" stroke="#d9d4cc" stroke-width="0.9" stroke-linecap="round"/><circle r="0.7" fill="#0c0a09"/>
    </g>
    <g id="potv">
      <circle r="6.6" fill="#0c0a09"/><circle r="5.8" fill="url(#knobVoice)" stroke="#6b5240" stroke-width="0.3"/>
      <line x1="0" y1="0" x2="-2.9" y2="-4.4" stroke="#e8c9a8" stroke-width="0.9" stroke-linecap="round"/><circle r="0.7" fill="#0c0a09"/>
    </g>
    <g id="potf">
      <circle r="6.6" fill="#0c0a09"/><circle r="5.8" fill="url(#knobFilt)" stroke="#3f6675" stroke-width="0.3"/>
      <line x1="0" y1="0" x2="-2.9" y2="-4.4" stroke="#bfe3ee" stroke-width="0.9" stroke-linecap="round"/><circle r="0.7" fill="#0c0a09"/>
    </g>
    <g id="jack">
      <circle r="3.5" fill="#0c0a09"/><circle r="3.3" fill="#b9b2a6" stroke="#5c574f" stroke-width="0.2"/>
      <circle r="2.4" fill="#15120f"/><circle r="1.1" fill="#000"/>
    </g>
    <g id="sw">
      <rect x="-1.9" y="-3.6" width="3.8" height="7.2" rx="1.6" fill="#0c0a09" stroke="#4a433d" stroke-width="0.3"/>
      <circle cx="0" cy="-1.7" r="1.55" fill="#b9b2a6" stroke="#5c574f" stroke-width="0.2"/>
    </g>
    <g id="slot"><rect x="-2.5" y="-1.6" width="5" height="3.2" rx="1.6" fill="#0a0908" stroke="#3a342e" stroke-width="0.2"/></g>
  </defs>

  <rect x="0" y="0" width="101.6" height="128.5" rx="1.2" fill="url(#panelSheen)" stroke="#000" stroke-width="0.4"/>
  <rect x="1.2" y="1.2" width="99.2" height="126.1" rx="0.8" fill="none" stroke="#37312b" stroke-width="0.25"/>
  <use href="#slot" transform="translate(7.5,3.2)"/>
  <use href="#slot" transform="translate(94.1,3.2)"/>
  <use href="#slot" transform="translate(7.5,125.3)"/>
  <use href="#slot" transform="translate(94.1,125.3)"/>

  <!-- title -->
  <text x="50.8" y="9.0" text-anchor="middle" font-size="6.0" font-weight="700" letter-spacing="2.0" fill="#e6e1d8">IS MY</text>
  <text x="50.8" y="12.6" text-anchor="middle" font-size="1.8" letter-spacing="0.9" fill="#8a837a">SYSTEM SUICIDE — No. 8</text>
  <circle cx="11.0" cy="7.8" r="1.7" fill="url(#ledAmber)"/><text x="11.0" y="12.6" text-anchor="middle" font-size="1.5" fill="#8a837a">ACT</text>
  <circle cx="90.6" cy="7.8" r="1.7" fill="url(#ledGreen)"/><text x="90.6" y="12.6" text-anchor="middle" font-size="1.5" fill="#8a837a">ARM</text>

  <!-- divider + group headers -->
  <line x1="4" y1="15.5" x2="97.6" y2="15.5" stroke="#37312b" stroke-width="0.3"/>
  <text x="28.7" y="18.5" text-anchor="middle" font-size="1.8" letter-spacing="0.6" fill="#6f685f">MODULATION</text>
  <text x="61"   y="18.5" text-anchor="middle" font-size="1.8" letter-spacing="0.6" fill="#a07a5c">GODEATER</text>
  <text x="82.5" y="18.5" text-anchor="middle" font-size="1.8" letter-spacing="0.6" fill="#6f9aa8">POLIVOKS</text>
  <line x1="50.5" y1="20" x2="50.5" y2="99" stroke="#2a2521" stroke-width="0.25" stroke-dasharray="1.2 1.2"/>
  <line x1="71.5" y1="20" x2="71.5" y2="99" stroke="#2a2521" stroke-width="0.25" stroke-dasharray="1.2 1.2"/>

  <!-- ===== POTS  c1=18 c2=39.5 c3=61 c4=82.5 ===== -->
  <!-- row1 y27 -->
  <text x="18"   y="21.5" text-anchor="middle" font-size="2.3" font-weight="600" fill="#d9d4cc">DRIVE</text>
  <use href="#pot"  transform="translate(18,27)"/>
  <text x="39.5" y="21.5" text-anchor="middle" font-size="2.3" font-weight="600" fill="#d9d4cc">BIAS</text>
  <use href="#pot"  transform="translate(39.5,27)"/>
  <text x="61"   y="21.5" text-anchor="middle" font-size="2.3" font-weight="600" fill="#e8c9a8">HPF</text>
  <use href="#potv" transform="translate(61,27)"/>
  <text x="82.5" y="21.5" text-anchor="middle" font-size="2.3" font-weight="600" fill="#bfe3ee">CUTOFF</text>
  <use href="#potf" transform="translate(82.5,27)"/>

  <!-- row2 y44 -->
  <text x="18"   y="38.5" text-anchor="middle" font-size="2.3" font-weight="600" fill="#d9d4cc">LEVEL</text>
  <use href="#pot"  transform="translate(18,44)"/>
  <text x="39.5" y="38.5" text-anchor="middle" font-size="2.3" font-weight="600" fill="#d9d4cc">TONE</text>
  <use href="#pot"  transform="translate(39.5,44)"/>
  <text x="61"   y="38.5" text-anchor="middle" font-size="2.3" font-weight="600" fill="#e8c9a8">MIX</text>
  <use href="#potv" transform="translate(61,44)"/>
  <text x="82.5" y="38.5" text-anchor="middle" font-size="2.3" font-weight="600" fill="#bfe3ee">RESO</text>
  <use href="#potf" transform="translate(82.5,44)"/>

  <!-- row3: BASS (c3) + switches (c4) -->
  <text x="61"   y="55.5" text-anchor="middle" font-size="2.3" font-weight="600" fill="#e8c9a8">BASS</text>
  <use href="#potv" transform="translate(61,61)"/>

  <text x="78" y="53.5" text-anchor="middle" font-size="1.7" fill="#6f9aa8">MODE-F</text>
  <use href="#sw" transform="translate(78,59)"/>
  <text x="82.0" y="57.0" font-size="1.5" fill="#9fb8c2">LP</text>
  <text x="82.0" y="61.5" font-size="1.5" fill="#6a7d84">BP</text>

  <text x="78" y="67.0" text-anchor="middle" font-size="1.7" fill="#6f9aa8">ROUTE</text>
  <use href="#sw" transform="translate(78,72.5)"/>
  <text x="82.0" y="70.5" font-size="1.5" fill="#9fb8c2">pre</text>
  <text x="82.0" y="75.0" font-size="1.5" fill="#6a7d84">post</text>

  <!-- divider CV IN -->
  <line x1="4" y1="78.0" x2="68" y2="78.0" stroke="#37312b" stroke-width="0.3"/>
  <text x="4.5" y="81.0" font-size="1.7" letter-spacing="0.5" fill="#6f685f">CV IN · attenuverted (mod) · normalled → pult</text>

  <!-- CV-in row1 y86 -->
  <use href="#jack" transform="translate(18,86)"/><text x="18" y="91.0" text-anchor="middle" font-size="1.4" fill="#8a837a">DRIVE</text>
  <use href="#jack" transform="translate(39.5,86)"/><text x="39.5" y="91.0" text-anchor="middle" font-size="1.4" fill="#8a837a">BIAS</text>
  <use href="#jack" transform="translate(61,86)"/><text x="61" y="91.0" text-anchor="middle" font-size="1.4" fill="#a98a6f">HPF</text>
  <use href="#jack" transform="translate(82.5,86)"/><text x="82.5" y="91.0" text-anchor="middle" font-size="1.4" fill="#7fa3b0">CUTOFF</text>

  <!-- CV-in row2 y97 -->
  <use href="#jack" transform="translate(18,97)"/><text x="18" y="102.0" text-anchor="middle" font-size="1.4" fill="#8a837a">LEVEL</text>
  <use href="#jack" transform="translate(39.5,97)"/><text x="39.5" y="102.0" text-anchor="middle" font-size="1.4" fill="#8a837a">TONE</text>
  <use href="#jack" transform="translate(61,97)"/><text x="61" y="102.0" text-anchor="middle" font-size="1.4" fill="#a98a6f">MIX</text>
  <use href="#jack" transform="translate(82.5,97)"/><text x="82.5" y="102.0" text-anchor="middle" font-size="1.4" fill="#7fa3b0">RESO</text>

  <!-- divider CV OUT -->
  <line x1="4" y1="106.0" x2="97.6" y2="106.0" stroke="#37312b" stroke-width="0.3"/>
  <text x="4.5" y="109.0" font-size="1.7" letter-spacing="0.5" fill="#6f685f">CV OUT · joystick passthrough</text>

  <use href="#jack" transform="translate(18,113.5)"/><text x="18" y="118.6" text-anchor="middle" font-size="2.0" font-weight="600" fill="#d9d4cc">X</text>
  <use href="#jack" transform="translate(39.5,113.5)"/><text x="39.5" y="118.6" text-anchor="middle" font-size="2.0" font-weight="600" fill="#d9d4cc">Y</text>
  <use href="#jack" transform="translate(61,113.5)"/><text x="61" y="118.6" text-anchor="middle" font-size="2.0" font-weight="600" fill="#d9d4cc">GATE</text>

  <!-- I/O on the right of cv-out row -->
  <use href="#jack" transform="translate(82.5,113.5)"/><text x="82.5" y="118.6" text-anchor="middle" font-size="1.4" fill="#8a837a">MIDI IN</text>

  <!-- divider AUDIO -->
  <line x1="4" y1="121.0" x2="97.6" y2="121.0" stroke="#2a2521" stroke-width="0.25"/>
  <use href="#jack" transform="translate(39.5,124.5)"/><text x="29.0" y="125.6" text-anchor="middle" font-size="1.4" fill="#8a837a">AUDIO IN ▸</text>
  <rect x="45.5" y="123.0" width="10.0" height="2.5" rx="0.5" fill="#cfc9bf"/>
  <text x="50.5" y="124.85" text-anchor="middle" font-size="1.5" font-weight="700" fill="#14110f">AUDIO OUT</text>
  <use href="#jack" transform="translate(61,124.5)"/>

</svg>
