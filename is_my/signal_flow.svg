<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="800" viewBox="0 0 344 200"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#d9c0a0"/></marker>
    <marker id="arrb" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#7fa3b0"/></marker>
    <marker id="arrg" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#9a8f80"/></marker>
    <marker id="arrc" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c98f5a"/></marker>
  </defs>

  <rect x="0" y="0" width="344" height="200" fill="#14110f"/>
  <text x="6" y="6.5" font-size="4.2" font-weight="700" letter-spacing="0.6" fill="#e6e1d8">IS MY — signal flow</text>

  <!-- ===================== CONTROL HEADER ===================== -->
  <rect x="6" y="11" width="40" height="20" rx="1.6" fill="#15191c" stroke="#6f9aa8" stroke-width="0.4"/>
  <text x="26" y="19" text-anchor="middle" font-size="3" font-weight="600" fill="#cfe0e6">PULT (донор)</text>
  <text x="26" y="24.5" text-anchor="middle" font-size="2.3" fill="#8aa3ac">джойстик·ручки·свитчи</text>

  <text x="52" y="17.5" font-size="2.3" fill="#8aa3ac">TRS MIDI</text>
  <line x1="46" y1="21" x2="57.5" y2="21" stroke="#7fa3b0" stroke-width="0.5" marker-end="url(#arrb)"/>

  <rect x="58" y="11" width="42" height="20" rx="1.6" fill="#15191c" stroke="#6f9aa8" stroke-width="0.4"/>
  <text x="79" y="19" text-anchor="middle" font-size="3" font-weight="600" fill="#cfe0e6">MCU + DAC</text>
  <text x="79" y="24.5" text-anchor="middle" font-size="2.3" fill="#8aa3ac">MIDI → CV</text>

  <line x1="100" y1="21" x2="105.5" y2="21" stroke="#7fa3b0" stroke-width="0.5" marker-end="url(#arrb)"/>
  <rect x="106" y="15.5" width="150" height="11" rx="1.6" fill="#1a2226" stroke="#6f9aa8" stroke-width="0.4"/>
  <text x="181" y="22.5" text-anchor="middle" font-size="3" font-weight="600" letter-spacing="0.4" fill="#cfe0e6">CV BUS · DRIVE  BIAS  LEVEL  TONE  GATE</text>

  <line x1="256" y1="21" x2="261.5" y2="21" stroke="#7fa3b0" stroke-width="0.5" marker-end="url(#arrb)"/>
  <rect x="262" y="11" width="78" height="20" rx="1.6" fill="#15191c" stroke="#6f9aa8" stroke-width="0.4"/>
  <text x="301" y="19" text-anchor="middle" font-size="3" font-weight="600" fill="#cfe0e6">CV OUT  X · Y · GATE</text>
  <text x="301" y="24.5" text-anchor="middle" font-size="2.3" fill="#8aa3ac">→ другие модули системы</text>

  <!-- control feeds (dashed) bus -> audio params -->
  <g stroke="#7fa3b0" stroke-width="0.4" stroke-dasharray="1.4 1.2" fill="none">
    <line x1="72"  y1="26.5" x2="72"  y2="69" marker-end="url(#arrb)"/>
    <line x1="140" y1="26.5" x2="140" y2="65" marker-end="url(#arrb)"/>
    <line x1="211" y1="26.5" x2="211" y2="69" marker-end="url(#arrb)"/>
    <line x1="294" y1="26.5" x2="294" y2="69" marker-end="url(#arrb)"/>
  </g>
  <g font-size="2.1" fill="#8aa3ac" text-anchor="middle">
    <text x="72"  y="48">DRIVE</text>
    <text x="140" y="44">BIAS · MODE</text>
    <text x="211" y="48">TONE</text>
    <text x="294" y="48">LEVEL·ARM·GATE</text>
  </g>

  <!-- ===================== AUDIO PATH ===================== -->
  <g font-size="2.5" font-weight="600" fill="#f0e6da" text-anchor="middle">
    <!-- blocks -->
    <rect x="6"   y="70" width="20" height="24" rx="1.6" fill="#1d1916" stroke="#c98f5a" stroke-width="0.4"/>
    <text x="16" y="80">AUDIO</text><text x="16" y="84.5">IN</text>

    <rect x="30"  y="70" width="26" height="24" rx="1.6" fill="#1d1916" stroke="#c98f5a" stroke-width="0.4"/>
    <text x="43" y="80">INPUT</text><text x="43" y="84.5">BUF</text>

    <rect x="60"  y="70" width="24" height="24" rx="1.6" fill="#1d1916" stroke="#c98f5a" stroke-width="0.4"/>
    <text x="72" y="80">INPUT</text><text x="72" y="84.5">DRIVE</text>

    <rect x="88"  y="70" width="26" height="24" rx="1.6" fill="#1d1916" stroke="#c98f5a" stroke-width="0.4"/>
    <text x="101" y="80">PRE-HPF</text><text x="101" y="84.5" font-size="2.1" font-weight="400" fill="#b59">бас↔fuzz</text>

    <!-- CORE <-> FILTER compound (ROUTE) -->
    <rect x="118" y="66" width="80" height="32" rx="2" fill="#181613" stroke="#9a8f80" stroke-width="0.4" stroke-dasharray="2 1.2"/>
    <text x="158" y="69.5" text-anchor="middle" font-size="2.2" font-weight="600" fill="#cdbfae">ROUTE  pre ↔ post</text>
    <rect x="121" y="72" width="36" height="20" rx="1.6" fill="#1d1916" stroke="#c98f5a" stroke-width="0.4"/>
    <text x="139" y="80">MOSFET CORE</text><text x="139" y="84.5" font-size="2.1" font-weight="400" fill="#cdbfae">S1 → S2</text>
    <text x="139" y="89" font-size="1.9" font-weight="400" fill="#8a837a">SHAPER·RING·GATE</text>
    <text x="159" y="83.2" text-anchor="middle" font-size="3.4" fill="#cdbfae">↔</text>
    <rect x="161" y="72" width="34" height="20" rx="1.6" fill="#1d1916" stroke="#6f9aa8" stroke-width="0.4"/>
    <text x="178" y="80" fill="#cfe0e6">VCF</text><text x="178" y="84.5" font-size="2.1" font-weight="400" fill="#9fb8c2">LP / BP · reso</text>

    <rect x="202" y="70" width="20" height="24" rx="1.6" fill="#1d1916" stroke="#c98f5a" stroke-width="0.4"/>
    <text x="212" y="83">TONE</text>

    <rect x="226" y="70" width="20" height="24" rx="1.6" fill="#1d1916" stroke="#c98f5a" stroke-width="0.4"/>
    <text x="236" y="83">BASS</text>

    <rect x="250" y="70" width="24" height="24" rx="1.6" fill="#1d1916" stroke="#c98f5a" stroke-width="0.4"/>
    <text x="262" y="80">MIX</text><text x="262" y="84.5" font-size="2.1" font-weight="400" fill="#cdbfae">dry/wet</text>

    <rect x="278" y="70" width="32" height="24" rx="1.6" fill="#1d1916" stroke="#e0a23a" stroke-width="0.5"/>
    <text x="294" y="80" fill="#ffd9a0">OUT VCA</text><text x="294" y="84.5" font-size="2.1" font-weight="400" fill="#cd9a66">грязный · ARM</text>

    <rect x="314" y="70" width="24" height="24" rx="1.6" fill="#1d1916" stroke="#c98f5a" stroke-width="0.4"/>
    <text x="326" y="80">AUDIO</text><text x="326" y="84.5">OUT</text>
  </g>

  <!-- audio arrows -->
  <g stroke="#d9c0a0" stroke-width="0.6" marker-end="url(#arr)">
    <line x1="26"  y1="82" x2="29.5"  y2="82"/>
    <line x1="56"  y1="82" x2="59.5"  y2="82"/>
    <line x1="84"  y1="82" x2="87.5"  y2="82"/>
    <line x1="114" y1="82" x2="117.5" y2="82"/>
    <line x1="198" y1="82" x2="201.5" y2="82"/>
    <line x1="222" y1="82" x2="225.5" y2="82"/>
    <line x1="246" y1="82" x2="249.5" y2="82"/>
    <line x1="274" y1="82" x2="277.5" y2="82"/>
    <line x1="310" y1="82" x2="313.5" y2="82"/>
  </g>

  <!-- clean tap branch -->
  <circle cx="116" cy="82" r="0.9" fill="#d9c0a0"/>
  <path d="M116,82 L116,122 L262,122 L262,94.5" fill="none" stroke="#c98f5a" stroke-width="0.5" stroke-dasharray="2.5 1.4" marker-end="url(#arrc)"/>
  <text x="180" y="120.5" text-anchor="middle" font-size="2.3" fill="#cdbfae">clean tap → MIX (dry)</text>

  <!-- ===================== CV IN FOOTER ===================== -->
  <rect x="6" y="150" width="250" height="22" rx="1.6" fill="#1a1714" stroke="#9a8f80" stroke-width="0.4"/>
  <text x="12" y="158" font-size="2.7" font-weight="600" fill="#cdbfae">CV IN · switched · attenuverted · normalled → пульт</text>
  <text x="12" y="165" font-size="2.4" fill="#a79c8d">DRIVE  BIAS  LEVEL  TONE   ·   HPF  MIX  CUTOFF  RESO</text>
  <text x="12" y="170.5" font-size="2.1" fill="#8a837a">нет кабеля → CV с пульта;  есть кабель → внешнее CV перехватывает</text>

  <!-- cv-in dashed up to params -->
  <g stroke="#9a8f80" stroke-width="0.4" stroke-dasharray="1.4 1.2" fill="none">
    <line x1="101" y1="150" x2="101" y2="95" marker-end="url(#arrg)"/>
    <line x1="178" y1="150" x2="178" y2="99" marker-end="url(#arrg)"/>
    <line x1="262" y1="150" x2="262" y2="124" marker-end="url(#arrg)"/>
  </g>
  <g font-size="2" fill="#8a837a" text-anchor="middle">
    <text x="101" y="146">HPF</text>
    <text x="178" y="146">CUTOFF·RESO</text>
    <text x="262" y="146">MIX</text>
  </g>

  <!-- legend -->
  <g font-size="2.3">
    <line x1="266" y1="155" x2="276" y2="155" stroke="#d9c0a0" stroke-width="0.6" marker-end="url(#arr)"/>
    <text x="278" y="156" fill="#a79c8d">аудио</text>
    <line x1="266" y1="161" x2="276" y2="161" stroke="#7fa3b0" stroke-width="0.4" stroke-dasharray="1.4 1.2" marker-end="url(#arrb)"/>
    <text x="278" y="162" fill="#a79c8d">control (пульт)</text>
    <line x1="266" y1="167" x2="276" y2="167" stroke="#9a8f80" stroke-width="0.4" stroke-dasharray="1.4 1.2" marker-end="url(#arrg)"/>
    <text x="278" y="168" fill="#a79c8d">CV in</text>
  </g>
</svg>
